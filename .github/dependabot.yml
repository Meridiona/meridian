# Dependency updates.
#
# Deliberately conservative: everything is grouped and PR counts are capped, because
# an unattended flood of single-dependency PRs costs more review attention than it
# buys. Security advisories are exempt from the grouping and arrive regardless.
#
# GitHub Actions is checked weekly rather than monthly - a compromised or retagged
# action is a supply-chain path into the signed release build.
version: 2

updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      cargo:
        patterns: ['*']
        update-types: [minor, patch]
    # Pinned deliberately - see CLAUDE.md. Bumping these needs a human decision,
    # not an automated PR.
    ignore:
      - dependency-name: screenpipe-*
      - dependency-name: tauri-plugin-notifications

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: npm
    directories:
      - /
      - /ui
      - /tray
      - /packages/meridian-mcp
      - /packages/meridian-design-system
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      npm:
        patterns: ['*']
        update-types: [minor, patch]
