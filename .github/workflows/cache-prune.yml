name: Cache prune

# DELETES SUPERSEDED ACTIONS CACHES. COMPILES NOTHING.
#
# ── WHAT THIS REPLACED ───────────────────────────────────────────────────────
#
# This file is what remains of `cache-warm.yml`, which recompiled the entire app
# on `main` — nightly and on every push — for the sole purpose of manufacturing
# a rust-cache entry that release-build.yml could read.
#
# It existed because release-build.yml was triggered by a TAG, and GitHub scopes
# the Actions cache by `github.ref` with no workaround for tags: "tags only have
# access to caches created in default branch". A tag build could not read
# pre-main's cache, and every release cut a new tag, so nothing it saved was
# ever restorable.
#
# The warm workflow paid for that with a 25-minute compile it threw away, and
# with a contract nothing enforced: its runner, toolchain, target, cargo
# invocation, shared-key AND environment had to match release-build.yml byte for
# byte. The environment silently did not — `CARGO_NET_RETRY` was set in one file
# and not the other — so for this pipeline's entire history the warm job wrote a
# cache under a key the release build never asked for, and every release
# compiled cold (21 min macOS, 36 min Windows) with every check green.
#
# release-build.yml is now DISPATCHED against `main` with the tag as an input,
# so it reads main's cache scope and writes back to it. Every release warms the
# next one from its own real workload. There is nothing left to seed, no second
# copy of the build to keep in step, and no nightly compile.
#
# ── WHAT IS LEFT, AND WHY IT IS STILL NEEDED ─────────────────────────────────
#
# Pruning, which was always a separate concern that merely lived in that file.
#
# Actions caches are IMMUTABLE per key, and rust-cache's key carries a hash that
# shifts as the toolchain and workspace move. So every run that cannot reuse an
# exact prior key writes a NEW ~1-1.5 GB entry instead of replacing the old one,
# and the old one sits there unreachable until the repo crosses its 10 GiB cap —
# at which point GitHub's LRU evicts SOMETHING, not necessarily the stale one.
#
# Measured here, repeatedly: 11.3 GB across 34 caches once (cleared by hand),
# back to 10.49 GB after a single run, and `ci-macos-silicon` found sitting at
# FOUR duplicate copies of itself. Manual cleanup does not scale.

on:
  # After every merge to either release branch, so a superseded entry is reaped
  # promptly rather than sitting until the next night, and nightly as a backstop
  # for quiet stretches. 04:15 UTC.
  push:
    branches: [main, pre-main]
  schedule:
    - cron: "15 4 * * *"
  workflow_dispatch:

# Never two at once: both would list the same caches and race to delete the same
# ids, and the loser logs a pile of 404 warnings. Cheap enough that cancelling a
# run in progress costs nothing.
concurrency:
  group: cache-prune
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prune-stale-caches:
    name: Prune superseded caches
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Deleting a cache entry via the REST API needs actions:write — kept
      # scoped to just this job, not the whole workflow.
      actions: write
    steps:
      - name: Delete every cache except the newest per prefix on its own ref
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # prefix|ref pairs. Release caches live on main (this workflow's own
          # target); ci.yml's caches save on pre-main (see ci.yml's rust/
          # rust-windows jobs' save-if) — a different ref, so each pair is
          # queried separately rather than assuming one ref for everything.
          pairs=(
            "v0-rust-macos-release-aarch64-apple-darwin|refs/heads/main"
            "v0-rust-windows-release-x86_64-pc-windows-msvc|refs/heads/main"
            "v0-rust-ci-macos-silicon|refs/heads/pre-main"
            "v0-rust-ci-windows|refs/heads/pre-main"
          )
          # Counts so a SYSTEMATIC failure is loud. Every pair failing used to
          # look identical to a quiet, healthy run: see the `--jq` note below.
          attempted=0
          failed=0
          for pair in "${pairs[@]}"; do
            prefix="${pair%%|*}"
            ref="${pair##*|}"
            attempted=$((attempted + 1))
            echo "=== ${prefix} (${ref}) ==="
            # --paginate: without it, per_page=100 silently caps this pair at
            # its first 100 caches with no follow-up page — this repo already
            # climbed to 42 caches after a single warm run, so a busy prefix
            # exceeding 100 would hide older stale entries from pruning
            # entirely, the exact unbounded-growth failure this job exists to
            # close. `|| true` on the listing itself: a transient gh api
            # failure (rate limit, etc.) on one pair must not abort the whole
            # script under set -euo pipefail — skip just this pair and let
            # the next scheduled run retry it, same tolerance the delete call
            # below already has.
            #
            # The prefix reaches jq through the ENVIRONMENT, not `--arg`.
            # `gh api --jq` takes exactly one argument, the filter — it is not
            # jq's CLI and does not forward jq's flags. Written as
            # `--jq --arg p "$prefix" '<filter>'` it parsed as four arguments
            # and gh rejected the call with "accepts 1 arg(s), received 4",
            # EVERY time, for every pair. The `|| { warning; continue; }` below
            # then swallowed it into a `::warning::` — which does not fail a
            # run and which nobody reads — so this job reported success while
            # deleting nothing at all, for its entire history. That is why the
            # pool kept climbing to 8-11 GB and had to be cleared by hand.
            # `env.PREFIX` also cannot inject into the filter the way string
            # interpolation could.
            stale=$(PREFIX="$prefix" gh api --paginate "repos/${{ github.repository }}/actions/caches?per_page=100&ref=${ref}" \
              --jq '[.actions_caches[] | select(.key | startswith(env.PREFIX))] | sort_by(.created_at) | reverse | .[1:] | .[].id') \
              || { failed=$((failed + 1)); echo "::warning::failed to list caches for ${prefix} (${ref}), skipping this pair"; continue; }
            if [ -z "$stale" ]; then
              echo "nothing to prune"
              continue
            fi
            for id in $stale; do
              echo "deleting superseded cache $id"
              gh api -X DELETE "repos/${{ github.repository }}/actions/caches/${id}" \
                || echo "::warning::failed to delete cache ${id} (non-fatal, next run will retry)"
            done
          done

          # One pair failing is a transient blip worth tolerating; ALL of them
          # failing is the listing call being broken, which is the exact
          # condition that hid for this job's whole history behind a warning
          # nobody reads. Fail loudly so it cannot happen silently twice.
          if [ "${failed}" -eq "${attempted}" ] && [ "${attempted}" -gt 0 ]; then
            echo "::error::every prefix failed to list (${failed}/${attempted}) — the listing call itself is broken, not a transient API error. Nothing was pruned."
            exit 1
          fi

      - name: Reap caches no run can ever restore
        env:
          GH_TOKEN: ${{ github.token }}
        # THE POOL IS 10 GiB, SHARED, AND EVICTED BY LRU ACROSS EVERYTHING.
        #
        # That is the whole problem. The four tarballs this project actually
        # needs are ~6 GiB of it, so anything else that accumulates competes
        # directly with them — and when the cap is crossed GitHub evicts the
        # OLDEST entry, not the most useless one. Measured at 8.94 GiB with two
        # categories of provably dead weight in the way:
        #
        #   TAG-SCOPED (0.74 GiB, +~380 MiB per release). GitHub scopes caches
        #   by ref, and a run may restore only from its own ref or the default
        #   branch. So one tag's cache is unreadable by every other tag, by
        #   every branch, forever — it is garbage the instant that build ends.
        #   These stop being created at all once `main` carries the
        #   dispatch-on-main release workflow (release builds then run with
        #   github.ref = refs/heads/main), so this is mostly clearing a legacy
        #   pile. Re-running a build for the SAME tag would go cold, which is
        #   the one thing given up here and is worth roughly nothing: with
        #   dispatch-on-main a rebuild restores main's cache instead.
        #
        #   CLOSED-PR MERGE REFS. Same rule: refs/pull/N/merge is reachable
        #   only from that PR's own runs. Once it is merged or closed, nothing
        #   can read it again. Only OPEN PRs are spared.
        #
        # Both categories are identified by REF, never by key, so a new cache
        # key added anywhere is covered automatically instead of silently
        # accumulating until someone extends a hardcoded prefix list.
        #
        # Best-effort throughout: reaping is housekeeping and must never fail a
        # run. A cache that survives one night is reaped the next.
        run: |
          set -uo pipefail
          repo="${{ github.repository }}"

          # `refs/heads/refs/tags/v…` is not a typo — that is how GitHub records
          # the scope of a cache saved during a tag-triggered run. Match both
          # spellings so this keeps working if that ever changes.
          tag_ids=$(gh api --paginate "repos/${repo}/actions/caches?per_page=100" \
            --jq '.actions_caches[] | select(.ref | test("refs/tags/")) | .id' 2>/dev/null) || true

          open_prs=$(gh api --paginate "repos/${repo}/pulls?state=open&per_page=100" \
            --jq '.[].number' 2>/dev/null | tr '\n' ' ') || true

          pr_ids=""
          while IFS=$'\t' read -r id ref; do
            [ -n "${id}" ] || continue
            n=$(printf '%s' "${ref}" | sed -nE 's#^refs/pull/([0-9]+)/.*#\1#p')
            [ -n "${n}" ] || continue
            case " ${open_prs} " in
              *" ${n} "*) continue ;;   # still open — its next run may restore this
            esac
            pr_ids="${pr_ids} ${id}"
          done <<< "$(gh api --paginate "repos/${repo}/actions/caches?per_page=100" \
            --jq '.actions_caches[] | select(.ref | startswith("refs/pull/")) | "\(.id)\t\(.ref)"' 2>/dev/null || true)"

          n=0
          for id in ${tag_ids} ${pr_ids}; do
            gh api -X DELETE "repos/${repo}/actions/caches/${id}" >/dev/null 2>&1 \
              && n=$((n + 1)) || true
          done
          echo "reaped ${n} unreachable cache entries (tag-scoped + closed-PR)"

          used=$(gh api "repos/${repo}/actions/cache/usage" \
            --jq '.active_caches_size_in_bytes' 2>/dev/null || echo 0)
          echo "cache pool now $((used / 1048576)) MiB of 10240 MiB"
          # 8 GiB. Past this, LRU is close enough to start evicting the release
          # tarballs, which costs a ~35-minute cold build rather than a slow PR.
          # A warning rather than a failure: this job's whole purpose is to keep
          # the pool healthy, and failing it would page someone about a
          # condition it has already done everything it can about.
          if [ "${used}" -gt 8589934592 ]; then
            echo "::warning::Actions cache pool is $((used / 1048576)) MiB of 10240 MiB. LRU eviction can drop the release tarballs, which costs a full cold release build. Biggest remaining lever: merge pre-main into main so release builds stop running the old sccache-enabled workflow."
          fi

      - name: Reap orphaned sccache objects
        env:
          GH_TOKEN: ${{ github.token }}
        # sccache's GHA backend was removed from this workflow and from
        # release-build.yml, but the entries it already wrote do not expire for
        # a week and there are thousands of them. They are not merely clutter:
        # the repo cache quota is 10 GB repo-wide and GitHub evicts it by LRU
        # across ALL entries, so a swarm of tiny objects evicts the ~1.4 GB
        # tarballs the release build depends on. Measured before this landed:
        # 5288 `sccache/*` entries vs 20 for everything else, 8.8 GB total, and
        # the `macos-release-aarch64-apple-darwin` tarball already gone hours
        # after a successful warm run wrote it.
        #
        # This deletes them in bulk on the first run and finds nothing on every
        # run after, at which point it is a no-op that costs one API call. It is
        # kept (rather than being a one-off manual cleanup) so that re-adding
        # sccache anywhere cannot quietly recreate the condition — the entries
        # get reaped nightly and whoever added it sees the deletions in the log.
        #
        # Deliberately unbounded by ref: sccache scoped its writes to whatever
        # ref happened to be building, so these are spread across main, tags and
        # PR merge refs. `|| true` throughout — reaping is best-effort
        # housekeeping and must never fail a warm run.
        run: |
          set -uo pipefail
          ids=$(gh api --paginate "repos/${{ github.repository }}/actions/caches?per_page=100" \
            --jq '.actions_caches[] | select(.key | startswith("sccache/")) | .id' 2>/dev/null) || true
          if [ -z "${ids}" ]; then
            echo "no orphaned sccache entries"
            exit 0
          fi
          n=0
          for id in $ids; do
            gh api -X DELETE "repos/${{ github.repository }}/actions/caches/${id}" >/dev/null 2>&1 \
              && n=$((n + 1)) || true
          done
          echo "reaped ${n} orphaned sccache cache entries"
