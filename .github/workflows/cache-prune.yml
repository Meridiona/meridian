name: Cache prune

# Keeps the shared Actions cache pool bounded without compiling anything.
# Retain only the newest cache for each active main-branch cache family and
# delete cache entries that no future useful run can restore.

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cache-prune.yml"
  schedule:
    - cron: "15 4 * * *"
  workflow_dispatch:

concurrency:
  group: cache-prune
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prune-stale-caches:
    name: Prune superseded caches
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - name: Keep only the newest cache per active family
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          pairs=(
            "v0-rust-macos-release-aarch64-apple-darwin|refs/heads/main"
            "v0-rust-windows-release-x86_64-pc-windows-msvc|refs/heads/main"
            "v0-rust-ci-macos-silicon|refs/heads/main"
            "v0-rust-ci-windows|refs/heads/main"
            "nextjs-|refs/heads/main"
          )

          attempted=0
          failed=0

          for pair in "${pairs[@]}"; do
            prefix="${pair%%|*}"
            ref="${pair##*|}"
            attempted=$((attempted + 1))
            echo "=== ${prefix} (${ref}) ==="

            stale=$(PREFIX="$prefix" gh api --paginate "repos/${{ github.repository }}/actions/caches?per_page=100&ref=${ref}" \
              --jq '[.actions_caches[] | select(.key | startswith(env.PREFIX))] | sort_by(.created_at) | reverse | .[1:] | .[].id') \
              || { failed=$((failed + 1)); echo "::warning::failed to list caches for ${prefix} (${ref}), skipping this pair"; continue; }

            if [ -z "$stale" ]; then
              echo "nothing to prune"
              continue
            fi

            for id in $stale; do
              echo "deleting superseded cache $id"
              gh api -X DELETE "repos/${{ github.repository }}/actions/caches/${id}" \
                || echo "::warning::failed to delete cache ${id} (non-fatal, next run will retry)"
            done
          done

          if [ "${failed}" -eq "${attempted}" ] && [ "${attempted}" -gt 0 ]; then
            echo "::error::every cache family failed to list; nothing was pruned"
            exit 1
          fi

      - name: Delete unreachable tag and closed-PR caches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          repo="${{ github.repository }}"

          tag_ids=$(gh api --paginate "repos/${repo}/actions/caches?per_page=100" \
            --jq '.actions_caches[] | select(.ref | test("refs/tags/")) | .id' 2>/dev/null) || true

          open_prs=$(gh api --paginate "repos/${repo}/pulls?state=open&per_page=100" \
            --jq '.[].number' 2>/dev/null | tr '\n' ' ') || true

          pr_ids=""
          while IFS=$'\t' read -r id ref; do
            [ -n "${id}" ] || continue
            n=$(printf '%s' "${ref}" | sed -nE 's#^refs/pull/([0-9]+)/.*#\1#p')
            [ -n "${n}" ] || continue
            case " ${open_prs} " in
              *" ${n} "*) continue ;;
            esac
            pr_ids="${pr_ids} ${id}"
          done <<< "$(gh api --paginate "repos/${repo}/actions/caches?per_page=100" \
            --jq '.actions_caches[] | select(.ref | startswith("refs/pull/")) | "\(.id)\t\(.ref)"' 2>/dev/null || true)"

          n=0
          for id in ${tag_ids} ${pr_ids}; do
            gh api -X DELETE "repos/${repo}/actions/caches/${id}" >/dev/null 2>&1 \
              && n=$((n + 1)) || true
          done
          echo "reaped ${n} unreachable cache entries"

          used=$(gh api "repos/${repo}/actions/cache/usage" \
            --jq '.active_caches_size_in_bytes' 2>/dev/null || echo 0)
          echo "cache pool now $((used / 1048576)) MiB of 10240 MiB"

          if [ "${used}" -gt 8589934592 ]; then
            echo "::warning::Actions cache pool is $((used / 1048576)) MiB of 10240 MiB"
          fi
