name: CI

# Fast merge gate. This workflow deliberately avoids release packaging and
# platform matrices: developers should know whether a change is safe to merge
# in minutes. Full platform validation happens after integration and nightly.
on:
  pull_request:
    branches: [main, pre-main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  SQLX_OFFLINE: "true"
  CARGO_INCREMENTAL: "0"
  CARGO_NET_RETRY: "3"
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      ui: ${{ steps.filter.outputs.ui }}
      migrations: ${{ steps.filter.outputs.migrations }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            rust:
              - '**/*.rs'
              - '**/Cargo.toml'
              - '**/Cargo.lock'
              - 'rust-toolchain.toml'
              - '.cargo/**'
              - '.github/workflows/ci.yml'
            ui:
              - 'ui/**'
              - 'tray/src/**'
              - '.github/workflows/ci.yml'
            migrations:
              - 'src/migrations/**'

  rust:
    name: Rust fast gate
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Authenticate private Rust dependency
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          test -n "$GH_TOKEN"
          git config --global \
            url."https://x-access-token:${GH_TOKEN}@github.com/Meridiona/screenpipe-fork".insteadOf \
            "https://github.com/Meridiona/screenpipe-fork"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.93.1"
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: pr-fast-linux
          add-job-id-key: false

      - name: Format
        run: cargo fmt --check

      # The desktop tray pulls OS-native capture code and a very large graph.
      # PR feedback exercises the portable business crates; the tray and daemon
      # still receive the full macOS/Windows test matrix after integration.
      - name: Check portable workspace crates
        run: cargo check -p meridian-core -p meridian-oauth --all-targets

      - name: Lint portable workspace crates
        run: cargo clippy -p meridian-core -p meridian-oauth --all-targets -- -D warnings

      - name: Test portable workspace crates
        run: cargo test -p meridian-core -p meridian-oauth

  ui:
    name: UI fast gate
    needs: changes
    if: needs.changes.outputs.ui == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        working-directory: ui
        run: npm ci
      - name: Test
        working-directory: ui
        run: bun test
      - name: Typecheck
        working-directory: ui
        run: npm run typecheck

  migrations:
    name: Migrations append-only
    needs: changes
    if: needs.changes.outputs.migrations == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Reject modified, renamed, or deleted migrations
        run: |
          base='${{ github.event.pull_request.base.sha }}'
          violations=$(git diff --name-status "$base"...HEAD -- src/migrations | grep -E '^(M|D|R)' || true)
          if [ -n "$violations" ]; then
            echo '::error::Shipped migrations are immutable. Add a new numbered migration instead.'
            echo "$violations"
            exit 1
          fi

  required:
    name: CI
    if: always()
    needs: [changes, rust, ui, migrations]
    runs-on: ubuntu-latest
    steps:
      - name: Require all relevant checks
        env:
          RUST: ${{ needs.rust.result }}
          UI: ${{ needs.ui.result }}
          MIGRATIONS: ${{ needs.migrations.result }}
        run: |
          for result in "$RUST" "$UI" "$MIGRATIONS"; do
            case "$result" in
              success|skipped) ;;
              *) echo "::error::A required CI job failed or was cancelled: $result"; exit 1 ;;
            esac
          done
