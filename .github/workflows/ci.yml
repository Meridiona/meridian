name: CI

on:
  push:
    branches: [main, pre-main]
  pull_request:
    branches: [main, pre-main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  SQLX_OFFLINE: "true"
  # Incremental compilation is a pure loss on a CI runner: every job starts from
  # a restored cache and compiles once, so the incremental state is never read
  # back — only WRITTEN, inflating target/ (and the cache tarball each job
  # up/downloads) for no reuse.
  CARGO_INCREMENTAL: "0"
  # A transient registry blip otherwise fails a job and costs a full re-run.
  CARGO_NET_RETRY: "3"
  # The tray pulls screenpipe-screen/-a11y from the PRIVATE Meridiona/
  # screenpipe-fork (a git dep). They are optional/capture-gated, but cargo still
  # RESOLVES them for the whole workspace (fmt/clippy/test), so every Rust job
  # must be able to fetch the source. Force the git CLI so cargo honours the
  # url.insteadOf rewrite the auth step installs — libgit2 would not pick it up.
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

jobs:
  # ── What changed? — skip the heavy compile jobs when a PR touches no Rust ────
  # A docs- or UI-only change does not need three platform compiles. This gate
  # runs in ~15s and every heavy job keys its `if:` off it. pre-main is
  # unprotected (no required status checks), so a skipped job simply does not
  # run — there is no "expected check never reported" merge block to design
  # around.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.f.outputs.rust }}
      ui: ${{ steps.f.outputs.ui }}
      migrations: ${{ steps.f.outputs.migrations }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: f
        with:
          # A change to ci.yml itself trips every filter — CI infra changes must
          # exercise the full matrix, never silently skip it.
          filters: |
            rust:
              - '**/*.rs'
              - '**/Cargo.toml'
              - '**/Cargo.lock'
              - 'rust-toolchain.toml'
              - 'src/migrations/**'
              - '.github/workflows/ci.yml'
            ui:
              - 'ui/**'
              - 'tray/src/**'
              - '.github/workflows/ci.yml'
            migrations:
              - 'src/migrations/**'
              - '.github/workflows/ci.yml'

  # ── fmt — platform-independent, so run it ONCE, cheaply, off the matrix ──────
  fmt:
    name: rustfmt
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust 1.93.1
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.93.1"
          components: rustfmt
      # `cargo fmt --check` does not resolve dependencies, so it needs neither
      # the screenpipe-fork auth nor a cache — keep it minimal.
      - run: cargo fmt --check

  # ── One matrix, one job per NATIVE runner ────────────────────────────────────
  # You cannot cross-compile this workspace: `cargo check --target
  # <other-os>` dies in ring's build script (its C sources need that OS's SDK
  # headers), which is why Tauri documents meaningful cross-compilation as
  # impossible. So each target is built and tested on a runner OF THAT OS.
  #
  #   Linux    x86_64   daemon + core lint/test (also compiles the tray's
  #                     cross-platform skeleton — its macOS deps are
  #                     cfg(target_os="macos")-gated, so this stays green)
  #   Windows  x86_64   daemon + core PORTABILITY gate (does it still build and
  #                     pass on Windows) + a non-blocking tray check
  #   macOS    arm64    Apple Silicon — the SHIPPED arch: daemon + core + tray,
  #                     lint + test, on the native runner
  #
  # Intel (x86_64 macOS) is NOT here — it is a separate push-only job below.
  # GitHub is retiring Intel runners, so a macos-13 job now sits QUEUED 25+ min
  # waiting for a runner it may never get inside a PR's patience. Real Intel
  # testing still matters (it is a shipped slice), so it runs on every push to
  # pre-main/main — where a long queue is acceptable — rather than gating every
  # PR on a runner that is going away. See the `intel` job.
  #
  # Every entry carries its own commands because the workspace is asymmetric
  # (the tray is macOS-only); a single uniform `cargo test` would fail on Linux
  # for the daemon-only crates or skip the tray on macOS.
  test:
    name: ${{ matrix.name }}
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform breaking must not cancel the others — you want to see
      # whether a failure is Windows-only or everywhere in the same run.
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            stub: false
            lint: cargo clippy -- -D warnings
            test: cargo test
            tray_check: false
          - name: Windows portability
            os: windows-latest
            target: x86_64-pc-windows-msvc
            stub: true
            lint: ""
            test: cargo test -p meridian -p meridian-core
            tray_check: true
          - name: macOS (Apple Silicon)
            os: macos-latest
            target: aarch64-apple-darwin
            stub: true
            lint: cargo clippy -p meridian-tray --all-targets -- -D warnings
            # ONE invocation across all three packages: cargo unifies features
            # per invocation, so splitting daemon and tray into two would give a
            # subset of shared crates different feature sets and recompile them.
            test: cargo test -p meridian -p meridian-core -p meridian-tray
            tray_check: false
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate git for the private screenpipe-fork dependency
        # checkout's persist-credentials and the default GITHUB_TOKEN are scoped
        # to THIS repo, so cargo's `git fetch` of the fork 403s. Rewrite just that
        # URL to embed a PAT with read access. `shell: bash` (Git Bash ships on
        # windows-latest) so this is character-for-character identical on every
        # runner rather than a PowerShell transliteration that could drift.
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          git config --global \
            url."https://x-access-token:${GH_TOKEN}@github.com/Meridiona/screenpipe-fork".insteadOf \
            "https://github.com/Meridiona/screenpipe-fork"

      - name: Install Rust 1.93.1
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.93.1"
          components: clippy

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2
        with:
          # Restore everywhere, save ONLY on main (the default branch). GitHub
          # scopes caches by ref, so saving on pre-main and every PR too would
          # store byte-identical copies under a 10GB cap. A run restores from its
          # own ref OR the default branch, so PRs and pre-main read main's cache
          # and simply stop writing their own.
          save-if: ${{ github.ref == 'refs/heads/main' }}
          # rust-cache appends the JOB ID to its key by default, so a renamed or
          # added job silently starts a cold lineage. Name it explicitly, per
          # target, so the key is a deliberate reviewable value.
          add-job-id-key: false
          shared-key: ci-${{ matrix.target }}

      - name: Stub the tray bundle resource
        # tauri-build STATS every bundle.resources path (the daemon binary) when
        # the tray compiles, but `cargo check`/`test` never reads it — a
        # placeholder satisfies the stat and saves a ~9-min release build of the
        # daemon just to produce a file nothing reads. Only needed where the tray
        # is actually built (macOS, and the Windows tray check).
        if: matrix.stub
        shell: bash
        run: |
          mkdir -p target/release
          : > target/release/meridian
          : > target/release/meridian.exe

      - name: Lint
        if: matrix.lint != ''
        run: ${{ matrix.lint }}

      # `cargo test` compiles every target it would check and then runs it, and
      # compiling is strictly stronger than checking — so a separate `cargo
      # check` pass (which the old Windows job ran BEFORE this) could only fail
      # where the test build was about to fail anyway. It was a wasted full graph
      # traversal on the slowest runner. `cargo test` alone is the gate.
      - name: Test
        run: ${{ matrix.test }}

      - name: Tray check (non-blocking)
        # The tray has never been compiled on Windows, so a failure here may be
        # latent breakage unrelated to the PR. Kept non-blocking so it reports
        # without taking the portability gate red for an unrelated reason.
        if: matrix.tray_check
        continue-on-error: true
        run: cargo check -p meridian-tray --all-targets

  # ── Real Intel (x86_64 macOS) testing — POST-MERGE ONLY ──────────────────────
  # Intel is a shipped slice, so it deserves real tests, not a compile-check on
  # an arm runner (arm cannot execute x86_64 binaries). But GitHub is retiring
  # Intel runners: a macos-13 job now queues 25+ minutes for a runner, which
  # would make Intel the long pole on EVERY Rust PR and defeat the point of the
  # fast matrix above. So it runs only on `push` to pre-main/main — after a PR
  # merges, before any release cut from those branches — where a long queue is
  # fine and the coverage still lands continuously. An Intel-only compile break
  # (rare) surfaces here within the hour rather than at PR time.
  #
  # If GitHub removes macos-13 entirely, this job starts failing to schedule;
  # the fallback is a `--target x86_64-apple-darwin` compile-check folded back
  # into the arm matrix entry (catches compile breaks, not runtime ones).
  intel:
    name: macOS (Intel, post-merge)
    needs: changes
    if: github.event_name == 'push' && needs.changes.outputs.rust == 'true'
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate git for the private screenpipe-fork dependency
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          git config --global \
            url."https://x-access-token:${GH_TOKEN}@github.com/Meridiona/screenpipe-fork".insteadOf \
            "https://github.com/Meridiona/screenpipe-fork"

      - name: Install Rust 1.93.1
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.93.1"
          components: clippy

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          add-job-id-key: false
          shared-key: ci-x86_64-apple-darwin

      - name: Stub the tray bundle resource
        run: |
          mkdir -p target/release
          : > target/release/meridian

      # The real thing: RUN the daemon + core + tray test suites on Intel
      # hardware, in one cargo invocation (unified feature resolve).
      - name: Test (Intel)
        run: cargo test -p meridian -p meridian-core -p meridian-tray

  ui:
    name: UI
    needs: changes
    if: needs.changes.outputs.ui == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: ui/package-lock.json

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: ui/.next/cache
          key: nextjs-${{ hashFiles('ui/package-lock.json') }}-${{ hashFiles('ui/**/*.ts', 'ui/**/*.tsx') }}
          restore-keys: |
            nextjs-${{ hashFiles('ui/package-lock.json') }}-
            nextjs-

      - name: UI install
        run: npm ci
        working-directory: ui

      # `bun test` here also covers the tray popover's JS tests — they live in
      # ui/__tests__ (popover-pause-utils, popover-health-panel) even though the
      # popover source is tray/src, precisely so this one run discovers them.
      - name: UI tests
        run: bun test
        working-directory: ui

      - name: UI build
        run: npm run build
        working-directory: ui

  # Shipped migrations are immutable: sqlx records a checksum of every applied
  # migration and the daemon refuses to start if a migration file later differs.
  # A pre-commit hook also guards this, but hooks are opt-in and bypassable, so
  # enforce it server-side where it cannot be skipped.
  migration-guard:
    name: Migrations append-only
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.migrations == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reject modified, renamed, or deleted migrations
        run: |
          base='${{ github.event.pull_request.base.sha }}'
          violations=$(git diff --name-status "$base"...HEAD -- src/migrations \
            | grep -E '^(M|D|R)' || true)
          if [ -n "$violations" ]; then
            echo "::error::Shipped migrations are immutable. Add a NEW numbered migration in src/migrations/ — never modify, rename, or delete an existing one (it changes the sqlx checksum and breaks every database that already applied it)."
            echo "Offending changes:"
            echo "$violations"
            exit 1
          fi
          echo "OK — no existing migrations were modified, renamed, or deleted."

  # screenpipe relicensed MIT → Commercial on 2026-06-10. 0.4.6 (2026-06-05) is
  # the last MIT npm release; >= 0.4.17 is Commercial (its "competing product"
  # clause would then bind our users). Meridian ships zero screenpipe code, so
  # staying on MIT keeps the install license-clean. Enforce the pin server-side
  # so it can't silently drift across the relicense boundary. Cheap and always
  # on — it only greps a manifest.
  screenpipe-license-pin:
    name: screenpipe MIT pin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assert the screenpipe-fork git rev stays pinned to the last MIT-based commit
        run: |
          # install.sh no longer installs screenpipe (capture is in-process in
          # the tray since v1.64.0), and the npm-based install-from-bundle.sh
          # path this guard used to check was removed with the npm channel
          # (DMG-only distribution). Capture now pulls the fork as a git dep
          # in tray/src-tauri/Cargo.toml — that `rev` is the pin.
          #
          # What this guard actually protects is the LICENSE BASE: the fork is
          # cut from screenpipe's last MIT commit (892199f74), and screenpipe
          # >= 0.4.17 is Commercial-licensed. Meridiona's OWN commits on top of
          # that base are ours and carry no license risk — so bumping `expected`
          # is legitimate ONLY when every commit the bump introduces is ours and
          # none merges upstream screenpipe code past the MIT cutoff.
          #
          # Audit each time you bump, and record it here:
          #   gh api repos/Meridiona/screenpipe-fork/compare/<old>...<new> \
          #     --jq '.commits[] | .sha[0:8] + "  " + .commit.author.name'
          #
          # 2026-07-19, d6d2b318 -> 825b038d. Three commits, all Meridiona-
          # authored, no upstream merge:
          #   1bc2ba88 adityaharishch  fix(a11y): prune browser tab strip …
          #   4f9ba866 adityaharishch  Merge pull request #1 (same, ours)
          #   825b038d Akarsh Hegde    fix(screen): disable sck-rs on macOS 26
          expected="825b038d845d7dcc8c1387b2707899b352417233"
          f="tray/src-tauri/Cargo.toml"
          fail=0
          for crate in screenpipe-screen screenpipe-a11y; do
            v=$(grep -E "^${crate} = " "$f" | grep -oE 'rev = "[0-9a-f]+"' | cut -d'"' -f2)
            if [ "$v" != "$expected" ]; then
              echo "::error file=$f::${crate}'s pinned rev='$v' but must be '$expected'. screenpipe >= 0.4.17 is Commercial-licensed; bumping the pin risks shipping users a commercial dependency. Changing this requires legal review (and editing this guard). See the LICENSE PIN comment at the pin."
              fail=1
            fi
          done
          [ "$fail" -eq 0 ] && echo "OK — screenpipe-fork pinned to the last MIT-based rev ($expected)."
