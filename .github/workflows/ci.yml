name: CI

on:
  push:
    branches: [main, pre-main]
  pull_request:
    branches: [main, pre-main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  SQLX_OFFLINE: "true"
  # Incremental compilation is a pure loss on a CI runner: every job starts from
  # a restored cache and compiles once, so the incremental state is never read
  # back — it is only WRITTEN, inflating target/ (and therefore the cache tarball
  # every job uploads and downloads) for no reuse.
  CARGO_INCREMENTAL: "0"
  # A transient registry blip otherwise fails a job outright and costs a full
  # re-run, which is far more expensive than a retry.
  CARGO_NET_RETRY: "3"

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    env:
      # The tray pulls screenpipe-screen/-a11y from the PRIVATE Meridiona/
      # screenpipe-fork (a git dep). They are optional/capture-gated, but cargo
      # still RESOLVES them for the workspace (fmt/clippy/test), so it must fetch
      # the source. Force the git CLI so cargo honors the url.insteadOf rewrite
      # the auth step installs — libgit2 would not pick it up.
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate git for the private screenpipe-fork dependency
        # checkout's persist-credentials and the default GITHUB_TOKEN are both
        # scoped to THIS repo, so cargo's `git fetch` of the fork 403s. Rewrite
        # just that URL to embed a PAT with read access. REQUIRES the GH_TOKEN
        # secret to read Meridiona/screenpipe-fork (org-member classic PAT with
        # `repo`, or a fine-grained PAT granting both meridian AND screenpipe-fork).
        # Same secret + mechanism as release-build.yml.
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          git config --global \
            url."https://x-access-token:${GH_TOKEN}@github.com/Meridiona/screenpipe-fork".insteadOf \
            "https://github.com/Meridiona/screenpipe-fork"

      - name: Install Rust 1.93.1
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.93.1"
          components: rustfmt, clippy

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2
        with:
          # Restore everywhere, save ONLY on main - the default branch.
          #
          # GitHub scopes caches by REF, so saving on both integration branches
          # stored the same cache twice. Not near-identical: byte-identical
          # KEYS, e.g. both main and pre-main held
          # `v0-rust-macos-universal-Darwin-arm64-201b0125-da9962c3`. Across the
          # three Rust jobs that was ~4.46GB of a 10GB quota spent on a second
          # copy of something already present.
          #
          # A run restores from its own branch OR the default branch, so pre-main
          # and PR runs read main's copy and simply stop writing their own. This
          # is the same reasoning that already stopped PR branches duplicating;
          # it just was not carried the last step to pre-main.
          #
          # Cost is bounded and small: the key only diverges when Cargo.lock,
          # the toolchain, or RUSTFLAGS change - 39 of 650 commits (6%) touched
          # Cargo.lock over the last 30 days - and rust-cache "will try to
          # restore from a previous Cargo.lock version as well, so lockfile
          # updates should only re-build changed dependencies", so even that
          # case degrades to incremental work rather than a cold build.
          #
          # Why it matters: six Rust caches at 9.6GB previously evicted the
          # release cache within ~3h of it being written and forced every
          # release to compile cold. The release path has since split into two
          # per-arch caches, so the demand grew again; this is where the room
          # comes from.
          save-if: ${{ github.ref == 'refs/heads/main' }}

          # rust-cache appends the JOB ID to its key by default, so renaming a
          # job — or adding one that compiles the same graph — silently starts a
          # brand-new cache lineage and the next run compiles cold. Name the
          # lineage explicitly instead, so it is a deliberate, reviewable value.
          add-job-id-key: false
          shared-key: ci-linux

          # rust-cache DELETES ~/.cargo/registry/src before saving, on the theory
          # that it is re-extractable from the .crate archives in registry/cache.
          # It is — by re-unpacking ~1000 tarballs at the start of every job.
          # Keeping the extracted sources costs cache size and saves that unpack.
          cache-directories: |
            ~/.cargo/registry/src

      - name: fmt
        run: cargo fmt --check

      - name: clippy
        run: cargo clippy -- -D warnings

      - name: test
        run: cargo test

  # The daemon builds and its full suite passes on Windows, so this job is a
  # BLOCKING gate: it exists to stop that silently rotting. It began as a
  # non-blocking burn-down while the port landed; that phase is over.
  #
  # This job is also the ONLY way to validate Windows: `cargo check --target
  # x86_64-pc-windows-msvc` from macOS dies in `ring`'s build script (its C
  # sources need the Windows SDK headers), which is the same reason Tauri
  # documents that meaningful cross-compilation is not possible. There is no
  # local shortcut — push and read this job.
  #
  # NOTE: passing here means the code COMPILES and its tests pass on a CI
  # runner. It does not mean Meridian works on Windows — nothing here
  # exercises a real desktop, so capture producing frames, the tray rendering,
  # and the installer registering a service are all still unverified.
  windows-portability:
    name: Windows portability
    runs-on: windows-latest
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate git for the private screenpipe-fork dependency
        # Same mechanism as the Rust job above — cargo resolves the whole
        # workspace, so the private git dep must be fetchable even though this
        # job never compiles the crate that uses it.
        # `shell: bash` (Git Bash ships on windows-latest) so this is character-
        # for-character the same command as the Rust job's, rather than a
        # PowerShell transliteration that could drift from it.
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          git config --global \
            url."https://x-access-token:${GH_TOKEN}@github.com/Meridiona/screenpipe-fork".insteadOf \
            "https://github.com/Meridiona/screenpipe-fork"

      - name: Install Rust 1.93.1
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.93.1"
          # x86_64-pc-windows-msvc is this runner's host target, so no `targets:`
          # entry is needed. It is deliberately NOT added to rust-toolchain.toml
          # either — that would make every macOS dev machine download the Windows
          # std for a target they never build.
          components: clippy

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2
        with:
          # Save only on main, stable key, keep registry/src - see the Rust job.
          save-if: ${{ github.ref == 'refs/heads/main' }}
          add-job-id-key: false
          shared-key: ci-windows
          cache-directories: |
            ~/.cargo/registry/src

      # `cargo check --all-targets` then `cargo test` over the SAME two packages
      # was a wasted pass: `cargo test` compiles every target it would have
      # checked, and compiling is strictly stronger than checking, so the check
      # could only ever fail where the test build was about to fail anyway. It
      # bought nothing but an extra full traversal of the graph, on the slowest
      # runner we have. `cargo test` alone is the gate.
      #
      # (The tray check below stays a separate invocation on purpose — see its
      # comment. It is non-blocking, and folding it in here would make a latent
      # tray failure take the Windows portability gate red.)
      #
      # Running the tests, not just compiling them, is the point: the remaining
      # Windows gaps are behavioural — a test that hardcodes a Unix path, a
      # launchd label, or an argv shape — and only executing them surfaces those.
      - name: check + test
        run: cargo test -p meridian -p meridian-core

      # The tray is checked separately and non-blocking: unlike the daemon it
      # has never been compiled in CI on ANY platform, so a failure here may
      # well be latent breakage that has nothing to do with Windows. Keeping it
      # out of the blocking steps above means it cannot take the portability
      # gate red for an unrelated reason, while still reporting.
      #
      # Tauri's build script validates that every bundle.resources path EXISTS,
      # but `cargo check` never reads the contents — so a placeholder satisfies
      # it. A real `cargo build --release --bin meridian` here took ~9 minutes
      # (release-optimised candle/tokenizers/sqlx) purely to produce a file the
      # check only stats. The release daemon genuinely building on Windows is
      # covered by the release pipeline, not needed for a compile check.
      - name: Stub the tray bundle resource
        shell: bash
        run: |
          mkdir -p target/release
          : > target/release/meridian.exe

      - name: check tray
        continue-on-error: true
        run: cargo check -p meridian-tray --all-targets

  # macOS is the shipped platform, and it now ships a UNIVERSAL binary — Apple
  # Silicon (arm64) AND Intel (x86_64). Before this job, neither was exercised
  # at PR time: the `rust` job runs on ubuntu (so it never compiles the tray's
  # macOS-only capture/objc2/launchd code, and never runs the tray's tests),
  # and nothing checked the x86_64 slice at all — an Intel-slice regression
  # would only surface at release, on the one build that can't be retried
  # cheaply. This job closes both gaps.
  #
  # The runner is arm64, so the native steps ARE the Apple-Silicon gate; the
  # Intel slice is a cross-check (same OS, other arch — cheap and reliable,
  # unlike the Windows cross-compile which can't run off-Windows at all).
  macos-universal:
    name: macOS (Silicon + Intel)
    runs-on: macos-latest
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate git for the private screenpipe-fork dependency
        # The tray's capture stack is a git dep on the PRIVATE screenpipe-fork;
        # same rewrite as the other jobs (this one actually compiles it).
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          git config --global \
            url."https://x-access-token:${GH_TOKEN}@github.com/Meridiona/screenpipe-fork".insteadOf \
            "https://github.com/Meridiona/screenpipe-fork"

      - name: Install Rust 1.93.1
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.93.1"
          # arm64 is the runner's host; add the Intel target for the x86_64
          # slice check. NOT added to rust-toolchain.toml — only CI needs it.
          targets: "x86_64-apple-darwin"
          components: clippy

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2
        with:
          # Save only on main, stable key, keep registry/src - see the Rust job.
          save-if: ${{ github.ref == 'refs/heads/main' }}
          add-job-id-key: false
          # Deliberately NOT the release job's key. This job stubs the daemon
          # and only ever `check`s the Intel slice; the release job builds both
          # for real. Sharing one lineage would mean each kind of run evicting
          # the other's artifacts under a key that claims they are the same.
          shared-key: ci-macos
          cache-directories: |
            ~/.cargo/registry/src

      # Same stub trick as the Windows tray check: tauri-build only STATS the
      # bundle.resources daemon path during `cargo check`, never reads it, so a
      # placeholder saves a ~9-min release build of the daemon. The real
      # universal daemon build is covered by the release pipeline.
      - name: Stub the tray bundle resource
        run: |
          mkdir -p target/release
          : > target/release/meridian

      # Apple Silicon (arm64, the host): the tray is macOS-only and was never
      # compiled or tested in CI before — clippy + its 109 tests run here.
      #
      # clippy and test are two invocations over one package on purpose: clippy
      # writes its own fingerprint lineage, so it cannot reuse rustc's artifacts
      # (or vice versa) no matter how they are ordered. There is no merge to be
      # had here — unlike the Windows check+test pair, which really was one
      # traversal doing another's work.
      - name: clippy tray (Apple Silicon)
        run: cargo clippy -p meridian-tray --all-targets -- -D warnings

      - name: test tray (Apple Silicon)
        run: cargo test -p meridian-tray

      # Intel (x86_64): the universal binary's other slice. A compile check is
      # enough to catch an arch- or SDK-specific regression before it reaches
      # the release build; the daemon+core Intel slice rides along.
      - name: check universal — Intel slice
        run: cargo check -p meridian -p meridian-core -p meridian-tray --target x86_64-apple-darwin

  ui:
    name: UI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: ui/package-lock.json

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: ui/.next/cache
          key: nextjs-${{ hashFiles('ui/package-lock.json') }}-${{ hashFiles('ui/**/*.ts', 'ui/**/*.tsx') }}
          restore-keys: |
            nextjs-${{ hashFiles('ui/package-lock.json') }}-
            nextjs-

      - name: UI install
        run: npm ci
        working-directory: ui

      # `bun test` here also covers the tray popover's JS tests — they live in
      # ui/__tests__ (popover-pause-utils, popover-health-panel) even though the
      # popover source is tray/src, precisely so this one run discovers them.
      - name: UI tests
        run: bun test
        working-directory: ui

      - name: UI build
        run: npm run build
        working-directory: ui

  # Shipped migrations are immutable: sqlx records a checksum of every applied
  # migration and the daemon refuses to start if a migration file later differs.
  # A pre-commit hook also guards this, but hooks are opt-in and bypassable, so
  # enforce it server-side where it cannot be skipped.
  migration-guard:
    name: Migrations append-only
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reject modified, renamed, or deleted migrations
        run: |
          base='${{ github.event.pull_request.base.sha }}'
          violations=$(git diff --name-status "$base"...HEAD -- src/migrations \
            | grep -E '^(M|D|R)' || true)
          if [ -n "$violations" ]; then
            echo "::error::Shipped migrations are immutable. Add a NEW numbered migration in src/migrations/ — never modify, rename, or delete an existing one (it changes the sqlx checksum and breaks every database that already applied it)."
            echo "Offending changes:"
            echo "$violations"
            exit 1
          fi
          echo "OK — no existing migrations were modified, renamed, or deleted."

  # screenpipe relicensed MIT → Commercial on 2026-06-10. 0.4.6 (2026-06-05) is
  # the last MIT npm release; >= 0.4.17 is Commercial (its "competing product"
  # clause would then bind our users). Meridian ships zero screenpipe code, so
  # staying on MIT 0.4.6 keeps the install license-clean. Enforce the pin
  # server-side so it can't silently drift across the relicense boundary.
  screenpipe-license-pin:
    name: screenpipe MIT pin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assert the screenpipe-fork git rev stays pinned to the last MIT-based commit
        run: |
          # install.sh no longer installs screenpipe (capture is in-process in
          # the tray since v1.64.0), and the npm-based install-from-bundle.sh
          # path this guard used to check was removed with the npm channel
          # (DMG-only distribution). Capture now pulls the fork as a git dep
          # in tray/src-tauri/Cargo.toml — that `rev` is the pin.
          #
          # What this guard actually protects is the LICENSE BASE: the fork is
          # cut from screenpipe's last MIT commit (892199f74), and screenpipe
          # >= 0.4.17 is Commercial-licensed. Meridiona's OWN commits on top of
          # that base are ours and carry no license risk — so bumping `expected`
          # is legitimate ONLY when every commit the bump introduces is ours and
          # none merges upstream screenpipe code past the MIT cutoff.
          #
          # Audit each time you bump, and record it here:
          #   gh api repos/Meridiona/screenpipe-fork/compare/<old>...<new> \
          #     --jq '.commits[] | .sha[0:8] + "  " + .commit.author.name'
          #
          # 2026-07-19, d6d2b318 -> 825b038d. Three commits, all Meridiona-
          # authored, no upstream merge:
          #   1bc2ba88 adityaharishch  fix(a11y): prune browser tab strip …
          #   4f9ba866 adityaharishch  Merge pull request #1 (same, ours)
          #   825b038d Akarsh Hegde    fix(screen): disable sck-rs on macOS 26
          expected="825b038d845d7dcc8c1387b2707899b352417233"
          f="tray/src-tauri/Cargo.toml"
          fail=0
          for crate in screenpipe-screen screenpipe-a11y; do
            v=$(grep -E "^${crate} = " "$f" | grep -oE 'rev = "[0-9a-f]+"' | cut -d'"' -f2)
            if [ "$v" != "$expected" ]; then
              echo "::error file=$f::${crate}'s pinned rev='$v' but must be '$expected'. screenpipe >= 0.4.17 is Commercial-licensed; bumping the pin risks shipping users a commercial dependency. Changing this requires legal review (and editing this guard). See the LICENSE PIN comment at the pin."
              fail=1
            fi
          done
          [ "$fail" -eq 0 ] && echo "OK — screenpipe-fork pinned to the last MIT-based rev ($expected)."
