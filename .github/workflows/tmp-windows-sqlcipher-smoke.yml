name: TEMP — Windows SQLCipher build smoke test

# Throwaway workflow, NOT part of the release pipeline. Validates that the
# tray (default features, i.e. including `capture`) compiles on
# windows-latest with the new bundled-sqlcipher-vendored-openssl +
# keyring/windows-native dependencies, using the same Perl/NASM setup just
# added to release-build.yml's windows job. Does NOT sign, notarize,
# package, or touch any draft release — compile-only signal. Delete this
# file once the Windows encryption work is verified; it duplicates
# release-build.yml's windows job on purpose so it can run on a normal push
# without needing a real v*-staging* release tag.

on:
  push:
    branches: [ci/windows-sqlcipher-perl-nasm]
  workflow_dispatch:

permissions:
  contents: read

env:
  SQLX_OFFLINE: "true"
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  windows-smoke:
    name: Windows x86_64 (compile only)
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # NOTE: deliberately NOT installing Perl via shogo82148/actions-setup-perl
      # here — windows-latest already has a full Strawberry Perl at
      # C:\Strawberry\perl\bin, confirmed (via a diagnostic step) to have every
      # CPAN module OpenSSL's Configure script needs. That action's minimal
      # Perl build does NOT (missing Locale::Maketext::Simple, Text::Template)
      # and shadowed the good one — confirmed by an actual failed run.
      #
      # Strawberry Perl still doesn't win by default, though: this job's
      # `shell: bash` runs under Git Bash, which UNCONDITIONALLY prepends its
      # own MSYS bin dirs (/usr/bin, /mingw64/bin) at shell startup —
      # confirmed via a diagnostic step that `echo $PATH` inside a bash step
      # shows /usr/bin ahead of Strawberry's path REGARDLESS of any
      # GITHUB_PATH entry added in an earlier step (tried and confirmed
      # ineffective, twice, with both POSIX- and Windows-style path forms).
      # Git Bash's own /usr/bin/perl (msys-perl, cygwin-based) is what was
      # actually failing every time.
      #
      # Fix: run ONLY the actual build step under `pwsh` instead of the job's
      # bash default — outside Git Bash entirely, Strawberry Perl resolves
      # correctly with no competing MSYS perl in the way. `cargo build` /
      # `tauri build` (invoked via `npm run`) are plain CLI invocations with
      # no bash-specific syntax, so this is safe.
      - name: Install NASM (for vendored OpenSSL's assembly routines)
        uses: ilammy/setup-nasm@v1

      - name: Install Rust 1.93.1
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.93.1"

      - uses: Swatinem/rust-cache@v2
        with:
          add-job-id-key: false
          shared-key: windows-sqlcipher-smoke-x86_64-pc-windows-msvc

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: |
            ui/package-lock.json
            tray/package-lock.json

      - name: Authenticate git for the private screenpipe-fork dependency
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          git config --global \
            url."https://x-access-token:${GH_TOKEN}@github.com/Meridiona/screenpipe-fork".insteadOf \
            "https://github.com/Meridiona/screenpipe-fork"

      - name: Install UI + tray deps
        run: |
          (cd ui && npm ci --no-audit --no-fund)
          (cd tray && npm ci --no-audit --no-fund)

      - name: Build the daemon + tray (compile-only smoke test)
        working-directory: tray
        # Deliberately NOT the job's bash default here — see the NOTE above
        # the NASM step for why: Git Bash forces its own MSYS perl (missing
        # CPAN modules OpenSSL's Configure needs) ahead of Strawberry Perl on
        # PATH, no matter what. pwsh has no such override.
        shell: pwsh
        env:
          CHANNEL: staging
        run: npm run build:windows:staging

      - name: Confirm the SQLCipher feature actually linked (not silently plain sqlite)
        # cargo build succeeding proves compile+link works; this additionally
        # confirms the binary really contains the SQLCipher engine, not just
        # a stock-SQLite build that happened to compile because a bad Cargo
        # feature match silently no-op'd.
        run: |
          if strings.exe target/release/meridian-tray.exe 2>/dev/null | grep -qi "sqlcipher" \
             || strings target/release/meridian-tray.exe 2>/dev/null | grep -qi "sqlcipher"; then
            echo "SQLCipher strings found in the built binary — confirmed linked."
          else
            echo "::warning::Could not confirm 'sqlcipher' strings in the binary (strings.exe may be unavailable on this runner) — compile success is still the primary signal."
          fi
