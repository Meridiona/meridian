name: Windows product smoke

on:
  workflow_call:
    inputs:
      tag:
        description: "Exact release tag whose artifact must be exercised"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: "Exact release tag whose Windows installer must be exercised"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: windows-product-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Download + install + smoke + uninstall
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false

      - name: Download exact tagged Windows installer
        id: installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'meridian-smoke'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          gh release download "$env:TAG" --repo Meridiona/meridian --pattern 'Meridian-x86_64-setup.exe' --dir $dir
          $installer = Get-Item (Join-Path $dir 'Meridian-x86_64-setup.exe')
          "path=$($installer.FullName)" >> $env:GITHUB_OUTPUT
          Write-Host "Installer: $($installer.FullName)"

      - name: Exercise installed product lifecycle
        shell: pwsh
        run: ./scripts/ci/windows-install-smoke.ps1 -InstallerPath "${{ steps.installer.outputs.path }}"

      - name: Record successful Windows smoke on the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          $proof = Join-Path $env:RUNNER_TEMP 'smoke-windows.ok'
          @"
tag=$env:TAG
run_id=${{ github.run_id }}
commit=${{ github.sha }}
"@ | Set-Content -NoNewline $proof
          gh release upload "$env:TAG" --repo Meridiona/meridian --clobber $proof
