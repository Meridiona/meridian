name: Cache warm (release)

# SEEDS THE RELEASE COMPILE CACHES ON `main` FOR BOTH PLATFORMS. SHIPS NOTHING.
#
# ── WHY THIS EXISTS ──────────────────────────────────────────────────────────
#
# Because release-build.yml is triggered by a TAG, and GitHub scopes Actions
# caches by ref. A workflow run may restore caches created in
#
#     • its own ref, or
#     • the DEFAULT branch (main)
#
# and nothing else. It cannot read a sibling tag's cache, and it cannot read
# pre-main's.
#
# Every release cuts a NEW tag (v1.72.0-staging.6, .7, .8 …), so each build
# saved its 1.45GB cache under its own tag ref and the next tag started from
# nothing. Measured on run 29812896206: `Compile daemon + tray` took
# 1495s — ~25 of the 24-minute build. Notarization, by contrast, was 79s. The
# cold compile IS the build time; everything else is rounding error. The
# Windows job had it worse: every `windows-release-*` cache entry that ever
# existed was tag-scoped too, so every tag-triggered Windows build compiled
# OpenSSL-from-source + SQLCipher + the daemon/tray from a stone-cold cache —
# every single time, not just once.
#
# The fix is to make a release-shaped cache exist on the DEFAULT branch, which
# every tag build can read. Nothing else on main produces one: release-build
# runs on tags (saves to tag scope) and ci.yml compiles a different profile
# under a different shared-key. Hence this workflow — its ONLY output is a
# warm cache, per platform, under `refs/heads/main`.
#
# ── WHY EACH JOB COMPILES THE SAME WAY release-build DOES ────────────────────
#
# rust-cache keys on the shared-key + runner + toolchain + lockfile, and the
# cache is only useful if the target/ it saves matches the fingerprints a
# release build will look for. So each job here mirrors release-build.yml's
# matching job exactly: same runner, same pinned toolchain, same target
# triple, the same cargo invocations, the same shared-key. Change that job's
# compile step and you must change this one, or the cache silently stops
# matching and every release quietly goes cold again — the failure is
# invisible, it just gets slow.
#
# Neither job signs, notarizes, bundles or publishes. Each is a compile and a
# cache write.
#
# ── KNOWN GAP: NOT EVERY BAKED SECRET INVALIDATES THIS CACHE ─────────────────
#
# Neither job here sets release-build.yml's secret-bearing env vars (Clerk key,
# Sentry DSN, PostHog key, GitHub/Jira OAuth ids, central OTLP endpoint/token,
# channel), so a tag build restoring this cache compiles those constants in for
# real for the first time. Cargo only recompiles a crate on an env var change
# if that crate's OWN build.rs declares `cargo:rerun-if-env-changed=VAR` — most
# of the vars above have no such declaration anywhere in the workspace, so a
# rotated secret can silently stay baked at its old (here: absent) value across
# a cache restore. Pre-existing (predates this file), not introduced by either
# job below — tracked in
# https://github.com/Meridiona/meridian/issues/601.

on:
  # Every push to main re-seeds the cache with whatever production is at, so a
  # release cut minutes later is warm. `pre-main` is ALSO a trigger now, but
  # only for `prune-stale-caches` (see that job's `if:`) — the two compile
  # jobs below skip entirely on a pre-main-triggered run (their `if:` gates
  # on `github.ref == 'refs/heads/main'`), so a pre-main push doesn't burn
  # ~15-30min of compile time it would just throw away (they only ever SAVE
  # their cache on main anyway, per each job's own `save-if`). This makes the
  # ci.yml-caches half of the pruning run right after every pre-main merge,
  # not just once a night.
  push:
    branches: [main, pre-main]
  # Nightly, so staging tags stay warm even during a long stretch with no
  # production release. 04:00 UTC — off-peak for GitHub's macOS runner pool.
  schedule:
    - cron: "0 4 * * *"
  # For seeding on demand (e.g. right after this lands, rather than waiting for
  # the first nightly).
  workflow_dispatch:

# One warm at a time. Two would race to write the same cache key and the loser's
# upload is wasted; never cancel a run that may be mid-save.
concurrency:
  group: cache-warm
  cancel-in-progress: false

permissions:
  contents: read

# *** THIS BLOCK IS PART OF THE CACHE KEY. IT MUST MATCH release-build.yml's. ***
#
# Not "should" — the cache this whole workflow exists to write is UNREADABLE by
# release-build.yml unless every CARGO_*/RUSTC_* name AND value here is
# identical to the block in that file. rust-cache hashes them into the first
# component of its key, and that component is also its only fallback restore
# key, so one extra var is indistinguishable from a cold cache.
#
# That is not hypothetical: `CARGO_NET_RETRY` was set here and not there, and
# it silently made every release build in this pipeline's history compile from
# scratch (~940 crates, 21 min macOS / 36 min Windows) while this workflow
# faithfully wrote a warm cache nothing could ever read. The full measurement
# is in release-build.yml's `env:` comment.
#
# `cache-key-parity` in ci.yml compares the two blocks and fails if they drift.
# sccache (RUSTC_WRAPPER/SCCACHE_GHA_ENABLED) used to live here too — removed,
# see release-build.yml's note above its rust-cache step for why it was making
# things slower rather than faster.
env:
  SQLX_OFFLINE: "true"
  CARGO_INCREMENTAL: "0"
  CARGO_NET_RETRY: "3"
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  CARGO_TERM_COLOR: always

jobs:
  warm-macos:
    name: Warm the aarch64 release cache
    # Skip entirely on a pre-main-triggered run — see the `on:` block comment.
    # This job only ever exists to compile-and-save onto `main`; running it
    # on pre-main would compile for ~15-20min and then throw the result away
    # (save-if already restricts the save to main, so nothing would even be
    # written).
    if: github.ref == 'refs/heads/main' || github.event_name != 'push'
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: read
      # No `actions: write`: that grant existed only for sccache's GHA cache
      # backend, now removed. actions/cache saves via ACTIONS_RUNTIME_TOKEN.
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Authenticate git for the private screenpipe-fork dependency
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          git config --global \
            url."https://x-access-token:${GH_TOKEN}@github.com/Meridiona/screenpipe-fork".insteadOf \
            "https://github.com/Meridiona/screenpipe-fork"

      - name: Install Rust 1.93.1
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.93.1"
          targets: aarch64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          # MUST match release-build.yml's macOS job byte for byte — this is the
          # whole point of the workflow. `add-job-id-key: false` keeps the key
          # free of this job's name so release-build computes the same one.
          add-job-id-key: false
          shared-key: macos-release-aarch64-apple-darwin
          cache-directories: |
            ~/.cargo/registry/src
          # Unconditional: this job's push/schedule triggers only ever fire on
          # `main`, and writing that cache is its entire purpose. A manual
          # `workflow_dispatch` CAN target any branch, but GitHub scopes a
          # cache save to the triggering ref, so a dispatch from elsewhere
          # just writes a side entry under that ref — it can't clobber the
          # `main`-scoped cache release-build.yml restores from.
          save-if: true

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: |
            ui/package-lock.json
            tray/package-lock.json

      - name: Install UI + tray deps
        run: |
          (cd ui && npm ci --no-audit --no-fund)
          (cd tray && npm ci --no-audit --no-fund)

      - name: Build the UI
        # Compiling with plain `cargo build` (see below) bypasses `tauri
        # build`'s automatic `beforeBuildCommand`, so this has to run
        # explicitly — generate_context! embeds ui/out at compile time.
        run: cd ui && npm run build

      - name: Stub the daemon so tauri-build's resource check passes
        # tauri-build only STATS bundle.resources during compilation; a
        # zero-byte placeholder satisfies it. Same trick as ci.yml and
        # release-build.yml.
        run: |
          mkdir -p target/release
          : > target/release/meridian

      - name: Compile daemon + tray (aarch64-apple-darwin)
        working-directory: tray
        # ONE cargo invocation for both binaries — IDENTICAL to
        # release-build.yml's macOS compile step; see that file's header
        # comment "WHY THE BUILD IS ONE CARGO INVOCATION, NOT TWO" for the
        # full story. Must stay byte-for-byte identical to release-build.yml's
        # command (same reasoning as the shared-key comment above) or the
        # cache silently stops matching.
        #
        # No TAURI_CONFIG: this job only ever runs on `main` (see the
        # header), which release-build.yml always builds with the default
        # (stable) Tauri config — never the staging one. Setting it here
        # would warm a cache under a different Tauri fingerprint than the
        # stable release build actually compiles with.
        run: |
          cargo build --release --locked --target aarch64-apple-darwin \
            -p meridian --bin meridian \
            -p meridian-tray --bin meridian-tray \
            --features tauri/custom-protocol

      - name: Summary
        if: always()
        run: |
          {
            echo "### Cache warm"
            echo "Seeded \`macos-release-aarch64-apple-darwin\` under \`refs/heads/main\`."
            echo ""
            echo "Tag-triggered release builds restore from the default branch, so"
            echo "staging and production tags both start warm."
          } >> "$GITHUB_STEP_SUMMARY"

  warm-windows:
    name: Warm the Windows x86_64 release cache
    # Same reasoning as warm-macos's `if:` — skip on a pre-main-triggered
    # push, this job only exists to compile-and-save onto main.
    if: github.ref == 'refs/heads/main' || github.event_name != 'push'
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: read
      # No `actions: write`: that grant existed only for sccache's GHA cache
      # backend, now removed. actions/cache saves via ACTIONS_RUNTIME_TOKEN.
    defaults:
      run:
        # Same reasoning as release-build.yml's Windows job: every step here
        # except the compile step itself is a POSIX script the runner's Git
        # Bash handles fine, so it doesn't need a second PowerShell-flavoured
        # copy maintained in parallel.
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Authenticate git for the private screenpipe-fork dependency
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          git config --global \
            url."https://x-access-token:${GH_TOKEN}@github.com/Meridiona/screenpipe-fork".insteadOf \
            "https://github.com/Meridiona/screenpipe-fork"

      # See release-build.yml's Windows job for the full story: vendored
      # OpenSSL (via `bundled-sqlcipher-vendored-openssl`) compiles from
      # source and needs NASM on PATH. windows-latest's bundled Strawberry
      # Perl already covers the Perl half — do not install a second one.
      - name: Install NASM (for vendored OpenSSL's assembly routines)
        # Pinned to the commit behind v1.5.2, not the mutable `v1` tag: this
        # job authenticates as GH_TOKEN and can write to the shared cache, so
        # a repointed mutable tag is a supply-chain path worth closing here.
        # NOTE: release-build.yml's own Windows job still uses the mutable
        # `v1` tag as of this writing — this job is intentionally the more
        # conservative of the two on this one line, not a byte-for-byte match.
        # NASM's action choice doesn't affect cache-key parity either way.
        uses: ilammy/setup-nasm@72793074d3c8cdda771dba85f6deafe00623038b # v1.5.2

      - name: Install Rust 1.93.1
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.93.1"
          # No explicit target: windows-latest's host triple
          # (x86_64-pc-windows-msvc) is exactly what we ship.

      - uses: Swatinem/rust-cache@v2
        with:
          # MUST match release-build.yml's Windows job byte for byte — same
          # reasoning as the macOS job above.
          add-job-id-key: false
          shared-key: windows-release-x86_64-pc-windows-msvc
          # Unconditional: this job's push/schedule triggers only ever fire on
          # `main`, and writing that cache is its entire purpose. A manual
          # `workflow_dispatch` CAN target any branch, but GitHub scopes a
          # cache save to the triggering ref, so a dispatch from elsewhere
          # just writes a side entry under that ref — it can't clobber the
          # `main`-scoped cache release-build.yml restores from.
          save-if: true

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: |
            ui/package-lock.json
            tray/package-lock.json

      - name: Install UI + tray deps
        run: |
          (cd ui && npm ci --no-audit --no-fund)
          (cd tray && npm ci --no-audit --no-fund)

      - name: Build the UI
        # Compiling with plain `cargo build` (see below) bypasses `tauri
        # build`'s automatic `beforeBuildCommand`, so this has to run
        # explicitly — generate_context! embeds ui/out at compile time.
        shell: bash
        run: cd ui && npm run build

      - name: Stub the daemon so tauri-build's resource check passes
        # Both binaries now compile in ONE cargo invocation (see below), with
        # no ordering guarantee that meridian.exe finishes linking before
        # meridian-tray's build.rs stats it — same reason release-build.yml's
        # Windows job needs this now.
        shell: bash
        run: |
          mkdir -p target/release
          : > target/release/meridian.exe

      - name: Compile daemon + tray (x86_64-pc-windows-msvc)
        working-directory: tray
        # ONE cargo invocation for both binaries — IDENTICAL to
        # release-build.yml's Windows compile command (minus TAURI_CONFIG,
        # same reasoning as the macOS warm job above: this only ever runs on
        # `main`, the stable config). Must stay byte-for-byte identical or
        # the cache silently stops matching.
        #
        # `shell: pwsh`, NOT this job's bash default — see release-build.yml's
        # Windows job for why: Git Bash unconditionally forces its own MSYS
        # perl ahead of Strawberry Perl on PATH regardless of PATH ordering,
        # and MSYS perl is missing CPAN modules OpenSSL's Configure script
        # needs. No `tauri bundle` here — this job compiles to seed the
        # cache, it doesn't ship, so none of the signing secrets are needed.
        shell: pwsh
        run: |
          cargo build --release --locked --manifest-path ../Cargo.toml `
            -p meridian --bin meridian `
            -p meridian-tray --bin meridian-tray `
            --features tauri/custom-protocol

      - name: Summary
        if: always()
        run: |
          {
            echo "### Cache warm (Windows)"
            echo "Seeded \`windows-release-x86_64-pc-windows-msvc\` under \`refs/heads/main\`."
          } >> "$GITHUB_STEP_SUMMARY"

  # ── Prune superseded caches (release AND ci.yml's PR-check caches) ──────────
  #
  # GitHub Actions caches are IMMUTABLE per key. Swatinem/rust-cache's key
  # includes a hash component that shifts over time (toolchain/workspace
  # fingerprinting), so every run that can't reuse an EXACT prior key writes a
  # brand-new ~750MB-1.4GB entry rather than replacing the old one — the old
  # one just sits there, unreachable by any future restore, until the repo
  # crosses its 10GB cache cap and GitHub's LRU eviction removes SOMETHING
  # (not necessarily the stale one). Measured directly: this repo hit
  # 11.3GB/34 caches once (fixed by hand), climbed back to 10.49GB/42 after a
  # single subsequent warm run — and separately, ci.yml's `ci-macos-silicon`
  # cache (unrelated to the release caches below, a debug/test profile build
  # on `pre-main`) was found sitting at FOUR duplicate copies of itself before
  # this job covered it too. Manual cleanup doesn't scale — this job
  # automates all of it.
  #
  # Runs after both warm jobs (needs + always()) so it sees whatever they just
  # saved, keeps the newest cache per prefix on its OWN ref, deletes every
  # older one matching that prefix. Safe by construction: each prefix is
  # paired with the one ref it's ever scoped to (release caches only ever
  # live on `main`; ci.yml's caches only ever save on `pre-main` — see each
  # job's own `save-if`), so this never touches a tag or PR cache, and never
  # deletes the newest entry for any prefix (so a future build always has
  # something to restore).
  prune-stale-caches:
    name: Prune superseded caches
    needs: [warm-macos, warm-windows]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Deleting a cache entry via the REST API needs actions:write — kept
      # scoped to just this job, not the whole workflow.
      actions: write
    steps:
      - name: Delete every cache except the newest per prefix on its own ref
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # prefix|ref pairs. Release caches live on main (this workflow's own
          # target); ci.yml's caches save on pre-main (see ci.yml's rust/
          # rust-windows jobs' save-if) — a different ref, so each pair is
          # queried separately rather than assuming one ref for everything.
          pairs=(
            "v0-rust-macos-release-aarch64-apple-darwin|refs/heads/main"
            "v0-rust-windows-release-x86_64-pc-windows-msvc|refs/heads/main"
            "v0-rust-ci-macos-silicon|refs/heads/pre-main"
            "v0-rust-ci-windows|refs/heads/pre-main"
          )
          for pair in "${pairs[@]}"; do
            prefix="${pair%%|*}"
            ref="${pair##*|}"
            echo "=== ${prefix} (${ref}) ==="
            # --paginate: without it, per_page=100 silently caps this pair at
            # its first 100 caches with no follow-up page — this repo already
            # climbed to 42 caches after a single warm run, so a busy prefix
            # exceeding 100 would hide older stale entries from pruning
            # entirely, the exact unbounded-growth failure this job exists to
            # close. `|| true` on the listing itself: a transient gh api
            # failure (rate limit, etc.) on one pair must not abort the whole
            # script under set -euo pipefail — skip just this pair and let
            # the next scheduled run retry it, same tolerance the delete call
            # below already has.
            stale=$(gh api --paginate "repos/${{ github.repository }}/actions/caches?per_page=100&ref=${ref}" \
              --jq --arg p "$prefix" \
              '[.actions_caches[] | select(.key | startswith($p))] | sort_by(.created_at) | reverse | .[1:] | .[].id') \
              || { echo "::warning::failed to list caches for ${prefix} (${ref}), skipping this pair"; continue; }
            if [ -z "$stale" ]; then
              echo "nothing to prune"
              continue
            fi
            for id in $stale; do
              echo "deleting superseded cache $id"
              gh api -X DELETE "repos/${{ github.repository }}/actions/caches/${id}" \
                || echo "::warning::failed to delete cache ${id} (non-fatal, next run will retry)"
            done
          done

      - name: Reap orphaned sccache objects
        env:
          GH_TOKEN: ${{ github.token }}
        # sccache's GHA backend was removed from this workflow and from
        # release-build.yml, but the entries it already wrote do not expire for
        # a week and there are thousands of them. They are not merely clutter:
        # the repo cache quota is 10 GB repo-wide and GitHub evicts it by LRU
        # across ALL entries, so a swarm of tiny objects evicts the ~1.4 GB
        # tarballs the release build depends on. Measured before this landed:
        # 5288 `sccache/*` entries vs 20 for everything else, 8.8 GB total, and
        # the `macos-release-aarch64-apple-darwin` tarball already gone hours
        # after a successful warm run wrote it.
        #
        # This deletes them in bulk on the first run and finds nothing on every
        # run after, at which point it is a no-op that costs one API call. It is
        # kept (rather than being a one-off manual cleanup) so that re-adding
        # sccache anywhere cannot quietly recreate the condition — the entries
        # get reaped nightly and whoever added it sees the deletions in the log.
        #
        # Deliberately unbounded by ref: sccache scoped its writes to whatever
        # ref happened to be building, so these are spread across main, tags and
        # PR merge refs. `|| true` throughout — reaping is best-effort
        # housekeeping and must never fail a warm run.
        run: |
          set -uo pipefail
          ids=$(gh api --paginate "repos/${{ github.repository }}/actions/caches?per_page=100" \
            --jq '.actions_caches[] | select(.key | startswith("sccache/")) | .id' 2>/dev/null) || true
          if [ -z "${ids}" ]; then
            echo "no orphaned sccache entries"
            exit 0
          fi
          n=0
          for id in $ids; do
            gh api -X DELETE "repos/${{ github.repository }}/actions/caches/${id}" >/dev/null 2>&1 \
              && n=$((n + 1)) || true
          done
          echo "reaped ${n} orphaned sccache cache entries"
