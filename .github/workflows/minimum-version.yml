name: Set minimum supported version

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Forced-update policy"
        type: choice
        required: true
        default: set-latest
        options:
          - set-latest
          - clear

concurrency:
  # Shared with promote-rc.yml so a floor update cannot race stable promotion's
  # read-and-carry-forward of this mutable updater policy.
  group: stable-release-metadata
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update-policy:
    name: Update latest stable updater policy
    runs-on: ubuntu-latest
    steps:
      - name: Check out the policy helper
        uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false

      - name: Validate and update latest stable manifest
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
          ACTION: ${{ inputs.action }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          latest_tag="$(gh api "repos/${REPO}/releases/latest" --jq '.tag_name')"
          if [[ ! "${latest_tag}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::latest release tag ${latest_tag} is not canonical vX.Y.Z"
            exit 1
          fi
          latest_version="${latest_tag#v}"
          latest_meta="$(gh release view "${latest_tag}" --repo "${REPO}" --json isDraft,isPrerelease,assets)"
          if [ "$(jq -r '.isDraft' <<<"${latest_meta}")" != "false" ] || \
             [ "$(jq -r '.isPrerelease' <<<"${latest_meta}")" != "false" ]; then
            echo "::error::latest release ${latest_tag} is not a published stable release"
            exit 1
          fi

          if ! jq -e '.assets[] | select(.name == "latest.json")' <<<"${latest_meta}" >/dev/null; then
            echo "::error::latest stable ${latest_tag} has no latest.json asset"
            exit 1
          fi

          tmp="$(mktemp -d)"
          gh release download "${latest_tag}" --repo "${REPO}" --pattern latest.json --dir "${tmp}"

          floor="$(python3 scripts/promote-rc-assets.py policy \
            --manifest "${tmp}/latest.json" \
            --action "${ACTION}" \
            --latest-version "${latest_version}")"

          gh release upload "${latest_tag}" --repo "${REPO}" --clobber "${tmp}/latest.json"

          mkdir "${tmp}/verify"
          gh release download "${latest_tag}" --repo "${REPO}" \
            --pattern latest.json --dir "${tmp}/verify"
          if ! cmp -s "${tmp}/latest.json" "${tmp}/verify/latest.json"; then
            echo "::error::uploaded latest.json differs from the validated policy manifest"
            exit 1
          fi
          uploaded_floor="$(python3 scripts/promote-rc-assets.py minimum \
            --manifest "${tmp}/verify/latest.json")"
          if [ "${uploaded_floor}" != "${floor}" ]; then
            echo "::error::uploaded minimum-version policy does not match the requested state"
            exit 1
          fi

          {
            echo "### Minimum supported version"
            echo ""
            echo "- Latest stable: \`${latest_tag}\`"
            if [ "${ACTION}" = "set-latest" ]; then
              echo "- Forced-update floor: \`${latest_version}\`"
              echo "- Clients below the floor will force-update to the latest stable release."
            else
              echo "- Forced-update floor: cleared"
              echo "- Updates are consent-based again."
            fi
            echo "- Product binaries were not changed."
          } >> "${GITHUB_STEP_SUMMARY}"
