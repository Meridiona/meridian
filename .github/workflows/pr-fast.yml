name: Fast PR

on:
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  group: fast-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  SQLX_OFFLINE: "true"
  CARGO_INCREMENTAL: "0"
  CARGO_NET_RETRY: "3"
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

jobs:
  changes:
    name: Fast / classify changes
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ github.event_name == 'merge_group' && 'true' || steps.paths.outputs.rust }}
      core: ${{ github.event_name == 'merge_group' && 'true' || steps.paths.outputs.core }}
      oauth: ${{ github.event_name == 'merge_group' && 'true' || steps.paths.outputs.oauth }}
      daemon: ${{ github.event_name == 'merge_group' && 'true' || steps.paths.outputs.daemon }}
      tray: ${{ github.event_name == 'merge_group' && 'true' || steps.paths.outputs.tray }}
      ui: ${{ github.event_name == 'merge_group' && 'true' || steps.paths.outputs.ui }}
      migrations: ${{ github.event_name == 'merge_group' && 'true' || steps.paths.outputs.migrations }}
      installer: ${{ github.event_name == 'merge_group' && 'true' || steps.paths.outputs.installer }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Merge queue entries represent the combined speculative tree, not a normal
      # pull_request diff. Run the whole fast suite there; PRs still use path routing.
      - uses: dorny/paths-filter@v4
        if: github.event_name != 'merge_group'
        id: paths
        with:
          filters: |
            rust:
              - '**/*.rs'
              - '**/Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - '.cargo/**'
              - 'build.rs'
            core:
              - 'meridian-core/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - '.cargo/**'
            oauth:
              - 'meridian-oauth/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - '.cargo/**'
            daemon:
              - 'src/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'build.rs'
              - 'rust-toolchain.toml'
              - '.cargo/**'
            tray:
              - 'tray/src-tauri/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - '.cargo/**'
            ui:
              - 'ui/**'
              - 'tray/src/**'
            migrations:
              - 'src/migrations/**'
            installer:
              - 'install.sh'
              - 'scripts/**'
              - 'tests/install/**'
              - 'tray/src-tauri/tauri*.conf.json'
              - 'tray/src-tauri/icons/**'

  rust-fmt:
    name: Fast / Rust fmt
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.93.1"
          components: rustfmt
      - run: cargo fmt --check

  rust-core:
    name: Fast / meridian-core
    needs: changes
    if: needs.changes.outputs.core == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Authenticate private screenpipe fork
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          git config --global \
            url."https://x-access-token:${GH_TOKEN}@github.com/Meridiona/screenpipe-fork".insteadOf \
            "https://github.com/Meridiona/screenpipe-fork"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.93.1"
          components: clippy
      - name: Lint changed crate
        run: cargo clippy -p meridian-core --all-targets -- -D warnings
      - name: Test changed crate
        run: cargo test -p meridian-core

  rust-oauth:
    name: Fast / meridian-oauth
    needs: changes
    if: needs.changes.outputs.oauth == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Authenticate private screenpipe fork
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          git config --global \
            url."https://x-access-token:${GH_TOKEN}@github.com/Meridiona/screenpipe-fork".insteadOf \
            "https://github.com/Meridiona/screenpipe-fork"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.93.1"
          components: clippy
      - name: Lint changed crate
        run: cargo clippy -p meridian-oauth --all-targets -- -D warnings
      - name: Test changed crate
        run: cargo test -p meridian-oauth

  rust-daemon:
    name: Fast / daemon
    needs: changes
    if: needs.changes.outputs.daemon == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Authenticate private screenpipe fork
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          git config --global \
            url."https://x-access-token:${GH_TOKEN}@github.com/Meridiona/screenpipe-fork".insteadOf \
            "https://github.com/Meridiona/screenpipe-fork"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.93.1"
          components: clippy
      - name: Lint daemon library and CLI
        run: cargo clippy -p meridian --lib --bin meridian -- -D warnings
      - name: Run daemon library tests
        run: cargo test -p meridian --lib

  rust-tray:
    name: Fast / tray compile
    needs: changes
    if: needs.changes.outputs.tray == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Authenticate private screenpipe fork
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          git config --global             url."https://x-access-token:${GH_TOKEN}@github.com/Meridiona/screenpipe-fork".insteadOf             "https://github.com/Meridiona/screenpipe-fork"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.93.1"
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          add-job-id-key: false
          shared-key: ci-macos-silicon
          save-if: false

      - name: Stub bundled daemon resource
        run: |
          mkdir -p target/release
          : > target/release/meridian

      # Intentionally compile/lint the tray library only. Reuse the dependency
      # cache seeded by post-merge macOS CI on main, so PRs do not spend ~10 min
      # rebuilding the same native dependency graph from scratch. Full tray tests
      # and both shipped platforms remain in exhaustive post-merge CI.
      - name: Lint tray library
        run: cargo clippy -p meridian-tray --lib -- -D warnings

  ui:
    name: Fast / UI
    needs: changes
    if: needs.changes.outputs.ui == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - uses: oven-sh/setup-bun@v2

      # PRs consume the cache produced by main CI but never write their own
      # immutable copy. This keeps one Next.js lineage instead of one per PR ref.
      - uses: actions/cache/restore@v6
        with:
          path: ui/.next/cache
          key: nextjs-${{ hashFiles('ui/package-lock.json') }}-${{ hashFiles('ui/**/*.ts', 'ui/**/*.tsx') }}
          restore-keys: |
            nextjs-${{ hashFiles('ui/package-lock.json') }}-
            nextjs-

      - name: Install
        working-directory: ui
        run: npm ci --no-audit --no-fund

      - name: Tests
        working-directory: ui
        run: bun test

      - name: Typecheck
        working-directory: ui
        run: npm run typecheck

      - name: Static production build
        working-directory: ui
        run: npm run build

  install-package:
    name: Fast / install package
    needs: changes
    if: needs.changes.outputs.installer == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: bash tests/install/run.sh

  migrations:
    name: Fast / migrations append-only
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.migrations == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Reject modified, renamed, or deleted migrations
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          violations=$(git diff --name-status "$BASE_SHA"...HEAD -- src/migrations             | grep -E '^(M|D|R)' || true)
          if [ -n "$violations" ]; then
            echo "::error::Shipped migrations are immutable. Add a new numbered migration."
            echo "$violations"
            exit 1
          fi

  policy:
    name: Fast / release + license policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Keep release promotion explicit and immutable
        run: |
          python3 - <<'PY'
          import pathlib, sys, yaml

          build_src = pathlib.Path(".github/workflows/release-build.yml").read_text()
          prep_src = pathlib.Path(".github/workflows/release-prepare.yml").read_text()
          promote_src = pathlib.Path(".github/workflows/promote-rc.yml").read_text()
          promote_helper_src = pathlib.Path("scripts/promote-rc-assets.py").read_text()
          build = yaml.safe_load(build_src)
          prep = yaml.safe_load(prep_src)
          promote = yaml.safe_load(promote_src)

          build_triggers = build.get("on", build.get(True)) or {}
          prep_triggers = prep.get("on", prep.get(True)) or {}
          promote_triggers = promote.get("on", promote.get(True)) or {}
          fail = []

          if "push" in build_triggers:
              fail.append("release-build.yml must remain workflow_dispatch-only")
          build_dispatch = build_triggers.get("workflow_dispatch") or {}
          if "tag" not in (build_dispatch.get("inputs") or {}):
              fail.append("release-build.yml workflow_dispatch must keep its immutable tag input")
          if "refs/heads/main" not in build_src:
              fail.append("release-build.yml must keep its main-ref cache-scope guard")

          if "push" in prep_triggers:
              fail.append("release-prepare.yml must not release on branch push; promotion is explicit")
          prep_dispatch = prep_triggers.get("workflow_dispatch") or {}
          inputs = prep_dispatch.get("inputs") or {}
          if "candidate_sha" not in inputs:
              fail.append("release-prepare.yml must require an exact candidate_sha")
          if '!= "main"' not in prep_src:
              fail.append("release-prepare.yml must guard RC preparation to main")
          if 'expected="pre-main"' in prep_src:
              fail.append("release-prepare.yml must not route RC preparation through pre-main")
          if "--ref main" not in prep_src:
              fail.append("release-prepare.yml must dispatch release-build against main cache scope")

          if "push" in promote_triggers:
              fail.append("promote-rc.yml must remain manual-only")
          promote_dispatch = promote_triggers.get("workflow_dispatch") or {}
          if "rc_tag" not in (promote_dispatch.get("inputs") or {}):
              fail.append("promote-rc.yml must require an explicit rc_tag")
          for invariant in (
              "refs/heads/main",
              "published prerelease",
              "already exists; promotion never overwrites",
              "actions/runs/${smoke_run_id}",
              "promote-rc-assets.py stage",
              "promote-rc-assets.py verify",
          ):
              if invariant not in promote_src:
                  fail.append(f"promote-rc.yml is missing invariant: {invariant}")
          if "gh workflow run release-build.yml" in promote_src or "uses: ./.github/workflows/release-build.yml" in promote_src:
              fail.append("promote-rc.yml must never dispatch the product build")
          for proof in ("smoke-windows.ok", "smoke-macos.ok"):
              if proof not in promote_helper_src:
                  fail.append(f"promotion helper must require exact-artifact proof {proof}")
          for proof in ("smoke-windows.ok", "smoke-macos.ok"):
              if proof not in build_src:
                  fail.append(f"release-build.yml must require exact-artifact proof {proof} before publish")
          if "Publish proven artifact set" not in build_src:
              fail.append("release-build.yml must publish only after reusable artifact smokes")

          if fail:
              for message in fail:
                  print(f"::error::{message}")
              sys.exit(1)
          print("OK - RC creation builds immutable tags; stable promotion reuses proven artifacts.")
          PY

      - name: Keep screenpipe fork on audited MIT-based revision
        run: |
          expected="61332b8a15f09a08876455ad45713eb3b1bfa2df"
          file="tray/src-tauri/Cargo.toml"
          fail=0
          for crate in screenpipe-screen screenpipe-a11y; do
            rev=$(grep -E "^${crate} = " "$file" | grep -oE 'rev = "[0-9a-f]+"' | cut -d'"' -f2)
            if [ "$rev" != "$expected" ]; then
              echo "::error file=$file::${crate} rev is '${rev}', expected audited MIT-based '${expected}'"
              fail=1
            fi
          done
          exit "$fail"

  gate:
    name: Fast PR gate
    if: always()
    needs:
      - changes
      - rust-fmt
      - rust-core
      - rust-oauth
      - rust-daemon
      - rust-tray
      - ui
      - install-package
      - migrations
      - policy
    runs-on: ubuntu-latest
    steps:
      - name: Require every selected fast check
        env:
          CHANGES: ${{ needs.changes.result }}
          RUST_FMT: ${{ needs.rust-fmt.result }}
          CORE: ${{ needs.rust-core.result }}
          OAUTH: ${{ needs.rust-oauth.result }}
          DAEMON: ${{ needs.rust-daemon.result }}
          TRAY: ${{ needs.rust-tray.result }}
          UI: ${{ needs.ui.result }}
          INSTALLER: ${{ needs.install-package.result }}
          MIGRATIONS: ${{ needs.migrations.result }}
          POLICY: ${{ needs.policy.result }}
        run: |
          fail=0
          for pair in             "changes:$CHANGES"             "rust-fmt:$RUST_FMT"             "core:$CORE"             "oauth:$OAUTH"             "daemon:$DAEMON"             "tray:$TRAY"             "ui:$UI"             "installer:$INSTALLER"             "migrations:$MIGRATIONS"             "policy:$POLICY"
          do
            name="${pair%%:*}"
            result="${pair#*:}"
            printf '%-12s %s\n' "$name" "$result"
            case "$result" in
              success|skipped) ;;
              *) fail=1 ;;
            esac
          done
          exit "$fail"
