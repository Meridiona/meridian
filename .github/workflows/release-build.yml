name: Release (build & publish)

# BUILDS, SIGNS, NOTARIZES AND PUBLISHES A TAGGED RELEASE. DECIDES NOTHING.
#
# Triggered by the `v*` tag that release-prepare.yml pushes. Read that file's
# header first — it explains why version-deciding and building are separate
# workflows (short version: semantic-release demands branch HEAD, an immutable
# build ref demands the opposite, and a 30-minute build makes the conflict
# certain rather than theoretical).
#
# THIS FILE REPLACES BOTH release-staging.yml AND the old monolithic
# release.yml, which have been deleted. It is now the ONLY build path, for both
# channels, and the channel is derived from the tag — so stable and staging
# cannot drift from each other:
#
#     v1.75.0            -> stable   (browser-downloaded DMG; notarized;
#                                     served from `releases/latest`)
#     v1.72.0-staging.6  -> staging  (notarized too — a directly-downloaded
#                                     staging DMG is quarantined exactly like
#                                     a stable one, so it needs a ticket just
#                                     the same; served from `updater-staging`)
#
# Both channels are now notarized identically — the one remaining difference
# keyed off `prepare`'s `channel` output is the staging tauri config (updater
# endpoint etc). Everything else — compile, signing, notarizing, packaging,
# verification, publishing — is one shared path.
#
# ── SHAPE ────────────────────────────────────────────────────────────────────
#
#   prepare   ubuntu   validate tag == manifest version · create DRAFT release
#      |
#      +--> build (macOS aarch64) --+
#      +--> build (Windows x86_64) -+
#      |
#   publish   ubuntu   compose latest.json · verify asset set · draft -> public
#
# macOS is Apple-Silicon-only (Intel/x86_64 was removed — see the macos job's
# matrix comment). Windows was ALSO removed at the same time this pipeline was
# rewritten and has since been restored as its own job below, running in
# PARALLEL with macOS (not sequentially after it, the way the old monolithic
# release.yml ran it — that added ~38 minutes of critical path for no reason
# other than being written before this pipeline had a fan-out shape at all).
#
# Production still does not publish a macOS Intel build: existing Intel
# installs find no newer release on their updater endpoint and simply stop
# updating; they are not broken, just frozen. Restoring that one is a genuine
# one-line matrix re-add (see the macos job's matrix comment + the header note
# in compose-updater-manifest.py) since the Windows restoration below already
# proves the fan-out shape handles a second platform correctly.
#
# ── WHY PER-ARCH macOS INSTEAD OF ONE UNIVERSAL BINARY ───────────────────────
#
# Notarization is the floor of a macOS release and the one part we cannot make
# faster — Apple's notary queue is 2-5 minutes and is not ours to optimise.
#
# A universal build has exactly ONE notarization chain, and it sits AFTER both
# architectures have compiled and been lipo'd together, so the wait is strictly
# serial with everything else. Building per-arch puts each architecture on its
# own runner, so the two notarization waits OVERLAP instead of queueing. It also
# halves each DMG (faster to notarize, upload and download) and deletes the lipo
# join job entirely.
#
# Existing installs migrate transparently: tauri-plugin-updater resolves
# `darwin-aarch64` / `darwin-x86_64` from the CPU the running app is on, not
# from what the manifest was built from — so pointing those keys at per-arch
# tarballs instead of one fat one is invisible to an already-installed app.
# (Documented in scripts/package-updater.sh.) The only user-visible change is
# that the download page needs two links.
#
# Splitting arches is also what the OFFICIAL Tauri matrix does; universal is
# relegated to an example file upstream.
#
# ── WHY THE BUILD IS ONE CARGO INVOCATION, NOT TWO ───────────────────────────
#
# See the "Compile daemon + tray" step. This used to be two separate
# invocations (`cargo build -p meridian --bin meridian`, then `tauri build`),
# because passing `-- -p meridian --bin meridian` *through the Tauri CLI*
# fails: `tauri build` injects `--features tauri/custom-protocol` scoped to
# whatever it thinks the app package is, and when the CLI's own `-p` and the
# passthrough `-p meridian` collide, cargo tries to apply that feature to
# `meridian` — which has no `tauri` dependency — and every platform fails with
# `the package 'meridian' does not contain this feature: tauri/custom-protocol`.
#
# That failure is specific to going through the Tauri CLI's own package
# scoping, not to combining the two builds. Invoking `cargo` directly instead —
# `cargo build -p meridian --bin meridian -p meridian-tray --bin
# meridian-tray --features tauri/custom-protocol` — works: `tauri/custom-protocol`
# uses Cargo's `dep-name/feature-name` syntax (activate a feature on a named
# dependency, wherever it appears in the build graph), and `tauri` IS reachable
# from this combined request (via `meridian-tray`), so it resolves cleanly.
#
# This was the actual cost, not a theoretical one: the old two-invocation shape
# recompiled `meridian`/`meridian-core`/every shared dependency a SECOND time
# inside the `tauri build` step, because cargo's fingerprinting is scoped per
# invocation — two separate `cargo`/`tauri build` processes, even against the
# same `target/`, compute different build-graph metadata and don't share
# fingerprints. Confirmed directly from raw build logs (not assumed): `meridian`,
# `meridian-core`, and `tokio` each compiled twice, ~5-6 minutes of pure waste
# on a warm macOS build. One combined invocation compiles every shared crate
# exactly once — verified on a true cold build, both platforms, before this
# was rolled in (macOS: local test, each shared crate compiled once, correct
# binaries, `tauri bundle` packaged in ~1s with zero extra compilation; Windows:
# GitHub Actions windows-latest, cold compile 46m6s → 30m48s, zero duplicate
# compiles, NSIS bundle succeeded with zero recompilation).
#
# `tauri bundle` (used below, separately, for packaging/signing/notarizing)
# already ran zero cargo invocations even before this change — bundling was
# never part of the duplication, only the compile step was.
#
# Compile-time config (e.g. the staging channel's updater endpoint, baked into
# the binary by `generate_context!()`) still needs to differ by channel even
# though this now bypasses the Tauri CLI's own `--config` flag. `tauri-build`'s
# `build()` (called from `tray/src-tauri/build.rs`) reads a `TAURI_CONFIG` env
# var — a JSON string it `json_patch::merge`s onto the base config — which is
# exactly the mechanism `--config` uses under the hood (confirmed directly
# against tauri-build 2.6.2's source, not assumed). The "Compile daemon + tray"
# step below sets that env var to the staging config file's contents for
# staging builds, replicating `--config src-tauri/tauri.staging.conf.json`
# without going through the CLI. The later `tauri bundle` step keeps its
# explicit `--config` flag unchanged — bundling metadata (naming, identifiers)
# goes through the CLI as before; only the compile step needed the env-var
# equivalent.

on:
  push:
    # EVERY release tag, both channels. `v1.75.0` builds stable, `v1.75.0-staging.3`
    # builds staging; the channel is derived from the tag string in `prepare`, so
    # one pipeline serves both and they cannot drift apart.
    #
    # This was `v*-staging*` while the pipeline was being proven on staging and
    # the old monolithic release.yml still owned `main` — matching `v*` then
    # would have made BOTH pipelines fire on the same production tag. That
    # workflow has since been deleted, so `v*` is now unambiguous.
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing v*-staging* tag to (re)build and publish (or to compile against, if cache_warm_only)"
        required: true
        type: string
      cache_warm_only:
        # For seeding the `main`-scoped rust-cache entries the macos/windows
        # jobs' `save-if` conditions require (see their rust-cache steps) —
        # a tag push can only ever restore a cache saved on that SAME tag or
        # on `main`, never a sibling tag, so a `main`-scoped entry has to
        # exist before any tag build can warm-start. Dispatching this
        # workflow with branch context = `main` and this input set to true
        # compiles + saves the cache exactly like a real release build would,
        # but skips creating/publishing anything — no draft release, no
        # signing, no notarization, no asset upload. Safe to run against an
        # already-published tag for exactly that reason.
        description: "Compile + warm the release rust-cache only. Skips creating/publishing a release entirely. Run with branch context = main."
        required: false
        type: boolean
        default: false

# Serialise releases. Two in flight would fight over the rolling updater tag,
# the shared caches, and Apple's notarization throughput. Never cancel in
# progress: a killed run can leave a draft release and a half-uploaded asset set.
concurrency:
  group: release-build
  cancel-in-progress: false

permissions:
  contents: read

env:
  SQLX_OFFLINE: "true"
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # sccache — see the "Set up sccache" step comment in each compile job for
  # why this runs alongside rust-cache rather than replacing it. Harmless on
  # jobs that never invoke cargo (prepare, publish).
  RUSTC_WRAPPER: sccache
  SCCACHE_GHA_ENABLED: "true"

jobs:
  # ── Stage 1: cheap validation + a draft release for everyone to upload into ──
  prepare:
    name: Validate + draft release
    runs-on: ubuntu-latest
    permissions:
      contents: write # creates the draft release
    outputs:
      tag: ${{ steps.ctx.outputs.tag }}
      version: ${{ steps.ctx.outputs.version }}
      channel: ${{ steps.ctx.outputs.channel }}
      prerelease: ${{ steps.ctx.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
          persist-credentials: false

      - name: Derive the release context from the tag
        id: ctx
        env:
          RAW_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          tag="${RAW_TAG}"
          version="${tag#v}"

          # The channel is a property of the version string, so it cannot drift
          # from what semantic-release actually cut.
          if [[ "${version}" == *-staging* ]]; then
            channel=staging
            prerelease=true
          else
            channel=stable
            prerelease=false
          fi

          {
            echo "tag=${tag}"
            echo "version=${version}"
            echo "channel=${channel}"
            echo "prerelease=${prerelease}"
          } >> "$GITHUB_OUTPUT"
          echo "→ ${tag} — ${channel} channel"

      - name: Assert the tag matches the committed version
        env:
          VERSION: ${{ steps.ctx.outputs.version }}
          # Bound through env, never interpolated into `run:`. A tag name is a
          # PUSHABLE ref — anyone who can push `v*` chooses this string, so
          # expanding it into the shell would let a tag name carrying shell
          # metacharacters execute on the runner. Same reason RAW_TAG above is
          # bound rather than interpolated.
          CHANNEL: ${{ steps.ctx.outputs.channel }}
          TAG: ${{ steps.ctx.outputs.tag }}
        # The version is an INPUT to this pipeline, read from the repo, never
        # recomputed. This is the Zed/clash-verge guard: if the tag and the
        # manifests disagree we would build binaries stamped with one version
        # and advertise another — and the updater compares exactly that field,
        # so the result is an update loop (install, report old version, see the
        # same update again).
        #
        # On the STAGING channel the tag legitimately points at a tree where the
        # version was never committed: .releaserc.staging.json carries no
        # @semantic-release/git plugin, so the bump lives only in the release
        # runner's working tree. There is therefore nothing to compare against —
        # the build stamps the version itself from the tag. Only stable, whose
        # config DOES commit the bump, can be checked.
        run: |
          set -euo pipefail
          if [ "${CHANNEL}" != "stable" ]; then
            echo "→ staging channel: version is stamped from the tag, nothing committed to compare"
            exit 0
          fi
          manifest="$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)"
          if [ "${manifest}" != "${VERSION}" ]; then
            echo "::error::tag ${TAG} does not match Cargo.toml version ${manifest}."
            exit 1
          fi
          echo "✓ Cargo.toml version ${manifest} matches the tag"

      - name: Create (or reuse) the draft release
        if: ${{ !inputs.cache_warm_only }}
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.ctx.outputs.tag }}
          PRERELEASE: ${{ steps.ctx.outputs.prerelease }}
        # DRAFT-FIRST, and it is not merely tidy:
        #   * draft assets are not publicly downloadable and never appear under
        #     releases/latest, so a half-uploaded release CANNOT be consumed by
        #     an updater or a user;
        #   * every platform job needs a stable upload target, and creating it
        #     once here removes the race where concurrent matrix jobs each try
        #     to create the release;
        #   * publishing collapses to a single atomic flag flip after
        #     verification, and any earlier failure leaves a deletable draft
        #     rather than a broken public release.
        #
        # Re-running against an ALREADY PUBLISHED tag is an operator error we
        # refuse loudly (Cap's guard): silently re-uploading assets under a live
        # release is how users get a half-swapped download.
        run: |
          set -euo pipefail
          if gh release view "${TAG}" >/dev/null 2>&1; then
            if [ "$(gh release view "${TAG}" --json isDraft --jq .isDraft)" != "true" ]; then
              echo "::error::${TAG} is already published. Bump the version and cut a new tag rather than rebuilding over a live release."
              exit 1
            fi
            echo "→ reusing existing draft ${TAG}"
          else
            gh release create "${TAG}" \
              --draft \
              --title "${TAG}" \
              --notes "Draft - assets are still uploading." \
              $([ "${PRERELEASE}" = "true" ] && echo --prerelease)
            echo "→ created draft ${TAG}"
          fi

  # ── Stage 2: every platform, concurrently ───────────────────────────────────
  macos:
    name: macOS ${{ matrix.arch }}
    needs: prepare
    runs-on: macos-26
    timeout-minutes: 60 # a hung `notarytool --wait` otherwise burns 10x-billed minutes indefinitely
    permissions:
      contents: write # uploads assets into the draft
      actions: write # sccache's GHA cache backend needs this to SAVE entries, not just read
    strategy:
      # One flaky architecture must not kill the other's artifacts — and we want
      # its timing either way.
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            target: aarch64-apple-darwin
          # macOS Intel (x86_64-apple-darwin) is intentionally not built here —
          # Silicon is the shipped platform, and a native aarch64 build on an
          # Apple-Silicon runner has the smallest failure surface (no
          # cross-compile, no notarization of a second arch). To restore it:
          # re-add the `x86_64-apple-darwin` include, add `darwin-x86_64` to the
          # publish completeness check, and widen REQUIRED in
          # compose-updater-manifest.py. (Windows was the other platform
          # dropped alongside Intel when this pipeline was first written; it
          # has since been restored as its own parallel `windows` job below.)
    env:
      # Compile-time secrets — every one is baked into the binary by build.rs or
      # option_env!, so a MISSING value produces no error, just a shipped app
      # with (say) sign-in quietly unavailable. Keep this list in sync across
      # every build job.
      MERIDIAN_JIRA_OAUTH_CLIENT_SECRET: ${{ secrets.JIRA_OAUTH_CLIENT_SECRET }}
      MERIDIAN_GITHUB_OAUTH_CLIENT_ID: ${{ secrets.GH_OAUTH_CLIENT_ID }}
      MERIDIAN_POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
      MERIDIAN_COUNTER_API_KEY: ${{ secrets.COUNTER_API_KEY }}
      MERIDIAN_CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY_PROD }}
      MERIDIAN_CHANNEL: ${{ needs.prepare.outputs.channel }}
      MERIDIAN_HF_ENDPOINT: https://hf.meridiona.com
      # Signing + updater material. TAURI_SIGNING_* is consumed at BUNDLE time.
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      # SIGNING is unconditional — an updated app is still Gatekeeper-checked
      # against its Developer ID signature when it relaunches, on every channel.
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      # Notarization credentials. These are set UNCONDITIONALLY and the staging
      # skip is done by UNSETTING them in the bundle step — see the long note
      # there. Do NOT try to gate them here with `cond && secret || ''`: an
      # Actions expression that yields '' still DEFINES the variable as an empty
      # string, Tauri reads "defined" as "credentials present", and notarytool
      # is invoked with `--issuer ''` — which fails the whole bundle with
      # "The value '' is invalid for '--issuer <issuer>'". That is exactly how
      # v1.72.0-staging.7 died.
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      TAURI_BUNDLER_DMG_IGNORE_CI: "true"
      # Selects target/<triple>/release/bundle for every script below.
      MERIDIAN_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The TAG — immutable. This is the property the old pipeline tried to
          # get with a pinned SHA and lost to semantic-release's branch check.
          ref: ${{ needs.prepare.outputs.tag }}
          persist-credentials: false

      - name: Install Rust 1.93.1
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.93.1"
          targets: ${{ matrix.target }}

      # Complements rust-cache below, doesn't replace it. rust-cache restores
      # a whole target/ tarball keyed on Cargo.lock — great when it matches
      # exactly, but a tag-triggered build can only ever restore from ITS OWN
      # ref or `main` (GitHub's cache scoping), never from `pre-main` directly.
      # A staging release cut from a `pre-main` that has drifted from `main`
      # (routine — pre-main accumulates merges between releases) gets a
      # partially-stale target/, and rust-cache's fingerprint mismatch forces
      # full recompilation of anything that LOOKS different, even crates whose
      # actual compiled output would be identical. sccache intercepts at the
      # individual rustc-invocation level regardless of why cargo decided to
      # invoke it, so it can still return a hit there. Free GHA cache backend
      # (SCCACHE_GHA_ENABLED below) — same underlying service as rust-cache,
      # so still ref-scoped in principle, but per-object rather than
      # per-tarball, which degrades far more gracefully on drift. Does NOT
      # cover the vendored-OpenSSL C compile or the Swift static-lib build
      # (tauri-plugin-notifications) — that's still rust-cache's job via its
      # cache-directories entry below.
      - name: Set up sccache
        uses: mozilla-actions/sccache-action@fd02668681acd5f960e1372061bee5e3e987195c # v0.0.11

      - uses: Swatinem/rust-cache@v2
        with:
          # shared-key REPLACES rust-cache's automatic job-based key. That
          # matters: by default `add-job-id-key` is true, so ci.yml's
          # macos-universal job, the old release-staging build job and the old
          # release.yml job each computed a DIFFERENT key and none could read
          # another's cache. Three disjoint copies of nearly the same thing,
          # against a quota that was already evicting (8.5GB of 25 caches).
          #
          # Keyed by TARGET only, so every workflow that compiles this triple
          # shares one warm cache.
          add-job-id-key: false
          shared-key: macos-release-${{ matrix.target }}
          # rust-cache restores target/ but NOT ~/.cargo/registry/src, where the
          # pinned tauri-plugin-notifications fork's build.rs writes its Swift
          # static lib. Without this the fingerprint says "fresh" while the .a
          # it produced is gone, and linking fails with "could not find native
          # static library tauri-plugin-notifications". The old pipeline worked
          # around it with `cargo clean -p tauri-plugin-notifications --release`
          # on every run; caching the source directory removes the cause.
          cache-directories: |
            ~/.cargo/registry/src
          # Only ever save from `main`. A run restores from its own ref OR the
          # default branch — nothing else — so a save on a tag ref is only
          # ever restorable by a byte-identical re-run of that SAME tag, which
          # in practice never happens (every release is a brand-new tag).
          # `startsWith(refs/tags/v)` used to be in this condition on the
          # theory that "main must write its own copy or releases can never
          # warm from staging's" — but staging never had one to warm FROM in
          # the first place, and every tag build was quietly writing a
          # ~1.5 GB entry nothing could ever read back, which is what pushed
          # the repo's cache quota (10 GiB, evicted globally by LRU once
          # crossed) to the point of evicting entries other jobs actually
          # need. `refs/heads/pre-main` was dead for the same underlying
          # reason from a different angle: this workflow only ever triggers
          # on a `v*` tag push or `workflow_dispatch` (see the `on:` block),
          # never on a push to `pre-main` itself, so that branch of the
          # condition could never evaluate true.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: |
            ui/package-lock.json
            tray/package-lock.json

      - name: Authenticate git for the private screenpipe-fork dependency
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          git config --global \
            url."https://x-access-token:${GH_TOKEN}@github.com/Meridiona/screenpipe-fork".insteadOf \
            "https://github.com/Meridiona/screenpipe-fork"

      - name: Stamp the version
        # Bound through env rather than interpolated into the shell: the value
        # derives from a tag name, and `${{ }}` inside `run:` is the
        # template-injection shape.
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: bash scripts/set-version.sh "$VERSION"

      - name: Install UI + tray deps
        # The UI must build before the tray compiles: frontendDist (ui/out) is
        # EMBEDDED into the binary by generate_context! at compile time, so it
        # is a build input, not a packaging step.
        #
        # Deliberately NOT hoisted into `prepare` and shared as an artifact:
        # ui/out is architecture-independent so that would save CPU-minutes, but
        # it would move ~1 minute out of three PARALLEL jobs into one SERIAL
        # one. We are optimising wall clock.
        run: |
          (cd ui && npm ci --no-audit --no-fund)
          (cd tray && npm ci --no-audit --no-fund)

      - name: Build the UI
        # `tauri build`'s `beforeBuildCommand` used to do this automatically.
        # Compiling with plain `cargo build` (see "Compile daemon + tray"
        # below) bypasses the Tauri CLI entirely, so this has to run
        # explicitly now — generate_context! embeds ui/out at compile time and
        # panics ("frontendDist ... doesn't exist") if it's missing.
        run: cd ui && npm run build

      - name: Stub the daemon so tauri-build's resource check passes
        # tauri-build only STATS bundle.resources during compilation (it reads
        # the contents at BUNDLE time), so a zero-byte placeholder satisfies it.
        # Required because the single cargo invocation below may run the tray's
        # build script before the daemon binary has been linked. ci.yml relies
        # on the same property.
        run: |
          mkdir -p target/release
          : > target/release/meridian

      - name: Compile daemon + tray (${{ matrix.target }})
        working-directory: tray
        env:
          # Baked into the daemon binary at compile time via option_env!
          # (src/observability/otlp_target.rs) so consented packaged installs
          # know where to ship redacted error telemetry. Sourced from a repo
          # VARIABLE (it is a public URL, not a secret). Unset → empty → central
          # error shipping stays inert, exactly like a plain source build. The
          # companion write token is a SECRET (MERIDIAN_CENTRAL_TELEMETRY_TOKEN);
          # both must be present for a build to ship.
          MERIDIAN_CENTRAL_OTLP_ENDPOINT: ${{ vars.MERIDIAN_CENTRAL_OTLP_ENDPOINT }}
          # The write-only ingest token the gateway's OTel Collector validates
          # (`bearertokenauth/ingest` in ops/central-observability/). A SECRET,
          # unlike the endpoint: it is the one credential a shipped install
          # carries, so it must not appear in logs or the Actions UI. Rotate by
          # changing INGEST_TOKEN on the gateway + this secret, then cutting a
          # release — old tokens stop being accepted immediately.
          MERIDIAN_CENTRAL_TELEMETRY_TOKEN: ${{ secrets.MERIDIAN_CENTRAL_TELEMETRY_TOKEN }}
          # Baked into the TRAY at compile time via option_env! (tray/src-tauri/
          # src/crash.rs) for native-crash reporting to Sentry. A Sentry DSN is
          # embeddable in clients (it only permits SENDING events, not reading),
          # so a repo variable, not a secret. Unset → the tray never initialises
          # Sentry, exactly like a source build.
          MERIDIAN_SENTRY_DSN: ${{ vars.MERIDIAN_SENTRY_DSN }}
          CHANNEL: ${{ needs.prepare.outputs.channel }}
        # ONE cargo invocation for both binaries — see the header comment
        # "WHY THE BUILD IS ONE CARGO INVOCATION, NOT TWO" for the full story
        # (why the earlier attempt through the Tauri CLI failed, why invoking
        # cargo directly doesn't hit the same error, and the measured cost of
        # the old two-invocation shape). The daemon lands in
        # target/<triple>/release/meridian; the "Stage the real daemon" step
        # copies it over the stub before bundling.
        #
        # TAURI_CONFIG replicates `--config src-tauri/tauri.staging.conf.json`
        # for the compile-time-baked config (e.g. the updater endpoint) —
        # `tauri-build`'s build.rs reads this env var and JSON-patches it onto
        # the base config, the same mechanism `--config` uses under the hood.
        # The later `tauri bundle` step keeps its own explicit `--config` flag
        # for bundling metadata, unchanged.
        run: |
          if [ "${CHANNEL}" = "staging" ]; then
            export TAURI_CONFIG="$(cat src-tauri/tauri.staging.conf.json)"
          fi
          cargo build --release --locked --target ${{ matrix.target }} \
            -p meridian --bin meridian \
            -p meridian-tray --bin meridian-tray \
            --features tauri/custom-protocol

      - name: Stage the real daemon for bundling
        # Replaces the stub with the binary the same invocation just produced.
        # `tauri bundle` reads bundle.resources contents at THIS point, so the
        # real file only has to exist now, not at compile time.
        if: ${{ !inputs.cache_warm_only }}
        run: cp "target/${{ matrix.target }}/release/meridian" target/release/meridian

      - name: Import Developer ID certificate + notarization key
        if: ${{ !inputs.cache_warm_only }}
        uses: ./.github/actions/import-apple-cert
        with:
          apple-certificate: ${{ secrets.APPLE_CERTIFICATE }}
          apple-certificate-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          apple-api-key-content: ${{ secrets.APPLE_API_KEY_CONTENT }}

      - name: Sign the daemon
        # Must precede bundling: the daemon is copied into the .app as a
        # resource, and re-signing the enclosing bundle does not sign nested
        # Mach-Os.
        if: ${{ !inputs.cache_warm_only }}
        run: bash scripts/sign-daemon.sh

      - name: Bundle, sign and notarize the app
        working-directory: tray
        if: ${{ !inputs.cache_warm_only }}
        env:
          CHANNEL: ${{ needs.prepare.outputs.channel }}
        # `tauri bundle` runs ZERO cargo invocations — it packages what is
        # already in target/. It signs the .app, notarizes it, staples it, then
        # produces the DMG and the updater tarball.
        #
        # It does NOT notarize the DMG. tauri-bundler's dmg.rs contains no
        # notarize call at all (tauri-apps/tauri#7533, open since 2023) — hence
        # the separate step below.
        #
        # Notarization now runs on EVERY channel, staging included. It used to be
        # skipped on staging on the theory that tauri-plugin-updater never sets
        # the quarantine flag Gatekeeper keys off — true for an in-place update,
        # but false the moment someone downloads a staging DMG directly (browser,
        # `gh release download`, Slack link, …), which quarantines it exactly like
        # a stable DMG and trips "Apple could not verify this app is free of
        # malware" with no ticket to fall back on. APPLE_API_* are already defined
        # unconditionally in this job's `env:` (see the note there on why an
        # Actions `cond && secret || ''` expression is NOT a safe way to gate
        # them), so nothing needs to change to turn notarization on here — the
        # credentials were always present, only the staging branch below used to
        # `unset` them.
        run: |
          set -euo pipefail
          echo "→ ${CHANNEL}: signing AND notarizing"
          # Uses the already-bound $CHANNEL rather than re-interpolating an
          # expression into this script a second time - the exact
          # template-injection shape this file's own convention (see the
          # RAW_TAG/VERSION binding notes elsewhere) says to avoid. (Not
          # spelled out literally here on purpose: GitHub Actions scans the
          # WHOLE run: block's raw text for that syntax, even inside a shell
          # comment, and an empty one fails to parse - this exact line broke
          # every release build until this comment was reworded.)
          config_flag=""
          if [ "${CHANNEL}" = "staging" ]; then
            config_flag="--config src-tauri/tauri.staging.conf.json"
          fi
          npx tauri bundle --target ${{ matrix.target }} --bundles app,dmg ${config_flag}

      - name: Notarize and staple the DMG
        # Runs on every channel now — see the note on the bundle step above for
        # why staging needs this too (a directly-downloaded staging DMG is
        # quarantined exactly like a stable one).
        if: ${{ !inputs.cache_warm_only }}
        # A notarization ticket is keyed to the cdhash of what was submitted, so
        # the stapled .app inside does not cover the container. Without this the
        # DMG a user downloads trips "can't check it for malicious software".
        #
        # Must precede package-updater.sh: stapling REWRITES the file, so the
        # stable-named copy has to be taken afterwards to inherit the ticket.
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: bash scripts/notarize-dmg.sh "$VERSION"

      - name: Package the updater artifacts
        if: ${{ !inputs.cache_warm_only }}
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: bash scripts/package-updater.sh "$VERSION"

      - name: Verify the bundle before anything is uploaded
        # Independently re-checks signing, notarization, stapling and the
        # presence of the updater artifacts. A non-zero exit aborts while the
        # release is still a draft and nothing is publicly reachable.
        #
        # Notarized/stapled checks now run on every channel — see
        # verify-release-bundle.sh's note on why staging needs the same
        # Gatekeeper guarantees a directly-downloaded DMG would otherwise miss.
        if: ${{ !inputs.cache_warm_only }}
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          MERIDIAN_CHANNEL: ${{ needs.prepare.outputs.channel }}
        run: bash scripts/verify-release-bundle.sh "$VERSION"

      - name: Upload this architecture's assets into the draft
        if: ${{ !inputs.cache_warm_only }}
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
          BUNDLE: target/${{ matrix.target }}/release/bundle
        # *** NAME COLLISION IS THE HAZARD HERE, NOT UPLOAD FAILURE. ***
        #
        # Both macOS runners natively produce files called exactly
        # `Meridian.app.tar.gz` (and `Meridian.dmg`). A GitHub release holds ONE
        # asset per name, so uploading both unqualified means the second run
        # REPLACES the first — and roughly half the fleet then auto-updates onto
        # the wrong architecture. Nothing fails; the release looks complete.
        #
        # package-updater.sh therefore also writes arch-suffixed copies
        # (Meridian-aarch64.* / Meridian-x64.*) and points the manifest url at
        # those names. We upload ONLY the suffixed ones. `x64` is
        # tauri-bundler's own spelling for macOS Intel and is kept for the
        # user-facing download names; the manifest fragment is keyed by target
        # TRIPLE instead, so no arch-label mapping has to be maintained.
        run: |
          set -euo pipefail
          shopt -s nullglob

          assets=(
            "${BUNDLE}"/dmg/Meridian-*.dmg
            "${BUNDLE}"/macos/Meridian-*.app.tar.gz
            "${BUNDLE}"/macos/Meridian-*.app.tar.gz.sig
            "${BUNDLE}/macos/updater-${{ matrix.target }}.json"
          )
          if [ ${#assets[@]} -eq 0 ]; then
            echo "::error::no arch-suffixed assets in ${BUNDLE} — package-updater.sh did not run or did not produce them"
            exit 1
          fi

          # Guard the invariant rather than trusting it: an unsuffixed tarball
          # reaching the release is the silent cross-arch-update bug.
          for a in "${assets[@]}"; do
            case "$(basename "$a")" in
              Meridian.app.tar.gz|Meridian.app.tar.gz.sig|Meridian.dmg)
                echo "::error::refusing to upload unsuffixed ${a} — it would collide with the other architecture"
                exit 1 ;;
            esac
            echo "  → $(basename "$a")"
          done

          gh release upload "${TAG}" --clobber "${assets[@]}"

      - name: Clean up signing material
        # Runs even on failure — never leave a cert or key on a runner.
        if: always()
        run: |
          security delete-keychain "${RUNNER_TEMP}/meridian-signing.keychain-db" 2>/dev/null || true
          rm -f "${RUNNER_TEMP}/apple-api-key.p8" "${RUNNER_TEMP}/certificate.p12"

  windows:
    name: Windows x86_64
    needs: prepare
    runs-on: windows-latest
    timeout-minutes: 60 # same cap as macos — bound a hung build instead of falling back to GitHub's 360-minute default
    permissions:
      contents: write # uploads assets into the draft
      actions: write # sccache's GHA cache backend needs this to SAVE entries, not just read
    env:
      # Same compile-time constants the macOS job bakes in (see its `env:`
      # comment) — these are cross-platform values (OAuth client ids, public
      # analytics keys), not macOS-specific ones, so skipping them here would
      # silently ship a Windows build with Jira sign-in, GitHub device flow,
      # analytics, or Clerk sign-in missing. Keep this list in sync with the
      # macOS job's, minus the Apple-only signing/notarization secrets.
      MERIDIAN_JIRA_OAUTH_CLIENT_SECRET: ${{ secrets.JIRA_OAUTH_CLIENT_SECRET }}
      MERIDIAN_GITHUB_OAUTH_CLIENT_ID: ${{ secrets.GH_OAUTH_CLIENT_ID }}
      MERIDIAN_POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
      MERIDIAN_COUNTER_API_KEY: ${{ secrets.COUNTER_API_KEY }}
      MERIDIAN_CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY_PROD }}
      MERIDIAN_CHANNEL: ${{ needs.prepare.outputs.channel }}
      MERIDIAN_HF_ENDPOINT: https://hf.meridiona.com
      # The updater's minisign keypair is cross-platform — the SAME key signs
      # the macOS tarball and the Windows installer, and the pubkey baked into
      # tauri.conf.json verifies both. Consumed by `createUpdaterArtifacts` at
      # bundle time, same as on macOS.
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    defaults:
      run:
        # Every step below is a POSIX script (or invokes one) shared with the
        # macOS job — `git config --global url.insteadOf`, scripts/*.sh. The
        # Windows runner image ships Git Bash for exactly this reason; using
        # it here means these steps do not need a second, PowerShell-flavoured
        # copy maintained in parallel.
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          # The TAG — same immutable ref every other job in this pipeline
          # builds from.
          ref: ${{ needs.prepare.outputs.tag }}
          persist-credentials: false

      # `libsqlite3-sys`'s `bundled-sqlcipher-vendored-openssl` feature (see
      # meridian-core/src/db_crypto.rs) compiles OpenSSL FROM SOURCE via
      # `openssl-src`, which needs Perl and NASM on PATH.
      #
      # Perl: `windows-latest` already ships a full Strawberry Perl at
      # `C:\Strawberry\perl\bin`, confirmed (via a diagnostic run) to carry
      # every CPAN module OpenSSL's Configure script needs — do NOT install a
      # second Perl via `shogo82148/actions-setup-perl` or similar; that
      # action's minimal build is MISSING those modules
      # (Locale::Maketext::Simple, Text::Template) and shadowed the runner's
      # already-working Strawberry Perl, confirmed by an actual failed build.
      #
      # Strawberry Perl still doesn't win by default: this job's steps run
      # under Git Bash (`defaults.run.shell` above), which UNCONDITIONALLY
      # prepends its own MSYS bin dirs (/usr/bin, /mingw64/bin) at shell
      # startup, REGARDLESS of any GITHUB_PATH entry (tried and confirmed
      # ineffective, twice, with both POSIX- and Windows-style path forms —
      # a bash `echo $PATH` inside a later step still showed /usr/bin ahead
      # of Strawberry's path either way). Git Bash's own /usr/bin/perl
      # (msys-perl, cygwin-based) is what was actually failing every time.
      #
      # Fix: run ONLY the actual build step below under `pwsh` instead of
      # this job's bash default — outside Git Bash entirely, Strawberry Perl
      # resolves correctly with no competing MSYS perl in the way. The
      # commands in that step (`cargo build` / `tauri build` via `npm run`)
      # are plain CLI invocations with no bash-specific syntax, so this is
      # safe. NASM is genuinely not bundled by default, so it still needs
      # explicit setup — same action OpenSSL's own upstream CI uses on
      # Windows.
      - name: Install NASM (for vendored OpenSSL's assembly routines)
        # Pinned to the commit behind v1.5.2, not the mutable `v1` tag: this job
        # holds the signing key and the release secrets, so a third-party action
        # that can be re-pointed is a supply-chain path straight into a signed
        # build. Bump deliberately, re-reading the diff.
        uses: ilammy/setup-nasm@72793074d3c8cdda771dba85f6deafe00623038b # v1.5.2

      - name: Install Rust 1.93.1
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.93.1"
          # No explicit target: windows-latest's host triple (x86_64-pc-windows-msvc)
          # is exactly what we ship, so plain `cargo build --release` already
          # produces it — unlike the macOS job, which cross-arch-targets a
          # single shared runner.

      # See the macOS job's "Set up sccache" step for the full reasoning —
      # identical here, complements rust-cache rather than replacing it.
      - name: Set up sccache
        uses: mozilla-actions/sccache-action@fd02668681acd5f960e1372061bee5e3e987195c # v0.0.11

      - uses: Swatinem/rust-cache@v2
        with:
          # Keyed by triple only, same reasoning as the macOS job — one warm
          # cache shared across every workflow that compiles this target.
          add-job-id-key: false
          shared-key: windows-release-x86_64-pc-windows-msvc
          # Only ever save from `main` — see the macOS job's rust-cache step
          # for the full reasoning. This one in particular had NEVER once
          # saved to `main` (confirmed via the cache API: every
          # windows-release-* entry that ever existed was tag-scoped), so
          # every tag-triggered Windows release build restored nothing and
          # compiled OpenSSL-from-source + SQLCipher + the daemon/tray from a
          # stone-cold cache — every single time, not just once. Restoring
          # `main`'s cache instead of a dead tag copy is what actually makes
          # this job fast; dropping the tag-ref save alone would only make it
          # cold forever instead of cold most of the time, so this job's
          # `main`-scoped cache needs to exist before this change helps —
          # currently seeded via a one-off `workflow_dispatch` run with branch
          # context set to `main`.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: |
            ui/package-lock.json
            tray/package-lock.json

      - name: Authenticate git for the private screenpipe-fork dependency
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          git config --global \
            url."https://x-access-token:${GH_TOKEN}@github.com/Meridiona/screenpipe-fork".insteadOf \
            "https://github.com/Meridiona/screenpipe-fork"

      - name: Stamp the version
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: bash scripts/set-version.sh "$VERSION"

      - name: Install UI + tray deps
        # Same reasoning as the macOS job: the UI must build before the tray
        # compiles (frontendDist is embedded at compile time by generate_context!),
        # so it is not hoisted into `prepare` and shared as an artifact.
        run: |
          (cd ui && npm ci --no-audit --no-fund)
          (cd tray && npm ci --no-audit --no-fund)

      - name: Build the UI
        # Same reasoning as the macOS job's "Build the UI" step: compiling via
        # a single `cargo build` (see below) bypasses `tauri build`'s
        # automatic `beforeBuildCommand`, so this has to run explicitly.
        shell: bash
        run: cd ui && npm run build

      - name: Stub the daemon so tauri-build's resource check passes
        # No longer true that Windows skips this the way it used to: that
        # relied on `build:daemon:windows` fully finishing (and producing a
        # REAL target/release/meridian.exe) before `tauri build` ran, in a
        # separate npm-script invocation. Now both binaries compile in ONE
        # cargo invocation (see below), with no ordering guarantee that
        # meridian.exe finishes linking before meridian-tray's build.rs stats
        # it — same reason the macOS job needs a stub. Verified on a true
        # cold GitHub Actions windows-latest build with this stub in place:
        # zero duplicate compiles, correct binaries, NSIS bundle succeeded.
        shell: bash
        run: |
          mkdir -p target/release
          : > target/release/meridian.exe

      - name: Build the daemon + tray (NSIS)
        working-directory: tray
        # `tauri.windows.conf.json` swaps the bundle to NSIS and points
        # bundle.resources at the daemon exe automatically for this target —
        # the extensionless `target/release/meridian` resource entry from the
        # base config is explicitly NULLED OUT by tauri.windows.conf.json,
        # replaced with `target/release/meridian.exe`, which the combined
        # cargo invocation below already produces at exactly that path with
        # no cross-target copy step.
        #
        # `shell: pwsh` here, NOT this job's bash default — see the NOTE above
        # the NASM step for why: Git Bash forces its own MSYS perl (missing
        # CPAN modules OpenSSL's Configure needs) ahead of Strawberry Perl on
        # PATH, no matter what. `npm run` inherits this step's environment
        # regardless of what shell it internally uses to run the script, so
        # this is enough to fix it.
        shell: pwsh
        env:
          # Bound through env rather than interpolated into `run:`, same
          # reason as VERSION/CHANNEL/TAG elsewhere in this file — `${{ }}`
          # inside `run:` is the template-injection shape.
          CHANNEL: ${{ needs.prepare.outputs.channel }}
          # Baked into the daemon .exe via option_env! (see the macOS build step
          # + src/observability/otlp_target.rs). Repo variable, not a secret;
          # unset → central error shipping stays inert.
          MERIDIAN_CENTRAL_OTLP_ENDPOINT: ${{ vars.MERIDIAN_CENTRAL_OTLP_ENDPOINT }}
          # Write-only ingest token the gateway validates. Secret, not a
          # variable — see the macOS build step for the rotation note.
          MERIDIAN_CENTRAL_TELEMETRY_TOKEN: ${{ secrets.MERIDIAN_CENTRAL_TELEMETRY_TOKEN }}
          # Baked into the tray .exe via option_env! (tray crash.rs) for Sentry
          # native-crash reporting. Client-embeddable DSN → repo variable; unset
          # → the tray never initialises Sentry.
          MERIDIAN_SENTRY_DSN: ${{ vars.MERIDIAN_SENTRY_DSN }}
        # ONE cargo invocation for both binaries — same fix as the macOS job,
        # see the header comment "WHY THE BUILD IS ONE CARGO INVOCATION, NOT
        # TWO". `build:windows`/`build:windows:staging` (tray/package.json)
        # now do the combined compile + `tauri bundle` in one script; the
        # channel split is only about which config `tauri bundle` packages
        # with. TAURI_CONFIG is set here (not in package.json) so it applies
        # to the compile half via plain env-var inheritance — npm/node
        # processes inherit the parent shell's environment regardless of
        # which shell they internally spawn, so this works the same way
        # whether `npm run` is invoked from pwsh (here) or bash.
        run: |
          if ($env:CHANNEL -eq "staging") {
            $env:TAURI_CONFIG = Get-Content -Raw src-tauri/tauri.staging.conf.json
            npm run build:windows:staging
          } else {
            npm run build:windows
          }

      - name: Package the updater artifacts
        if: ${{ !inputs.cache_warm_only }}
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: bash scripts/package-updater-windows.sh "$VERSION"

      - name: Upload this platform's assets into the draft
        if: ${{ !inputs.cache_warm_only }}
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
          NSIS_DIR: target/release/bundle/nsis
        # Same name-collision hazard as the macOS job's upload step: only the
        # stable-named, arch-suffixed copies go up, never the bare
        # `*-setup.exe` tauri-bundler itself produced (which is versioned, so
        # it would not collide today, but IS the same pattern package-updater.sh
        # exists to avoid depending on staying stable across bundler versions).
        run: |
          set -euo pipefail

          # Static paths, not globs — package-updater-windows.sh names every
          # file it produces exactly, so a missing one means that script
          # didn't run or silently skipped (e.g. no TAURI_SIGNING_PRIVATE_KEY),
          # not that a glob matched nothing.
          assets=(
            "${NSIS_DIR}/Meridian-x86_64-setup.exe"
            "${NSIS_DIR}/Meridian-x86_64-setup.exe.sig"
            "${NSIS_DIR}/updater-windows.json"
          )
          for a in "${assets[@]}"; do
            [ -f "$a" ] || { echo "::error::missing expected asset $a — package-updater-windows.sh did not run or did not produce it"; exit 1; }
            echo "  → $(basename "$a")"
          done

          gh release upload "${TAG}" --clobber "${assets[@]}"

  # ── Stage 3: compose the manifest, verify, publish ──────────────────────────
  publish:
    name: Compose manifest + publish
    needs: [prepare, macos, windows]
    # Skipped entirely on a cache_warm_only dispatch — there is no draft
    # release (prepare skipped creating one) and nothing was uploaded (macos/
    # windows skipped their upload steps), so composing/publishing a manifest
    # here would have nothing valid to compose from.
    if: ${{ !inputs.cache_warm_only }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          persist-credentials: false

      - name: Compose latest.json from the uploaded fragments
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
        # WHY THIS IS A SINGLE JOB AND NOT DONE PER-PLATFORM:
        #
        # tauri-action's built-in updater-manifest upload does a READ-MODIFY-
        # WRITE against a shared release asset, once per matrix job, with NO
        # locking (src/upload-version-json.ts: list assets -> download
        # latest.json -> merge -> DELETE -> re-upload). Two jobs finishing in
        # the same window each read the pre-merge manifest and the loser's
        # platform key silently vanishes. For us that reads as "Intel users
        # never got the update". The action's own source concedes the race in a
        # comment. It is the most-reported flake in Tauri release pipelines.
        #
        # Composing once, here, from the fragments each runner uploaded removes
        # the race by construction and gives one place that knows the full key
        # set — which is what makes the completeness assertion below possible.
        run: |
          set -euo pipefail
          mkdir -p frag && cd frag
          for f in updater-aarch64-apple-darwin.json updater-windows.json; do
            gh release download "${TAG}" --pattern "$f" --output "$f" --clobber \
              || echo "::warning::fragment $f absent"
          done
          cd ..
          python3 scripts/compose-updater-manifest.py \
            --version "${VERSION}" --tag "${TAG}" --fragments frag --output latest.json
          cat latest.json

      - name: Verify the release is complete before publishing
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
        # Zed's expected-asset diff. This is what makes `fail-fast: false` safe:
        # without it, a silently-skipped architecture produces a release that
        # looks green and is missing a platform.
        run: |
          set -euo pipefail
          actual="$(gh release view "${TAG}" --json assets --jq '[.assets[].name] | join(" ")')"
          echo "assets: ${actual}"
          missing=""
          for want in .dmg .app.tar.gz .app.tar.gz.sig -setup.exe -setup.exe.sig; do
            case " ${actual} " in *"${want}"*) ;; *) missing="${missing} ${want}";; esac
          done
          if [ -n "${missing}" ]; then
            echo "::error::release ${TAG} is missing:${missing}"
            exit 1
          fi

          # Every REQUIRED platform key must be populated — an empty url/signature
          # is how a partial manifest reaches users looking complete. The
          # `-nsis` alias is deliberately not checked here — see REQUIRED's
          # comment in compose-updater-manifest.py.
          python3 - <<'PY'
          import json, sys
          m = json.load(open("latest.json"))
          need = {"darwin-aarch64", "windows-x86_64"}
          missing = [k for k in need if not m["platforms"].get(k, {}).get("url")]
          if missing:
              sys.exit(f"::error::latest.json missing populated keys: {missing}")
          print("✓ latest.json carries all platform keys")
          PY

      - name: Attach the manifest and publish
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
          CHANNEL: ${{ needs.prepare.outputs.channel }}
        # The manifest goes up LAST and the draft flips only after it lands —
        # uploading latest.json is what actually triggers installed apps to
        # update, so it must never be reachable before the assets it points at.
        # (Ghostty stages its appcast under a different name for the same
        # reason.)
        run: |
          set -euo pipefail
          gh release upload "${TAG}" latest.json --clobber
          gh release edit "${TAG}" --draft=false
          echo "→ published ${TAG} (${CHANNEL})"

      - name: Mirror onto the rolling updater tag
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
          CHANNEL: ${{ needs.prepare.outputs.channel }}
        # Installed apps poll a FIXED endpoint (updater / updater-staging), not
        # the versioned release, so the manifest has to be mirrored there.
        run: bash scripts/mirror-updater-channel.sh "$VERSION" "$CHANNEL"
