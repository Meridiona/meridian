name: Release (prepare)

# DECIDES THE VERSION AND PUSHES THE TAG. BUILDS NOTHING.
#
# This is one half of a two-workflow release. Its entire job is to run
# semantic-release, bump the version manifests, and push a `v*` tag. Pushing
# that tag is what triggers release-build.yml, which does all the compiling,
# signing, notarizing and publishing.
#
# WHY THE SPLIT EXISTS — this is not tidiness, it fixes a real failure we hit.
#
# semantic-release's verifyConditions stage runs `isBranchUpToDate`, comparing
# the checked-out HEAD against origin/<branch>, and refuses to publish if it is
# behind. That check exists because semantic-release is designed to commit and
# push during a release, so it insists on sitting at branch HEAD.
#
# The old single-workflow shape pinned a SHA at plan time (correct — you want
# the tag to name exactly the commit whose binaries you built) and then ran
# semantic-release as a publisher at the END, after ~30 minutes of compiling.
# Any merge to pre-main inside that window put the checkout behind the remote,
# and the publish aborted with:
#
#     The local branch pre-main is behind the remote one, therefore a new
#     version won't be published.
#
# Run 29748827473 did exactly that: both macOS arches built successfully, then
# the whole release was discarded. ~53 macOS-runner-minutes for nothing.
#
# The two requirements are structurally incompatible — an immutable build ref
# and a check that demands branch HEAD cannot both hold across a long build —
# so the fix is architectural, not a flag. Upstream has explicitly declined to
# make isBranchUpToDate configurable (semantic-release#1849), on the reasoning
# that "your builds will catch up next run". That is fine for a 90-second npm
# publish and untenable for a 30-minute signed desktop build.
#
# Worse than the wasted time: semantic-release/discussions/3334 documents
# mis-ordered runs publishing the WRONG VERSION with a success exit code. So
# the old shape was a correctness hazard, not just a slow one.
#
# HOW THE SPLIT REMOVES IT:
#   * The only place branch state matters is THIS workflow, whose window is
#     ~60 seconds instead of ~30 minutes. Losing the race now costs a minute of
#     ubuntu time and is simply re-runnable.
#   * release-build.yml triggers on the TAG — an immutable ref. pre-main can
#     move a hundred times mid-build and nothing notices, because there is no
#     branch-state check left to fail. The tag<->binary correspondence the old
#     pinned-SHA checkout was reaching for now holds BY CONSTRUCTION.
#   * "Which version am I building" has exactly one answer, committed to the
#     repo. No plan job, no second semantic-release run, no assert step.
#
# This is the shape Zed, Ghostty, Cap and clash-verge all use: decide the
# version cheaply (or read it from the repo), then build from an immutable ref.

on:
  # AUTO on every push to pre-main. Every merge to the staging branch runs
  # semantic-release, which cuts a new staging prerelease WHENEVER there are
  # releasable commits (feat/fix/perf/…) since the last staging tag — and does
  # nothing when a merge carries only chore/docs/ci commits. That "does it
  # warrant a release?" decision belongs to semantic-release's commit analysis,
  # not to us. This is the canonical way semantic-release is meant to run: point
  # it at the release branch and let it decide.
  #
  # There is intentionally NO commit-message marker gate. The previous design
  # gated on a `[staging-release]` substring, which backfired: a squash merge
  # folds every PR commit BODY into the merge message, and this repo's own
  # workflow comments quote the literal marker — so merging a PR that merely
  # TOUCHED these files matched the gate and cut an unintended release
  # (v1.72.0-staging.6, deleted). Running unconditionally on push and letting
  # semantic-release judge the commits removes that whole class of accident:
  # there is no fragile string match left to misfire.
  #
  # BOTH CHANNELS. `pre-main` cuts staging prereleases, `main` cuts stable
  # releases — one pipeline, so the two can never drift from each other. The old
  # monolithic release.yml that used to own `main` has been deleted; leaving it
  # in place would double-fire on every push here.
  #
  # Which channel a run is depends only on the branch, and it selects the
  # semantic-release config below. The BUILD does not read this at all — it
  # derives the channel from the tag it is handed, so there is exactly one
  # source of truth for "is this stable or staging".
  push:
    branches: [pre-main, main]
  # Kept for on-demand runs and version previews (dry_run) without a merge.
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Analyse commits and report the next version without tagging"
        type: boolean
        default: false

# Serialise: two prepare runs would race to tag. cancel-in-progress stays false
# because a half-finished semantic-release run can have already pushed a tag.
concurrency:
  group: release-prepare
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    name: Decide version + push tag
    runs-on: ubuntu-latest
    permissions:
      contents: write # pushes the version-bump commit and the tag
    # No `if:` gate. The job runs on every push to pre-main (and on manual
    # dispatch); semantic-release itself decides whether the commits warrant a
    # release. There is deliberately no commit-message substring match — that is
    # what previously cut an accidental release (see `on:` above).
    outputs:
      released: ${{ steps.run.outputs.released }}
      version: ${{ steps.run.outputs.version }}
      tag: ${{ steps.run.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Branch HEAD by name, NOT a pinned SHA — the whole point of this job
          # is to be up to date with the remote so semantic-release is happy.
          # Safe here precisely because nothing is built from this checkout.
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: true # semantic-release pushes the tag
          # *** LOAD-BEARING: persist the PAT, not the default GITHUB_TOKEN. ***
          # checkout stores THIS token as the git credential, and semantic-release
          # reuses it to push the version tag. GitHub deliberately does NOT
          # re-trigger workflows for refs pushed with GITHUB_TOKEN (the recursion
          # guard) — so a tag pushed with the default token lands silently and
          # release-build.yml (its ONLY trigger is `push: tags: v*-staging*`)
          # never fires. That is exactly the "tagged, but nothing built" failure
          # we hit on v1.72.0-staging.6. A push made with the org PAT is
          # attributed to a user, so the tag-push event fires normally and the
          # build runs.
          #
          # Still load-bearing now that release-build.yml also lives on main: the
          # tag push is what carries the version, and a GITHUB_TOKEN push would
          # tag correctly and then silently build nothing.
          token: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - run: npm ci --no-audit --no-fund

      - name: Select the release config for this branch
        # .releaserc.json is the name semantic-release loads by default, and it
        # is the committed PRODUCTION config (changelog + git plugins, so the
        # version bump is committed back to main). On pre-main we copy the
        # staging config over it — ephemeral, this CI checkout only, never
        # committed.
        #
        # The two configs are separate whole files rather than one parameterised
        # file because they differ structurally, not just in values: staging cuts
        # prereleases on the `staging` channel and deliberately has NO
        # @semantic-release/changelog and NO @semantic-release/git (a staging tag
        # must not rewrite the repo). That difference is also why the build's
        # "tag matches the committed version" assertion only applies to stable.
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            echo "→ stable channel (.releaserc.json, as committed)"
          else
            cp .releaserc.staging.json .releaserc.json
            echo "→ staging channel (.releaserc.staging.json)"
          fi

      - name: semantic-release
        id: run
        env:
          # *** GH_TOKEN (a PAT) IS LOAD-BEARING HERE, NOT A FALLBACK NICETY. ***
          #
          # GitHub deliberately does NOT re-trigger workflows for refs pushed
          # using the default GITHUB_TOKEN — it is the recursion guard. This
          # whole two-workflow design hangs on the tag push waking
          # release-build.yml, so a run that tags with GITHUB_TOKEN would
          # succeed, push the tag, and then NOTHING WOULD BUILD. Silent, and
          # confusing to diagnose.
          #
          # secrets.GH_TOKEN is the org PAT already used elsewhere in this repo
          # (it also authenticates the private screenpipe-fork fetch). A push
          # made with it is attributed to a user, so downstream workflows fire
          # normally.
          #
          # If GH_TOKEN is ever unavailable, the fallback still tags correctly
          # but you must dispatch release-build.yml by hand against the tag.
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
        # Detect whether a tag actually appeared rather than parsing
        # semantic-release's prose. Sorted by CREATION DATE, not version:
        # semver sorts prereleases below their release, so a version sort could
        # pick a stale tag and report "no release" on a successful run.
        run: |
          set -euo pipefail
          before="$(git tag --list 'v*' --sort=-creatordate | head -1)"

          if [ "${DRY_RUN}" = "true" ]; then
            npx semantic-release --dry-run
            echo "released=false" >> "$GITHUB_OUTPUT"
            echo "→ dry run; nothing tagged"
            exit 0
          fi

          npx semantic-release

          after="$(git tag --list 'v*' --sort=-creatordate | head -1)"
          if [ -n "${after}" ] && [ "${before}" != "${after}" ]; then
            echo "released=true"      >> "$GITHUB_OUTPUT"
            echo "version=${after#v}" >> "$GITHUB_OUTPUT"
            echo "tag=${after}"       >> "$GITHUB_OUTPUT"
            echo "→ tagged ${after} — release-build.yml will pick it up"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"

            # On pre-main this is routine and fine: a push carrying only
            # chore/docs/ci commits legitimately cuts nothing, and the next
            # feature merge picks everything up.
            #
            # On MAIN it is a FAILURE, and must be loud. The only push to main
            # is the pre-main → main release merge — a deliberate act whose
            # entire purpose is to ship a version. If it produces no tag, the
            # release silently did not happen, and a green check says otherwise.
            #
            # This is not hypothetical. It has now happened twice (#517, #522):
            # both were SQUASH-merged, which collapses every conventional commit
            # into one subject line — `release: …`, not a releasable type — so
            # commit-analyzer found nothing and this step exited 0. Production
            # sat on v1.74.0 while main carried the new code, and nothing in the
            # UI indicated a problem.
            #
            # The cause is the merge method, so that is what the message names.
            if [ "${GITHUB_REF_NAME}" = "main" ]; then
              echo "::error::No releasable commits on main — no version was tagged and NOTHING WILL BUILD."
              {
                echo "### Release prepare FAILED"
                echo ""
                echo "A merge to \`main\` produced no release."
                echo ""
                echo "The usual cause is a **squash merge** of the \`pre-main → main\` PR."
                echo "Squashing collapses every \`feat:\`/\`fix:\` commit into a single"
                echo "subject line, and semantic-release reads subject lines only —"
                echo "so it sees nothing to release."
                echo ""
                echo "Use **Create a merge commit** for release PRs, so the commits"
                echo "arrive on \`main\` intact. Feature PRs into \`pre-main\` should still"
                echo "be squashed."
              } >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi

            echo "→ no releasable commits; nothing tagged"
          fi

      - name: Summary
        if: always()
        run: |
          {
            echo "### Release prepare"
            if [ "${{ steps.run.outputs.released }}" = "true" ]; then
              echo "Tagged \`${{ steps.run.outputs.tag }}\`."
              echo ""
              echo "\`release-build.yml\` builds and publishes it."
            else
              echo "No release cut."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
