name: Release (prepare)

# DECIDES THE VERSION AND PUSHES THE TAG. BUILDS NOTHING.
#
# This is one half of a two-workflow release. Its entire job is to run
# semantic-release, bump the version manifests, push a `v*` tag, and then
# DISPATCH release-build.yml against `main` with that tag as an input.
# release-build does all the compiling, signing, notarizing and publishing.
#
# The dispatch is not decoration: release-build used to fire on the tag PUSH,
# and because GitHub scopes the Actions cache by `github.ref` — and tags may
# only read the DEFAULT BRANCH's cache — every release compiled from scratch.
# Dispatching against main gives the build main's cache scope while it checks
# out the immutable tag. See release-build.yml's `on:` block.
#
# WHY THE SPLIT EXISTS — this is not tidiness, it fixes a real failure we hit.
#
# semantic-release's verifyConditions stage runs `isBranchUpToDate`, comparing
# the checked-out HEAD against origin/<branch>, and refuses to publish if it is
# behind. That check exists because semantic-release is designed to commit and
# push during a release, so it insists on sitting at branch HEAD.
#
# The old single-workflow shape pinned a SHA at plan time (correct — you want
# the tag to name exactly the commit whose binaries you built) and then ran
# semantic-release as a publisher at the END, after ~30 minutes of compiling.
# Any merge to pre-main inside that window put the checkout behind the remote,
# and the publish aborted with:
#
#     The local branch pre-main is behind the remote one, therefore a new
#     version won't be published.
#
# Run 29748827473 did exactly that: both macOS arches built successfully, then
# the whole release was discarded. ~53 macOS-runner-minutes for nothing.
#
# The two requirements are structurally incompatible — an immutable build ref
# and a check that demands branch HEAD cannot both hold across a long build —
# so the fix is architectural, not a flag. Upstream has explicitly declined to
# make isBranchUpToDate configurable (semantic-release#1849), on the reasoning
# that "your builds will catch up next run". That is fine for a 90-second npm
# publish and untenable for a 30-minute signed desktop build.
#
# Worse than the wasted time: semantic-release/discussions/3334 documents
# mis-ordered runs publishing the WRONG VERSION with a success exit code. So
# the old shape was a correctness hazard, not just a slow one.
#
# HOW THE SPLIT REMOVES IT:
#   * The only place branch state matters is THIS workflow, whose window is
#     ~60 seconds instead of ~30 minutes. Losing the race now costs a minute of
#     ubuntu time and is simply re-runnable.
#   * release-build.yml builds the TAG — an immutable ref, handed to it as an
#     input. pre-main can move a hundred times mid-build and nothing notices,
#     because there is no branch-state check left to fail. The tag<->binary
#     correspondence the old pinned-SHA checkout was reaching for now holds BY
#     CONSTRUCTION.
#   * "Which version am I building" has exactly one answer, committed to the
#     repo. No plan job, no second semantic-release run, no assert step.
#
# This is the shape Zed, Ghostty, Cap and clash-verge all use: decide the
# version cheaply (or read it from the repo), then build from an immutable ref.

on:
  # AUTO only on push to main — that push is the deliberate pre-main → main
  # release merge, and its whole purpose is to ship a stable version, so it
  # stays automatic. Stable channel picks up .releaserc.json (committed,
  # changelog + git plugins) below.
  #
  # Staging is intentionally NOT auto-triggered on push to pre-main anymore.
  # It used to fire on every merge to pre-main, cutting a new
  # `vX.Y.Z-staging.N` prerelease per merge whether or not anyone wanted a
  # staging build right then. That churned through macOS-runner minutes and
  # notarization budget on every PR merge. Staging is now cut on demand only,
  # via "Run workflow" (workflow_dispatch) with the branch dropdown set to
  # `pre-main` — pick that branch in the Actions UI and dispatch.
  #
  # There is intentionally NO commit-message marker gate on either trigger.
  # The previous design gated staging auto-release on a `[staging-release]`
  # substring, which backfired: a squash merge folds every PR commit BODY
  # into the merge message, and this repo's own workflow comments quote the
  # literal marker — so merging a PR that merely TOUCHED these files matched
  # the gate and cut an unintended release (v1.72.0-staging.6, deleted).
  #
  # Which channel a run is depends only on the branch it runs against
  # (`GITHUB_REF_NAME`), and that selects the semantic-release config below.
  # The BUILD does not read this at all — it derives the channel from the tag
  # it is handed, so there is exactly one source of truth for "is this stable
  # or staging".
  push:
    branches: [main]
  # Staging releases are manual-only now: pick `pre-main` in the branch
  # dropdown and dispatch. Also used for dry-run version previews on any
  # branch without cutting anything.
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Analyse commits and report the next version without tagging"
        type: boolean
        default: false

# Serialise: two prepare runs would race to tag. cancel-in-progress stays false
# because a half-finished semantic-release run can have already pushed a tag.
concurrency:
  group: release-prepare
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    name: Decide version + push tag
    runs-on: ubuntu-latest
    permissions:
      contents: write # pushes the version-bump commit and the tag
      actions: write # dispatches release-build.yml once the tag exists
    # No `if:` gate. The job runs on every push to main and on manual dispatch
    # (e.g. against pre-main for a staging cut); semantic-release itself
    # decides whether the commits warrant a release. There is deliberately no
    # commit-message substring match — that is what previously cut an
    # accidental release (see `on:` above).
    outputs:
      released: ${{ steps.run.outputs.released }}
      version: ${{ steps.run.outputs.version }}
      tag: ${{ steps.run.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Branch HEAD by name, NOT a pinned SHA — the whole point of this job
          # is to be up to date with the remote so semantic-release is happy.
          # Safe here precisely because nothing is built from this checkout.
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: true # semantic-release pushes the tag
          # *** LOAD-BEARING: persist the PAT, not the default GITHUB_TOKEN. ***
          # checkout stores THIS token as the git credential, and semantic-release
          # reuses it to push the version tag. GitHub deliberately does NOT
          # re-trigger workflows for refs pushed with GITHUB_TOKEN (the recursion
          # guard). The build is no longer triggered by that push — this job
          # dispatches it explicitly below — but the PAT is still load-bearing
          # for the dispatch itself, which is subject to the same guard, and for
          # the version-bump commit on main. The historical failure it prevents
          # (v1.72.0-staging.6: tagged with GITHUB_TOKEN, nothing ever built) is
          # now caught loudly by the dispatch step's warning instead of being
          # silent.
          token: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - run: npm ci --no-audit --no-fund

      - name: Select the release config for this branch
        # .releaserc.json is the name semantic-release loads by default, and it
        # is the committed PRODUCTION config (changelog + git plugins, so the
        # version bump is committed back to main). On pre-main we copy the
        # staging config over it — ephemeral, this CI checkout only, never
        # committed.
        #
        # The two configs are separate whole files rather than one parameterised
        # file because they differ structurally, not just in values: staging cuts
        # prereleases on the `staging` channel and deliberately has NO
        # @semantic-release/changelog and NO @semantic-release/git (a staging tag
        # must not rewrite the repo). That difference is also why the build's
        # "tag matches the committed version" assertion only applies to stable.
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            echo "→ stable channel (.releaserc.json, as committed)"
          else
            cp .releaserc.staging.json .releaserc.json
            echo "→ staging channel (.releaserc.staging.json)"
          fi

      - name: semantic-release
        id: run
        env:
          # *** GH_TOKEN (a PAT) IS LOAD-BEARING HERE, NOT A FALLBACK NICETY. ***
          #
          # GitHub deliberately does NOT re-trigger workflows for refs pushed
          # using the default GITHUB_TOKEN — it is the recursion guard. This
          # whole two-workflow design hangs on the tag push waking
          # release-build.yml, so a run that tags with GITHUB_TOKEN would
          # succeed, push the tag, and then NOTHING WOULD BUILD. Silent, and
          # confusing to diagnose.
          #
          # secrets.GH_TOKEN is the org PAT already used elsewhere in this repo
          # (it also authenticates the private screenpipe-fork fetch). A push
          # made with it is attributed to a user, so downstream workflows fire
          # normally.
          #
          # If GH_TOKEN is ever unavailable, the fallback still tags correctly
          # but you must dispatch release-build.yml by hand against the tag.
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
        # Detect whether a tag actually appeared rather than parsing
        # semantic-release's prose. Sorted by CREATION DATE, not version:
        # semver sorts prereleases below their release, so a version sort could
        # pick a stale tag and report "no release" on a successful run.
        run: |
          set -euo pipefail
          before="$(git tag --list 'v*' --sort=-creatordate | head -1)"

          if [ "${DRY_RUN}" = "true" ]; then
            npx semantic-release --dry-run
            echo "released=false" >> "$GITHUB_OUTPUT"
            echo "→ dry run; nothing tagged"
            exit 0
          fi

          npx semantic-release

          after="$(git tag --list 'v*' --sort=-creatordate | head -1)"
          if [ -n "${after}" ] && [ "${before}" != "${after}" ]; then
            echo "released=true"      >> "$GITHUB_OUTPUT"
            echo "version=${after#v}" >> "$GITHUB_OUTPUT"
            echo "tag=${after}"       >> "$GITHUB_OUTPUT"
            echo "→ tagged ${after} — release-build.yml will pick it up"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"

            # On pre-main this is routine and fine: a push carrying only
            # chore/docs/ci commits legitimately cuts nothing, and the next
            # feature merge picks everything up.
            #
            # On MAIN it is a FAILURE, and must be loud. The only push to main
            # is the pre-main → main release merge — a deliberate act whose
            # entire purpose is to ship a version. If it produces no tag, the
            # release silently did not happen, and a green check says otherwise.
            #
            # This is not hypothetical. It has now happened twice (#517, #522):
            # both were SQUASH-merged, which collapses every conventional commit
            # into one subject line — `release: …`, not a releasable type — so
            # commit-analyzer found nothing and this step exited 0. Production
            # sat on v1.74.0 while main carried the new code, and nothing in the
            # UI indicated a problem.
            #
            # The cause is the merge method, so that is what the message names.
            #
            # ONE EXEMPTION: semantic-release's own version-bump commit. The
            # stable config's @semantic-release/git plugin commits the bump back
            # to main, and that push re-enters this workflow. There is
            # legitimately nothing to release then — `chore(release): …` is not a
            # releasable type, which is exactly what stops the loop — so failing
            # would paint a red X on the tail end of a SUCCESSFUL release.
            #
            # Detected by the subject rather than a marker on purpose. That
            # commit used to carry GitHub's skip-CI marker, which suppressed
            # every workflow for the push — including the TAG push, since the tag
            # points at this very commit. The tag landed and release-build never
            # fired, so v1.74.1 tagged and built nothing. The marker is gone (see
            # .releaserc.json); this check replaces the part of its job that was
            # actually wanted.
            subject="$(git log -1 --format=%s)"
            if [ "${GITHUB_REF_NAME}" = "main" ] && \
               [ "${subject#chore(release): }" != "${subject}" ]; then
              echo "→ semantic-release's own bump commit (${subject}); nothing to release, as expected"
              exit 0
            fi

            if [ "${GITHUB_REF_NAME}" = "main" ]; then
              echo "::error::No releasable commits on main — no version was tagged and NOTHING WILL BUILD."
              {
                echo "### Release prepare FAILED"
                echo ""
                echo "A merge to \`main\` produced no release."
                echo ""
                echo "The usual cause is a **squash merge** of the \`pre-main → main\` PR."
                echo "Squashing collapses every \`feat:\`/\`fix:\` commit into a single"
                echo "subject line, and semantic-release reads subject lines only —"
                echo "so it sees nothing to release."
                echo ""
                echo "Use **Create a merge commit** for release PRs, so the commits"
                echo "arrive on \`main\` intact. Feature PRs into \`pre-main\` should still"
                echo "be squashed."
              } >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi

            echo "→ no releasable commits; nothing tagged"
          fi

      - name: Dispatch the build against main
        if: ${{ steps.run.outputs.released == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.run.outputs.tag }}
        # *** `--ref main` IS THE POINT. IT IS NOT A DEFAULT. ***
        #
        # release-build.yml used to fire on the tag push. That is the obvious
        # shape and it silently cost ~25 minutes a release, because GitHub
        # scopes the Actions cache by `github.ref` and tags can only ever read
        # the DEFAULT BRANCH's cache — never a sibling tag's, never pre-main's.
        # Every release cut a brand-new tag, so every release started cold.
        #
        # Dispatching instead makes `github.ref` the branch chosen here, while
        # `tag` travels as an INPUT that release-build checks out. main's cache
        # scope, the tag's source tree. release-build's `prepare` job hard-fails
        # if this is ever dispatched from anywhere else, so the two halves of
        # that arrangement cannot drift apart.
        #
        # Note the asymmetry: `--ref main` is fixed, but ${TAG} may well point
        # at a `pre-main` commit (that is exactly what a staging cut is). Main's
        # copy of release-build.yml builds pre-main's source — intended, and
        # spelled out in that file's `on:` block.
        #
        # The PAT matters here for the same reason it matters for the tag push
        # above: a workflow dispatched with the default GITHUB_TOKEN is subject
        # to the recursion guard. The fallback is kept so a missing PAT degrades
        # to "tagged, dispatch it by hand" rather than failing the tag itself —
        # the summary below prints that command either way.
        run: |
          set -euo pipefail

          # ── DOES THE TAG PUSH ALREADY BUILD? ASK THE TAG, NOT main. ──────────
          #
          # The only question here is whether pushing ${TAG} a moment ago ALREADY
          # started a build, because then dispatching would start a second one
          # against the same draft release and the loser dies on "already
          # published" after a full macOS + Windows compile.
          #
          # GitHub answers that from the workflow files AT THE PUSHED REF — for a
          # tag, the tag's own tree, which is this checkout. NOT the default
          # branch's copy. So the file to inspect is the local one.
          #
          # An earlier version of this step read main's copy over the API, on the
          # reasoning that `gh workflow run --ref main` executes main's file so
          # main's file must be what matters. That conflates two different
          # questions. It made this step skip the dispatch precisely when the tag
          # had NOT auto-built — this branch is dispatch-only, so its tags start
          # nothing — leaving a tagged release with no build at all: the exact
          # silent failure this pipeline keeps being bitten by.
          #
          # Local file still tag-triggered  -> the push started it; do not double up.
          # Local file dispatch-only        -> nothing started; dispatch (always).
          #
          # Self-deleting: once no release branch carries a `push:` trigger, this
          # never matches again.
          if grep -qE '^\s{2}push:' .github/workflows/release-build.yml; then
            echo "::warning::this branch's release-build.yml is still tag-triggered, so pushing ${TAG} already started the build. Skipping the dispatch to avoid building it twice."
            exit 0
          fi

          if gh workflow run release-build.yml --ref main -f tag="${TAG}"; then
            echo "→ dispatched release-build.yml against main for ${TAG}"
          else
            echo "::warning::could not dispatch release-build.yml; ${TAG} is tagged but NOTHING IS BUILDING. Run: gh workflow run release-build.yml --ref main -f tag=${TAG}"
          fi

      - name: Summary
        if: always()
        # Bound through env, not interpolated into `run:` — same reason as the
        # RAW_TAG/VERSION binding elsewhere: a `run:` step is attacker-reachable
        # via the expression's source, so step outputs go through env rather
        # than straight into the shell script.
        env:
          RELEASED: ${{ steps.run.outputs.released }}
          TAG: ${{ steps.run.outputs.tag }}
        run: |
          {
            echo "### Release prepare"
            if [ "${RELEASED}" = "true" ]; then
              echo "Tagged \`${TAG}\`."
              echo ""
              echo "\`release-build.yml\` was dispatched against \`main\` to build and publish it."
              echo "If that dispatch failed (see the step above), run it by hand -"
              echo "the branch MUST be \`main\` or the build starts from a cold cache:"
              echo ""
              echo "\`\`\`bash"
              echo "gh workflow run release-build.yml --ref main -f tag=${TAG}"
              echo "\`\`\`"
            else
              echo "No release cut."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # ── Back-merge main → pre-main ──────────────────────────────────────────────
  #
  # WHY THIS EXISTS. semantic-release derives the next version from the tags
  # REACHABLE FROM THE BRANCH it runs on. The stable config's
  # @semantic-release/git plugin commits the version bump onto `main`, and the
  # tag points at that commit — so both live only on `main`. Nothing ever
  # carried them back to `pre-main`, and the release flow is one-way
  # (pre-main → main), so `pre-main` could not see them either.
  #
  # The result was silent and cumulative: measured on 2026-07-31, `main` was at
  # v1.82.1 while the newest tag reachable from `pre-main` was
  # v1.78.0-staging.16, and pre-main's own Cargo.toml / tauri.conf.json still
  # read 1.77.0 — five minor versions of drift across twelve unmerged release
  # commits. Staging kept incrementing `-staging.N` on a 1.78.0 base forever.
  #
  # That is not cosmetic. `1.78.0-staging.16` sorts BELOW `1.82.1` under semver,
  # so tauri-plugin-updater will not offer a staging build to anyone already on
  # a current stable install — the staging channel silently stops being
  # installable by exactly the people meant to test it, and they have to fetch
  # the asset by hand.
  #
  # Merging main back makes its tags reachable, so the next staging cut is
  # numbered off the real current version and sorts above it again.
  #
  # A PR, NOT A DIRECT PUSH. pre-main is the staging branch everything is cut
  # from; nothing here bypasses its review gate. This job only ever prepares the
  # merge and opens the PR — a human merges it, exactly like the pre-main → main
  # release PR. The trade-off is that an unmerged back-merge PR leaves staging
  # stuck, which is why the PR body says so in as many words.
  backmerge:
    name: Back-merge main → pre-main
    needs: prepare
    # Stable channel only, and only when a release actually happened. A staging
    # dispatch on pre-main has nothing to merge back, and a no-op run on main
    # (semantic-release's own bump commit re-entering this workflow) must not
    # open an empty PR.
    if: ${{ github.ref_name == 'main' && needs.prepare.outputs.released == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # pushes the back-merge branch
      pull-requests: write # opens the PR
    steps:
      # *** THE PAT IS REQUIRED HERE, NOT A PREFERENCE. ***
      #
      # GitHub does not trigger workflows for refs pushed with the default
      # GITHUB_TOKEN (the recursion guard), and a pull_request opened with it
      # only ever lands in an approval-required state. Either way the
      # back-merge PR arrives with no CI on it — and pre-main's checks are
      # what a human merges it on, so it would sit unmergeable and silent,
      # which is the exact failure mode this job exists to end.
      #
      # So there is deliberately NO `|| secrets.GITHUB_TOKEN` fallback below:
      # a degraded back-merge is worse than a loud one. Fail here, before
      # anything is pushed, with a message that names the missing secret.
      - name: Require the release PAT
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN}" ]; then
            echo "::error::secrets.GH_TOKEN is not available; the back-merge PR would open with no CI on it. Configure the org PAT and re-run."
            exit 1
          fi
          echo "→ GH_TOKEN present"

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
          # Persisted on purpose: `git push` below reuses this credential, so
          # it must be the PAT (see the guard step above), not the default
          # token.
          persist-credentials: true
          token: ${{ secrets.GH_TOKEN }}

      - name: Open the back-merge PR
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          git fetch --quiet origin main pre-main

          # Already contained (e.g. a re-run after the PR was merged): nothing
          # to do, and opening an empty PR would be noise.
          if [ "$(git rev-list --count origin/pre-main..origin/main)" = "0" ]; then
            echo "→ pre-main already contains main; nothing to back-merge"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          branch="chore/backmerge-${TAG}"
          git checkout -B "${branch}" origin/pre-main

          # Conflicts are a human's call — the version manifests are the likely
          # site, and guessing at them would corrupt the very numbers this job
          # exists to keep straight. Fail loudly rather than push something
          # half-resolved.
          if ! git merge --no-edit origin/main; then
            git merge --abort || true
            echo "::error::main → pre-main back-merge conflicts; resolve it by hand"
            {
              echo "### Back-merge needs a human"
              echo ""
              echo "Merging \`main\` (\`${TAG}\`) into \`pre-main\` conflicts."
              echo ""
              echo '```bash'
              echo "git checkout pre-main && git pull"
              echo "git merge main   # resolve, keeping main's version manifests"
              echo '```'
              echo ""
              echo "Until this lands, staging versions keep being cut from a stale"
              echo "base and sort below the current stable release."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          git push --force-with-lease origin "${branch}"

          if gh pr view "${branch}" --json number >/dev/null 2>&1; then
            echo "→ PR already open for ${branch}"
          else
            gh pr create \
              --base pre-main --head "${branch}" \
              --title "chore: back-merge ${TAG} into pre-main" \
              --body "$(printf '%s\n' \
                "Automated back-merge of \`main\` (\`${TAG}\`) into \`pre-main\`." \
                "" \
                "**Merge this.** semantic-release numbers a staging cut from the tags" \
                "reachable from \`pre-main\`. The stable release commit and its tag are" \
                "created on \`main\` and never come back on their own, so until this lands," \
                "staging keeps being cut from a stale base — and a staging version that" \
                "sorts below the current stable release is one the updater will not offer" \
                "to anyone already on stable." \
                "" \
                "Opened automatically by \`release-prepare.yml\`.")"
          fi

          {
            echo "### Back-merge PR"
            echo ""
            echo "Opened \`${branch}\` → \`pre-main\` for \`${TAG}\`."
          } >> "$GITHUB_STEP_SUMMARY"
