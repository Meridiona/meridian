name: Release (prepare)

# DECIDES THE VERSION AND PUSHES THE TAG. BUILDS NOTHING.
#
# This is one half of a two-workflow release. Its entire job is to run
# semantic-release, bump the version manifests, push a `v*` tag, and then
# DISPATCH release-build.yml against `main` with that tag as an input.
# release-build does all the compiling, signing, notarizing and publishing.
#
# The dispatch is not decoration: release-build used to fire on the tag PUSH,
# and because GitHub scopes the Actions cache by `github.ref` — and tags may
# only read the DEFAULT BRANCH's cache — every release compiled from scratch.
# Dispatching against main gives the build main's cache scope while it checks
# out the immutable tag. See release-build.yml's `on:` block.
#
# WHY THE SPLIT EXISTS — this is not tidiness, it fixes a real failure we hit.
#
# semantic-release's verifyConditions stage runs `isBranchUpToDate`, comparing
# the checked-out HEAD against origin/<branch>, and refuses to publish if it is
# behind. That check exists because semantic-release is designed to commit and
# push during a release, so it insists on sitting at branch HEAD.
#
# The old single-workflow shape pinned a SHA at plan time (correct — you want
# the tag to name exactly the commit whose binaries you built) and then ran
# semantic-release as a publisher at the END, after ~30 minutes of compiling.
# Any branch movement inside that window could put the checkout behind the remote,
# and the publish aborted with:
#
#     The local branch is behind the remote one, therefore a new
#     version won't be published.
#
# Run 29748827473 did exactly that: both macOS arches built successfully, then
# the whole release was discarded. ~53 macOS-runner-minutes for nothing.
#
# The two requirements are structurally incompatible — an immutable build ref
# and a check that demands branch HEAD cannot both hold across a long build —
# so the fix is architectural, not a flag. Upstream has explicitly declined to
# make isBranchUpToDate configurable (semantic-release#1849), on the reasoning
# that "your builds will catch up next run". That is fine for a 90-second npm
# publish and untenable for a 30-minute signed desktop build.
#
# Worse than the wasted time: semantic-release/discussions/3334 documents
# mis-ordered runs publishing the WRONG VERSION with a success exit code. So
# the old shape was a correctness hazard, not just a slow one.
#
# HOW THE SPLIT REMOVES IT:
#   * The only place branch state matters is THIS workflow, whose window is
#     ~60 seconds instead of ~30 minutes. Losing the race now costs a minute of
#     ubuntu time and is simply re-runnable.
#   * release-build.yml builds the TAG — an immutable ref, handed to it as an
#     input. main can move a hundred times mid-build and nothing notices,
#     because there is no branch-state check left to fail. The tag<->binary
#     correspondence the old pinned-SHA checkout was reaching for now holds BY
#     CONSTRUCTION.
#   * "Which version am I building" has exactly one answer, committed to the
#     repo. No plan job, no second semantic-release run, no assert step.
#
# This is the shape Zed, Ghostty, Cap and clash-verge all use: decide the
# version cheaply (or read it from the repo), then build from an immutable ref.

on:
  # Promotion is explicit. A branch update is development state; it is not a
  # release event. This is what lets main become the integration trunk later
  # without every merge attempting to publish production.
  workflow_dispatch:
    inputs:
      channel:
        description: "Promotion channel"
        type: choice
        required: true
        default: rc
        options:
          - rc
          - stable
      candidate_tag:
        description: "For stable: exact proven RC tag from the same main commit (for example v1.93.0-rc.2)"
        type: string
        required: false
        default: ""
      dry_run:
        description: "Analyse commits and report the next version without tagging"
        type: boolean
        default: false

# Serialise: two prepare runs would race to tag. cancel-in-progress stays false
# because a half-finished semantic-release run can have already pushed a tag.
concurrency:
  group: release-prepare
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    name: Decide version + push tag
    runs-on: ubuntu-latest
    permissions:
      contents: write # pushes the version-bump commit and the tag
      actions: write # dispatches release-build.yml once the tag exists
    # Promotion is manual-only. RC and stable promotions both originate from main.
    outputs:
      released: ${{ steps.run.outputs.released }}
      version: ${{ steps.run.outputs.version }}
      tag: ${{ steps.run.outputs.tag }}
    steps:
      - name: Validate promotion target
        env:
          CHANNEL: ${{ inputs.channel }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          case "${CHANNEL}" in
            stable|rc) expected="main" ;;
            *) echo "::error::unknown release channel '${CHANNEL}'"; exit 1 ;;
          esac
          if [ "${REF_NAME}" != "${expected}" ]; then
            echo "::error::${CHANNEL} promotion must be dispatched from '${expected}', not '${REF_NAME}'."
            exit 1
          fi
          echo "→ ${CHANNEL} promotion from ${REF_NAME}"

      - uses: actions/checkout@v7
        with:
          # Branch HEAD by name, NOT a pinned SHA — the whole point of this job
          # is to be up to date with the remote so semantic-release is happy.
          # Safe here precisely because nothing is built from this checkout.
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: true # semantic-release pushes the tag
          # *** LOAD-BEARING: persist the PAT, not the default GITHUB_TOKEN. ***
          # checkout stores THIS token as the git credential, and semantic-release
          # reuses it to push the version tag. GitHub deliberately does NOT
          # re-trigger workflows for refs pushed with GITHUB_TOKEN (the recursion
          # guard). The build is no longer triggered by that push — this job
          # dispatches it explicitly below — but the PAT is still load-bearing
          # for the dispatch itself, which is subject to the same guard, and for
          # the version-bump commit on main. The historical failure it prevents
          # (v1.72.0-staging.6: tagged with GITHUB_TOKEN, nothing ever built) is
          # now caught loudly by the dispatch step's warning instead of being
          # silent.
          token: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Require stable promotion to come from a proven RC
        if: ${{ inputs.channel == 'stable' }}
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
          CANDIDATE_TAG: ${{ inputs.candidate_tag }}
        run: |
          set -euo pipefail

          case "${CANDIDATE_TAG}" in
            v*-rc.*) ;;
            *) echo "::error::stable promotion requires candidate_tag=vX.Y.Z-rc.N"; exit 1 ;;
          esac

          git fetch --quiet --tags --force
          candidate_sha="$(git rev-list -n1 "${CANDIDATE_TAG}" 2>/dev/null || true)"
          head_sha="$(git rev-parse HEAD)"
          if [ -z "${candidate_sha}" ]; then
            echo "::error::candidate RC tag ${CANDIDATE_TAG} does not exist"
            exit 1
          fi
          if [ "${candidate_sha}" != "${head_sha}" ]; then
            if ! git merge-base --is-ancestor "${candidate_sha}" "${head_sha}"; then
              echo "::error::main diverged from ${CANDIDATE_TAG}: candidate=${candidate_sha}, main=${head_sha}"
              exit 1
            fi

            mapfile -t changed < <(git diff --name-only "${candidate_sha}..${head_sha}")
            bad=()
            for path in "${changed[@]}"; do
              case "${path}" in
                .github/workflows/release-build.yml|                .github/workflows/release-prepare.yml|                .github/workflows/windows-product-smoke.yml|                .github/workflows/macos-product-smoke.yml|                scripts/ci/windows-install-smoke.ps1 )
                  ;;
                *)
                  bad+=("${path}")
                  ;;
              esac
            done

            if [ "${#bad[@]}" -ne 0 ]; then
              printf '::error::main contains product/source changes after %s:\n' "${CANDIDATE_TAG}"
              printf '  %s\n' "${bad[@]}"
              echo "::error::Cut and smoke a new RC before stable promotion."
              exit 1
            fi
            printf '→ allowing release-control-plane-only drift after %s:\n' "${CANDIDATE_TAG}"
            printf '  %s\n' "${changed[@]}"
          fi

          meta="$(gh release view "${CANDIDATE_TAG}" --json isDraft,isPrerelease,assets)"
          if [ "$(jq -r '.isDraft' <<<"${meta}")" != "false" ] || \
             [ "$(jq -r '.isPrerelease' <<<"${meta}")" != "true" ]; then
            echo "::error::${CANDIDATE_TAG} must be a published prerelease"
            exit 1
          fi

          assets="$(jq -r '[.assets[].name] | join(" ")' <<<"${meta}")"
          for proof in smoke-windows.ok smoke-macos.ok; do
            case " ${assets} " in
              *" ${proof} "*) echo "✓ ${CANDIDATE_TAG} carries ${proof}" ;;
              *) echo "::error::${CANDIDATE_TAG} is missing ${proof}; stable promotion refused"; exit 1 ;;
            esac
          done

          echo "→ stable promotion pinned to proven RC ${CANDIDATE_TAG} at ${head_sha}"

      - uses: actions/setup-node@v7
        if: ${{ inputs.channel == 'rc' }}
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - run: npm ci --no-audit --no-fund
        if: ${{ inputs.channel == 'rc' }}

      - name: Select release strategy
        run: |
          set -euo pipefail
          if [ "${{ inputs.channel }}" = "stable" ]; then
            echo "→ stable: promote the exact proven RC artifacts; no compile/sign/notarize"
          else
            echo "→ RC: semantic-release analyzes the next stable version; this workflow creates vX.Y.Z-rc.N itself"
          fi

      - name: Decide version and create release tag
        id: run
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
          CHANNEL: ${{ inputs.channel }}
          CANDIDATE_TAG: ${{ inputs.candidate_tag }}
        run: |
          set -euo pipefail

          if [ "${CHANNEL}" = "rc" ]; then
            # Analyze main with the stable config, but do not let semantic-release
            # create a release. This keeps one real release branch while RC tags
            # remain an explicit workflow concern.
            set +e
            analysis="$(NO_COLOR=1 npx semantic-release --dry-run 2>&1)"
            rc=$?
            set -e
            printf '%s\n' "${analysis}"

            if [ "${rc}" -ne 0 ]; then
              echo "::error::semantic-release version analysis failed"
              exit "${rc}"
            fi

            base="$(printf '%s\n' "${analysis}" | sed -nE 's/.*The next release version is ([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' | tail -1)"
            if [ -z "${base}" ]; then
              echo "released=false" >> "${GITHUB_OUTPUT}"
              echo "→ no releasable commits; no RC needed"
              exit 0
            fi

            last_n="$(git tag --list "v${base}-rc.*" | sed -nE 's/.*-rc\.([0-9]+)$/\1/p' | sort -n | tail -1)"
            n=$(( ${last_n:-0} + 1 ))
            tag="v${base}-rc.${n}"

            echo "version=${base}-rc.${n}" >> "${GITHUB_OUTPUT}"
            echo "tag=${tag}" >> "${GITHUB_OUTPUT}"

            if [ "${DRY_RUN}" = "true" ]; then
              echo "released=false" >> "${GITHUB_OUTPUT}"
              echo "→ dry run; would create ${tag}"
              exit 0
            fi

            git tag "${tag}" HEAD
            git push origin "refs/tags/${tag}"
            gh release create "${tag}" --repo "${GITHUB_REPOSITORY}" --target "$(git rev-parse HEAD)" --draft --prerelease --generate-notes --title "${tag}"

            echo "released=true" >> "${GITHUB_OUTPUT}"
            echo "→ created RC ${tag} from $(git rev-parse HEAD)"
            exit 0
          fi

          # Stable promotion is metadata-only. RC artifacts are built with the
          # final X.Y.Z app version and are channel-neutral, so recompiling here
          # would only produce a second set of bytes that the RC never proved.
          stable_tag="${CANDIDATE_TAG%%-rc.*}"
          version="${stable_tag#v}"
          candidate_sha="$(git rev-list -n1 "${CANDIDATE_TAG}")"

          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "tag=${stable_tag}" >> "${GITHUB_OUTPUT}"

          if [ "${DRY_RUN}" = "true" ]; then
            echo "released=false" >> "${GITHUB_OUTPUT}"
            echo "→ dry run; would promote ${CANDIDATE_TAG} byte-for-byte to ${stable_tag}"
            exit 0
          fi

          if git rev-parse -q --verify "refs/tags/${stable_tag}" >/dev/null; then
            echo "::error::stable tag ${stable_tag} already exists"
            exit 1
          fi

          git tag "${stable_tag}" "${candidate_sha}"
          git push origin "refs/tags/${stable_tag}"
          gh release create "${stable_tag}" --repo "${GITHUB_REPOSITORY}" \
            --target "${candidate_sha}" --draft --generate-notes --title "${stable_tag}"

          tmp="$(mktemp -d)"
          gh release download "${CANDIDATE_TAG}" --repo "${GITHUB_REPOSITORY}" --dir "${tmp}"

          # Reuse every signed/notarized binary and smoke proof. Only updater
          # metadata changes because its URLs name the public stable tag.
          for manifest in latest.json updater-aarch64-apple-darwin.json updater-windows.json; do
            if [ -f "${tmp}/${manifest}" ]; then
              python3 -c 'import json,sys; p,o,n,v=sys.argv[1:]; d=json.load(open(p)); rw=lambda x: x.replace("/download/"+o+"/","/download/"+n+"/") if isinstance(x,str) else [rw(y) for y in x] if isinstance(x,list) else {k:rw(y) for k,y in x.items()} if isinstance(x,dict) else x; d=rw(d); d["version"]=v if isinstance(d,dict) and "version" in d else d.get("version") if isinstance(d,dict) else v; open(p,"w").write(json.dumps(d,indent=2)+"\\n")' "${tmp}/${manifest}" "${CANDIDATE_TAG}" "${stable_tag}" "${version}"
            fi
          done

          gh release upload "${stable_tag}" --repo "${GITHUB_REPOSITORY}" --clobber "${tmp}"/*
          gh release edit "${stable_tag}" --repo "${GITHUB_REPOSITORY}" --draft=false --prerelease=false

          echo "released=true" >> "${GITHUB_OUTPUT}"
          echo "→ promoted proven ${CANDIDATE_TAG} artifacts to stable ${stable_tag}"
          exit 0

      - name: Dispatch the build against main
        if: ${{ steps.run.outputs.released == 'true' && inputs.channel == 'rc' }}
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.run.outputs.tag }}
        # *** `--ref main` IS THE POINT. IT IS NOT A DEFAULT. ***
        #
        # release-build.yml used to fire on the tag push. That is the obvious
        # shape and it silently cost ~25 minutes a release, because GitHub
        # scopes the Actions cache by `github.ref` and tags can only ever read
        # the DEFAULT BRANCH's cache — never a sibling tag's.
        # Every release cut a brand-new tag, so every release started cold.
        #
        # Dispatching instead makes `github.ref` the branch chosen here, while
        # `tag` travels as an INPUT that release-build checks out. main's cache
        # scope, the tag's source tree. release-build's `prepare` job hard-fails
        # if this is ever dispatched from anywhere else, so the two halves of
        # that arrangement cannot drift apart. RC and stable tags both point
        # into main history.
        #
        # The PAT matters here for the same reason it matters for the tag push
        # above: a workflow dispatched with the default GITHUB_TOKEN is subject
        # to the recursion guard. The fallback is kept so a missing PAT degrades
        # to "tagged, dispatch it by hand" rather than failing the tag itself —
        # the summary below prints that command either way.
        run: |
          set -euo pipefail

          # ── DOES THE TAG PUSH ALREADY BUILD? ASK THE TAG, NOT main. ──────────
          #
          # The only question here is whether pushing ${TAG} a moment ago ALREADY
          # started a build, because then dispatching would start a second one
          # against the same draft release and the loser dies on "already
          # published" after a full macOS + Windows compile.
          #
          # GitHub answers that from the workflow files AT THE PUSHED REF — for a
          # tag, the tag's own tree, which is this checkout. NOT the default
          # branch's copy. So the file to inspect is the local one.
          #
          # An earlier version of this step read main's copy over the API, on the
          # reasoning that `gh workflow run --ref main` executes main's file so
          # main's file must be what matters. That conflates two different
          # questions. It made this step skip the dispatch precisely when the tag
          # had NOT auto-built — this branch is dispatch-only, so its tags start
          # nothing — leaving a tagged release with no build at all: the exact
          # silent failure this pipeline keeps being bitten by.
          #
          # Local file still tag-triggered  -> the push started it; do not double up.
          # Local file dispatch-only        -> nothing started; dispatch (always).
          #
          # Self-deleting: once no release branch carries a `push:` trigger, this
          # never matches again.
          if grep -qE '^\s{2}push:' .github/workflows/release-build.yml; then
            echo "::warning::this branch's release-build.yml is still tag-triggered, so pushing ${TAG} already started the build. Skipping the dispatch to avoid building it twice."
            exit 0
          fi

          if gh workflow run release-build.yml --ref main -f tag="${TAG}"; then
            echo "→ dispatched release-build.yml against main for ${TAG}"
          else
            echo "::warning::could not dispatch release-build.yml; ${TAG} is tagged but NOTHING IS BUILDING. Run: gh workflow run release-build.yml --ref main -f tag=${TAG}"
          fi

      - name: Summary
        if: always()
        # Bound through env, not interpolated into `run:` — same reason as the
        # RAW_TAG/VERSION binding elsewhere: a `run:` step is attacker-reachable
        # via the expression's source, so step outputs go through env rather
        # than straight into the shell script.
        env:
          RELEASED: ${{ steps.run.outputs.released }}
          TAG: ${{ steps.run.outputs.tag }}
        run: |
          {
            echo "### Release prepare"
            if [ "${RELEASED}" = "true" ]; then
              echo "Tagged \`${TAG}\`."
              echo ""
              echo "\`release-build.yml\` was dispatched against \`main\` to build and publish it."
              echo "If that dispatch failed (see the step above), run it by hand -"
              echo "the branch MUST be \`main\` or the build starts from a cold cache:"
              echo ""
              echo "\`\`\`bash"
              echo "gh workflow run release-build.yml --ref main -f tag=${TAG}"
              echo "\`\`\`"
            else
              echo "No release cut."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
