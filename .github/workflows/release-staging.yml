name: Release (staging)

# Staging-channel releases via semantic-release, on the `pre-main` branch.
# Each run cuts a PRERELEASE version (X.Y.Z-staging.N, computed from main's
# reachable v* tags) that builds the SAME signed universal (arm64 + x86_64)
# DMG + updater artifacts as the production flow, but:
#   • bakes the STAGING updater endpoint (…/releases/download/updater-staging/
#     latest.json) into the .app at build time via a --config overlay — never
#     committed, so it cannot leak to `main`;
#   • publishes to GitHub only, with NO version-bump commit back to pre-main;
#   • mirrors latest.json onto the rolling `updater-staging` prerelease so an
#     installed staging app self-updates staging→staging.
#
# Differs from release.yml (production/main) only in: it targets pre-main, cuts a
# prerelease, swaps in .releaserc.staging.json, and publishes to GitHub only.
# Same macos-26 runner because the prepare step builds the Swift Foundation
# Models bridge + the Rust daemon + the dashboard, exactly like main.
#
# TRIGGERING — a full macOS build is ~45 min, and `pre-main` is a busy
# integration branch, so this does NOT build on every push. It builds only when:
#   • a push to pre-main whose head-commit message contains the marker
#     `[staging-release]` (the controlled test loop — e.g.
#     `git commit --allow-empty -m "chore(release): staging [staging-release]" && git push`), OR
#   • a manual `workflow_dispatch` (available in the Actions tab / `gh workflow
#     run release-staging.yml --ref pre-main` after the first push-triggered run
#     has registered the workflow).
# We deliberately do NOT keep this workflow on `main` — semantic-release reads
# the channel from GITHUB_REF, so the run must carry ref=pre-main (else it would
# treat the build as `main` and try to cut a STABLE release from pre-main code).

on:
  push:
    branches: [pre-main]
  workflow_dispatch: {}

permissions:
  contents: write       # tags, the GitHub prerelease(s), the rolling updater-staging release

concurrency:
  group: release-staging
  cancel-in-progress: false

jobs:
  release:
    # Build only on a manual dispatch or a marker commit — never on ordinary
    # pre-main integration pushes (fold merges, feature merges).
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[staging-release]') }}
    runs-on: macos-26
    outputs:
      released: ${{ steps.release.outputs.released }}
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
    env:
      SQLX_OFFLINE: "true"
      # The tray pulls screenpipe-screen/-a11y from the PRIVATE Meridiona/
      # screenpipe-fork (a git dep). Force cargo to fetch via the git CLI so it
      # honors the credential the "Authenticate ... screenpipe-fork" step installs
      # — libgit2 would not pick up the url.insteadOf rewrite.
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
      # Baked into the staging binary at compile time (see release.yml); same
      # secret. Absent → Jira OAuth simply unavailable in the staging build.
      MERIDIAN_JIRA_OAUTH_CLIENT_SECRET: ${{ secrets.JIRA_OAUTH_CLIENT_SECRET }}
      # Public GitHub OAuth device-flow client id (see release.yml); GH_OAUTH_CLIENT_ID
      # repo secret. Absent → GitHub browser connect unavailable in the staging build.
      MERIDIAN_GITHUB_OAUTH_CLIENT_ID: ${{ secrets.GH_OAUTH_CLIENT_ID }}
      # Baked into the staging binary at compile time (see release.yml); same
      # secret. Absent → PostHog analytics simply disabled in the staging build.
      MERIDIAN_POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
      # Baked into the staging binary at compile time (see release.yml); same
      # secret — staging is downloadable/installable too, so it gets Clerk
      # PRODUCTION, not the dev instance (only a source checkout uses dev).
      # Absent → sign-in unavailable in the staging build.
      MERIDIAN_CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY_PROD }}
      # Minisign key for the DMG auto-updater: `tauri build` (createUpdaterArtifacts)
      # signs Meridian.app.tar.gz so the installed staging app can verify the
      # update against the pubkey baked in tauri.conf.json. REQUIRED here (unlike
      # the legacy staging flow) — without it package-updater.sh emits no
      # latest.json and the mirror no-ops, so the staging channel can't update.
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      # Apple Developer ID signing + notarization — identical to release.yml (see
      # the long note there). Staging signs with the SAME Developer ID cert on
      # purpose: staging is where we prove the signed/notarized DMG works end to
      # end (Gatekeeper-clean install, TCC grants surviving an auto-update) before
      # the same machinery ships to production.
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      # Tauri's DMG bundler skips the AppleScript step that sets the Finder
      # window background/icon layout whenever `CI` is set (every GitHub
      # Actions job sets `CI=true`), assuming CI runners can't drive Finder —
      # https://github.com/tauri-apps/tauri/issues/1731. GitHub-hosted macOS
      # runners DO have a full desktop session, so force the decoration step
      # to run; without this the DMG ships the drag-to-Applications
      # background.png as an inert file with no .DS_Store, so Finder never
      # displays it.
      TAURI_BUNDLER_DMG_IGNORE_CI: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pre-main           # release the pre-main tip — NOT the default branch
          fetch-depth: 0          # full history — semantic-release needs commits
          fetch-tags: true        # see main's v* tags (reachable: pre-main is off main)
          persist-credentials: false

      - name: Install Rust 1.93.1
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.93.1"
          targets: "aarch64-apple-darwin,x86_64-apple-darwin"
      - uses: Swatinem/rust-cache@v2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            ui/package-lock.json
            tray/package-lock.json

      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: ui/.next/cache
          key: nextjs-${{ hashFiles('ui/package-lock.json') }}-${{ hashFiles('ui/**/*.ts', 'ui/**/*.tsx') }}
          restore-keys: |
            nextjs-${{ hashFiles('ui/package-lock.json') }}-
            nextjs-

      - name: Install release tooling
        run: npm ci --no-audit --no-fund

      - name: Authenticate git for the private screenpipe-fork dependency
        # The tray's capture stack (screenpipe-screen/-a11y) is a git dep on the
        # PRIVATE Meridiona/screenpipe-fork. checkout uses persist-credentials:
        # false and the default GITHUB_TOKEN is scoped to this repo only, so
        # cargo's `git fetch` of the fork 403s. Rewrite just that URL to embed a
        # PAT with read access. REQUIRES the GH_TOKEN secret to be able to read
        # Meridiona/screenpipe-fork (org-member classic PAT with `repo`, or a
        # fine-grained PAT granting both meridian AND screenpipe-fork).
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          git config --global \
            url."https://x-access-token:${GH_TOKEN}@github.com/Meridiona/screenpipe-fork".insteadOf \
            "https://github.com/Meridiona/screenpipe-fork"

      - name: Use staging release config
        # Ephemeral in CI — .releaserc.json is not in any git-asset list, so this
        # is never committed. Keeps the staging config out of main's tree.
        run: cp .releaserc.staging.json .releaserc.json

      - name: Import Developer ID certificate + notarization key
        # Shared composite action (deduped from release.yml) - see the action's
        # own comments for the set-key-partition-list / APPLE_API_KEY_PATH
        # gotchas. Also no-ops gracefully when APPLE_CERTIFICATE is unset.
        uses: ./.github/actions/import-apple-cert
        with:
          apple-certificate: ${{ secrets.APPLE_CERTIFICATE }}
          apple-certificate-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          apple-api-key-content: ${{ secrets.APPLE_API_KEY_CONTENT }}

      - name: semantic-release (staging channel)
        id: release
        env:
          # PAT to create the tag/prerelease past branch protection; falls back
          # to GITHUB_TOKEN. No npm token — the staging channel is GitHub-only.
          # Also authenticates the `gh` calls in mirror-staging-release.sh.
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
          # Bake the build channel into the binary (commands::version::build_channel,
          # same option_env! pattern) so the dashboard/popover version badge reads
          # "staging" instead of the "prod" default. Production leaves this unset.
          MERIDIAN_CHANNEL: "staging"
        # Detect whether a staging prerelease was actually cut by watching the
        # newest v*-staging* tag move — sorted by creation date, not version,
        # so semver's "prerelease sorts below release" quirk can't pick a stale
        # tag. The Windows job below only runs when one was created.
        run: |
          before="$(git tag --list 'v*-staging*' --sort=-creatordate | head -1)"
          npx semantic-release
          after="$(git tag --list 'v*-staging*' --sort=-creatordate | head -1)"
          if [ -n "${after}" ] && [ "${before}" != "${after}" ]; then
            echo "released=true"      >> "$GITHUB_OUTPUT"
            echo "version=${after#v}" >> "$GITHUB_OUTPUT"
            echo "tag=${after}"       >> "$GITHUB_OUTPUT"
            echo "→ staging released ${after}"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
            echo "→ no staging release this run"
          fi

      - name: Clean up signing material
        # Runs even on failure — never leave the cert/key on a runner.
        if: always()
        run: |
          security delete-keychain "${RUNNER_TEMP}/meridian-signing.keychain-db" 2>/dev/null || true
          rm -f "${RUNNER_TEMP}/apple-api-key.p8" "${RUNNER_TEMP}/certificate.p12"

  # ── Windows: build + attach to the staging release, exactly like the DMG ────
  #
  # Mirrors release.yml's windows-release job, adapted for the staging channel:
  # it builds with tauri.staging.conf.json (which points the updater at the
  # rolling updater-staging endpoint), attaches Meridian-setup.exe to the
  # versioned prerelease the macOS job just cut, and merges a windows-x86_64
  # key into the latest.json that mirror-staging-release.sh published to the
  # rolling updater-staging tag — the manifest installed staging apps poll.
  #
  # A separate job, and NOT part of semantic-release's asset list, for the same
  # reason as production: that list ships the DMG, and reaching into it from
  # Windows work risks the macOS staging path.
  windows-release:
    needs: release
    if: needs.release.outputs.released == 'true'
    runs-on: windows-latest
    env:
      SQLX_OFFLINE: "true"
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
      MERIDIAN_JIRA_OAUTH_CLIENT_SECRET: ${{ secrets.JIRA_OAUTH_CLIENT_SECRET }}
      MERIDIAN_GITHUB_OAUTH_CLIENT_ID: ${{ secrets.GH_OAUTH_CLIENT_ID }}
      MERIDIAN_POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
      MERIDIAN_CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY_PROD }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      # Same as the macOS staging job — the badge reads "staging".
      MERIDIAN_CHANNEL: "staging"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.tag }}
          persist-credentials: false

      - name: Authenticate git for the private screenpipe-fork dependency
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          git config --global \
            url."https://x-access-token:${GH_TOKEN}@github.com/Meridiona/screenpipe-fork".insteadOf \
            "https://github.com/Meridiona/screenpipe-fork"

      - name: Install Rust 1.93.1
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.93.1"

      - uses: Swatinem/rust-cache@v2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: |
            ui/package-lock.json
            tray/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: ui/.next/cache
          key: nextjs-win-${{ hashFiles('ui/package-lock.json') }}-${{ hashFiles('ui/**/*.ts', 'ui/**/*.tsx') }}
          restore-keys: |
            nextjs-win-${{ hashFiles('ui/package-lock.json') }}-
            nextjs-win-

      - name: Install JS dependencies
        shell: bash
        run: |
          (cd ui && npm ci --no-audit --no-fund)
          (cd tray && npm ci --no-audit --no-fund)

      - name: Build the daemon + tray (NSIS, staging)
        shell: bash
        # build:windows:staging passes --config tauri.staging.conf.json, so the
        # installer bakes the updater-staging endpoint. tauri.windows.conf.json
        # still auto-merges (NSIS target + meridian.exe resource).
        run: cd tray && npm run build:windows:staging

      - name: Attach the installer and merge the staging updater manifest
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.release.outputs.version }}
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          set -euo pipefail
          NSIS_DIR="target/release/bundle/nsis"
          setup="$(ls "${NSIS_DIR}"/*-setup.exe 2>/dev/null | head -1)"
          [ -n "${setup}" ] || { echo "::error::no NSIS installer in ${NSIS_DIR}"; exit 1; }
          sig="${setup}.sig"
          [ -f "${sig}" ] || { echo "::error::missing updater signature ${sig}"; exit 1; }

          # 1. The versioned installer, on the immutable v<version> prerelease —
          #    this is what the updater manifest's `url` points at, matching how
          #    the macOS tarball lives on the versioned release.
          cp "${setup}" "${NSIS_DIR}/Meridian-setup.exe"
          gh release upload "${TAG}" "${NSIS_DIR}/Meridian-setup.exe" --clobber

          # 2. A stable-named copy on the rolling updater-staging tag, for a
          #    fixed staging-tester download link — the DMG's convenience-copy
          #    equivalent (mirror-staging-release.sh does the same for the DMG).
          gh release upload updater-staging "${NSIS_DIR}/Meridian-setup.exe" --clobber

          # 3. Merge windows-x86_64 into the latest.json on updater-staging (the
          #    manifest installed staging apps poll). The merge refuses to write
          #    unless both darwin-* keys survive intact.
          gh release download updater-staging --pattern latest.json --output latest.json --clobber
          python3 scripts/merge-windows-updater.py \
            latest.json "${VERSION}" \
            "https://github.com/Meridiona/meridian/releases/download/${TAG}/Meridian-setup.exe" \
            "${sig}"
          gh release upload updater-staging latest.json --clobber
          echo "✓ staging Windows installer attached; updater-staging/latest.json updated"
