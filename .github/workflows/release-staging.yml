name: Release (staging)

# Cuts the staging release's wall-clock time by building the two macOS
# architectures CONCURRENTLY instead of one after the other.
#
# WHY: this workflow used to spend ~39 of its ~43 minutes compiling the workspace
# four times, strictly sequentially — daemon×2 arches, then tray×2 arches inside
# a single `tauri build --target universal-apple-darwin`. On run 29698684026:
#
#     daemon aarch64  6.9m   |  tray, both slices  26.3m
#     daemon x86_64   5.5m   |  everything else     ~4m
#
# The two architectures share no compiled artifacts (each target needs its own
# rlibs), so the only thing making them sequential was that they ran on one
# runner. Splitting them across two runners took a full build from ~43m to ~29m
# (measured on run 29723988701, before the publish arm was wired on).
#
# HOW: `tauri build --no-bundle` compiles without packaging, and `tauri bundle`
# packages WITHOUT re-invoking cargo. That seam is what makes the split possible.
# Verified locally before this file was written:
#
#   * `tauri bundle` runs zero cargo invocations and completes in ~1.4s
#   * `tauri bundle --target universal-apple-darwin` REQUIRES a pre-lipo'd binary
#     at target/universal-apple-darwin/release/meridian-tray — it does NOT lipo
#     for you (it fails with a bare `No such file or directory` if absent)
#   * the daemon is read from target/release/meridian at BUNDLE time, not compile
#     time, so only the join job needs the universal daemon
#   * TAURI_SIGNING_PRIVATE_KEY is consumed at BUNDLE time, so the signing
#     secrets never need to reach the build jobs
#
# SCOPE — this is THE staging release path. It cuts the versioned prerelease,
# attaches the DMG + updater artifacts, mirrors latest.json onto the rolling
# `updater-staging` tag, and builds/attaches the Windows installer. Nothing here
# ever runs on its own: see TRIGGERING below.
#
# HOW PUBLISHING SPLITS FROM BUILDING — this workflow used to hand the whole job
# to semantic-release, whose `prepareCmd` compiles. That is exactly what cannot be
# parallelised, so the phases are pulled apart:
#
#   plan     semantic-release --dry-run decides the version (no tag, no release)
#   build    both arches compile that version, concurrently, on two runners
#   release  lipo → sign → bundle → notarize → package → THEN semantic-release
#            runs as a PUBLISHER ONLY (.releaserc.staging.json, whose
#            exec plugin carries publishCmd but no prepareCmd — everything
#            prepareCmd would have done is already on disk as explicit steps)
#
# The version is therefore computed TWICE, once per semantic-release invocation.
# Those two must agree or the binaries carry a version the release does not: see
# the "Assert the version has not moved" step, which fails the run rather than
# publish mis-stamped artifacts.

# TRIGGERING - a `workflow_dispatch`-only workflow is NOT dispatchable unless the
# file also exists on the DEFAULT branch, and this one deliberately lives only on
# `pre-main` — semantic-release reads the channel from GITHUB_REF, so a run must
# carry ref=pre-main or it would treat the build as `main` and try to cut a STABLE
# release from pre-main code. The `push` trigger below is what REGISTERS the
# workflow with the Actions API so `gh workflow run --ref pre-main` resolves at
# all - the same reason release.yml carries one.
#
# It must never actually build on an ordinary pre-main push, so every job is gated
# on a manual dispatch or an explicit `[staging-release]` marker commit. An
# unmarked push creates a run whose jobs all skip, which is enough to register it.

on:
  push:
    branches: [pre-main]
  workflow_dispatch: {}

# Least privilege by default: `plan` only reads history, and `build` only
# compiles and uploads artifacts. Write is granted per-job to the two that
# actually tag and publish.
permissions:
  contents: read

concurrency:
  # Serialise staging releases: two in flight would fight over the same tags,
  # caches and notarization throughput.
  group: release-staging
  cancel-in-progress: false

env:
  SQLX_OFFLINE: "true"
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  # ── Stage 1: decide the version, once, for everybody ────────────────────────
  #
  # The version has to exist BEFORE any compiling starts, because set-version.sh
  # bakes it into Cargo.toml (→ the daemon binary) and tauri.conf.json (→ the
  # value tauri-plugin-updater compares against latest.json). Both build jobs and
  # the release job must therefore agree on one value.
  #
  # This also pins the SHA. The workflow targets `pre-main`, a busy integration
  # branch — if each job checked out `pre-main` by name they could resolve to
  # DIFFERENT commits as pushes land mid-run, and the two arch binaries would
  # silently disagree with each other and with the bundle.
  plan:
    name: Plan (version + SHA)
    # The gate for the whole workflow: `build` and `release` both chain off this
    # job, so skipping it skips them. Ordinary pre-main pushes register the
    # workflow and do nothing else.
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[staging-release]') }}
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      version: ${{ steps.version.outputs.version }}
      release_due: ${{ steps.version.outputs.release_due }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pre-main
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - id: resolve
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - run: npm ci --no-audit --no-fund

      - name: Use the parallel staging release config
        # Ephemeral in CI — .releaserc.json is in no git-asset list, so this is
        # never committed. Analysis-only here, but it must be the SAME config the
        # release job publishes with, or the two version computations could
        # diverge on branch/prerelease rules alone.
        run: cp .releaserc.staging.json .releaserc.json

      - name: Compute the next staging version
        id: version
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
        # `--dry-run` runs analysis only: no tag, no release, no prepareCmd. We
        # parse the version it reports so the build jobs can stamp it. If nothing
        # is releasable, downstream jobs skip rather than build an untagged
        # artifact nobody asked for.
        run: |
          set -o pipefail
          npx semantic-release --dry-run 2>&1 | tee sr.log || true
          version="$(grep -oE 'The next release version is [0-9][^ ]*' sr.log | tail -1 | awk '{print $NF}')"
          if [ -z "${version}" ]; then
            echo "release_due=false" >> "$GITHUB_OUTPUT"
            echo "→ nothing to release; downstream jobs will skip"
          else
            echo "release_due=true"        >> "$GITHUB_OUTPUT"
            echo "version=${version}"      >> "$GITHUB_OUTPUT"
            echo "→ next staging version: ${version}"
          fi

  # ── Stage 2: the point of the exercise — both arches at once ────────────────
  build:
    name: Build ${{ matrix.target }}
    needs: plan
    if: needs.plan.outputs.release_due == 'true'
    runs-on: macos-26
    strategy:
      # fail-fast off: if one arch breaks we still want the other's timing, which
      # is the whole reason this workflow exists.
      fail-fast: false
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    env:
      # EVERY value below is baked into the binary at COMPILE time, so each build
      # job needs the full set — a missing one produces no error, just a staging
      # app with (say) sign-in quietly unavailable. Kept byte-identical to
      # release.yml; see that file for what each one does.
      MERIDIAN_JIRA_OAUTH_CLIENT_SECRET: ${{ secrets.JIRA_OAUTH_CLIENT_SECRET }}
      MERIDIAN_GITHUB_OAUTH_CLIENT_ID: ${{ secrets.GH_OAUTH_CLIENT_ID }}
      MERIDIAN_POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
      MERIDIAN_CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY_PROD }}
      MERIDIAN_CHANNEL: "staging"
      # From tray/package.json's `build:staging` script, which this job replaces.
      MERIDIAN_RUNTIME_MANIFEST_URL: https://github.com/Meridiona/meridian/releases/download/runtime-staging/runtime-manifest.json
      MERIDIAN_HF_ENDPOINT: https://hf.meridiona.com
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false

      - name: Install Rust 1.93.1
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.93.1"
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          # `key` is REQUIRED here: every leg of a matrix shares one github.job,
          # so without it both arches would compute the same cache key and
          # clobber each other's target/ on save.
          key: ${{ matrix.target }}
          # SAVE, on pre-main only. Restore-only was the original call, to stay
          # under the repo's 10GB cache quota (see #488) — but restore-only
          # against a key NOTHING writes is a permanent miss, not a saving. Every
          # staging build logged "No cache found." and recompiled the workspace
          # cold: 19m19s for the arm64 tray on run 29734394528.
          #
          # The quota objection is also stale. Retiring the sequential staging
          # build (#494) orphaned its two 2.4GB `rust-macos-universal` caches, one
          # per branch — roughly exactly the room the two per-arch caches need.
          #
          # Scoped to pre-main so a feature branch cannot evict the release
          # cache: GitHub isolates caches per branch on READ but not on write
          # eviction, and only pre-main ever cuts a staging release.
          save-if: ${{ github.ref == 'refs/heads/pre-main' }}

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: |
            ui/package-lock.json
            tray/package-lock.json

      - name: Authenticate git for the private screenpipe-fork dependency
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          git config --global \
            url."https://x-access-token:${GH_TOKEN}@github.com/Meridiona/screenpipe-fork".insteadOf \
            "https://github.com/Meridiona/screenpipe-fork"

      - name: Stamp the version
        # Bound through `env` rather than interpolated into the shell: the value
        # traces back to commit messages via semantic-release's output, and
        # `${{ }}` inside `run:` is the template-injection shape.
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: bash scripts/set-version.sh "$VERSION"

      - name: Install UI + tray deps
        # The UI must build before the tray compiles: frontendDist (ui/out) is
        # EMBEDDED into the binary by generate_context! at compile time, so it is
        # a build input here, not a packaging step.
        run: |
          (cd ui && npm ci --no-audit --no-fund)
          (cd tray && npm ci --no-audit --no-fund)

      - name: Build daemon (${{ matrix.target }})
        run: cargo build --locked --release --bin meridian --target ${{ matrix.target }}

      - name: Place the daemon where tauri-build expects it
        # tauri-build only STATS bundle.resources during compilation (it reads the
        # contents at bundle time), but the path must exist or the build script
        # fails. This job's own arch slice satisfies that; the real universal
        # daemon is lipo'd in the bundle job.
        run: |
          mkdir -p target/release
          cp "target/${{ matrix.target }}/release/meridian" target/release/meridian

      - name: Evict the stale tauri-plugin-notifications fingerprint
        # rust-cache restores target/ (so the fingerprint says "fresh") but NOT
        # registry/src, where the pinned 0.4.6 fork's build.rs writes the Swift
        # static lib. The build script is therefore skipped while the .a it
        # produces is gone, and linking fails with "could not find native static
        # library tauri-plugin-notifications". `--release` is load-bearing:
        # without it the clean targets the debug profile and reports
        # "Removed 0 files". Carried over from the sequential prepareCmd.
        working-directory: tray/src-tauri
        run: cargo clean -p tauri-plugin-notifications --release

      - name: Compile the tray (${{ matrix.target }}, no bundling)
        working-directory: tray
        run: npx tauri build --no-bundle --target ${{ matrix.target }} --config src-tauri/tauri.staging.conf.json

      - name: Upload the two binaries
        uses: actions/upload-artifact@v4
        with:
          name: slice-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/meridian
            target/${{ matrix.target }}/release/meridian-tray
          retention-days: 1
          # Mach-O binaries barely compress; level 0 trades a bigger upload for a
          # much faster one, and this transfer sits on the critical path.
          compression-level: 0

  # ── Stage 3: join — lipo, sign, bundle, notarize, publish ───────────────────
  release:
    name: Bundle universal + publish
    needs: [plan, build]
    if: needs.plan.outputs.release_due == 'true'
    runs-on: macos-26
    permissions:
      contents: write     # the tag, the versioned prerelease, updater-staging
    outputs:
      released: ${{ steps.publish.outputs.released }}
      version: ${{ steps.publish.outputs.version }}
      tag: ${{ steps.publish.outputs.tag }}
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      TAURI_BUNDLER_DMG_IGNORE_CI: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          # The pinned SHA, not `pre-main` by name: this job tags and publishes,
          # and pre-main may have moved since `plan` resolved it. Tagging the
          # exact commit the binaries were built from is the whole point.
          ref: ${{ needs.plan.outputs.sha }}
          fetch-depth: 0      # full history — semantic-release needs the commits
          fetch-tags: true    # and main's v* tags, to compute the prerelease counter
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            ui/package-lock.json
            tray/package-lock.json

      - name: Stamp the version
        # Same value the binaries were built with — tauri.conf.json's version is
        # read at BUNDLE time and becomes what the updater compares against.
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: bash scripts/set-version.sh "$VERSION"

      - name: Install UI + tray deps, and materialise ui/out
        # `tauri bundle` runs beforeBundleCommand, NOT beforeBuildCommand, so
        # nothing here recreates ui/out on its own. The bundled assets are already
        # embedded in the binaries the build jobs produced, but tauri.conf.json's
        # frontendDist still points at ui/out and the bundler resolves that path,
        # so it has to exist. Cheap (~40s) insurance against a late failure.
        run: |
          (cd ui && npm ci --no-audit --no-fund && npm run build)
          (cd tray && npm ci --no-audit --no-fund)

      - uses: actions/download-artifact@v4
        with:
          path: slices

      - name: Assemble the universal binaries
        # upload-artifact does NOT preserve the executable bit, so chmod first or
        # lipo and codesign fail in confusing ways.
        run: |
          set -euo pipefail
          chmod +x slices/slice-*/meridian slices/slice-*/meridian-tray

          mkdir -p target/release target/universal-apple-darwin/release

          lipo -create \
            slices/slice-aarch64-apple-darwin/meridian \
            slices/slice-x86_64-apple-darwin/meridian \
            -output target/release/meridian

          lipo -create \
            slices/slice-aarch64-apple-darwin/meridian-tray \
            slices/slice-x86_64-apple-darwin/meridian-tray \
            -output target/universal-apple-darwin/release/meridian-tray

          echo "daemon: $(lipo -archs target/release/meridian)"
          echo "tray:   $(lipo -archs target/universal-apple-darwin/release/meridian-tray)"

      - name: Import Developer ID certificate + notarization key
        uses: ./.github/actions/import-apple-cert
        with:
          apple-certificate: ${{ secrets.APPLE_CERTIFICATE }}
          apple-certificate-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          apple-api-key-content: ${{ secrets.APPLE_API_KEY_CONTENT }}

      - name: Sign the daemon
        # Must precede bundling: the daemon is copied into the .app as a resource,
        # and re-signing the enclosing bundle does not sign nested Mach-Os.
        run: bash scripts/sign-daemon.sh

      - name: Bundle, sign and notarize
        working-directory: tray
        run: npx tauri bundle --target universal-apple-darwin --bundles app,dmg --config src-tauri/tauri.staging.conf.json

      - name: Notarize and staple the DMG
        # `tauri bundle` notarizes and staples the .app, but it only SIGNS the
        # disk image — the bundler has no notarize call for the DMG, and a
        # notarization ticket is keyed to the cdhash of what was submitted, so
        # the stapled app inside does not cover the container. Without this the
        # DMG a user downloads trips "can't check it for malicious software".
        # Must precede package-updater.sh: stapling rewrites the file, so the
        # stable-named copy has to be taken afterwards to inherit the ticket.
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: bash scripts/notarize-dmg.sh "$VERSION"

      - name: Package the updater artifacts
        # Writes latest.json from the real minisign signature and makes the
        # stable-named Meridian.dmg copy. ALSO the only thing that reads
        # tray/minimum-version and stamps `Minimum-Version:` into the manifest
        # notes — skip it and the forced-update floor silently stops shipping.
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: bash scripts/package-updater.sh "$VERSION"

      - name: Verify the release bundle
        # Independently re-checks signing, notarization, stapling and the
        # presence of the updater artifacts. A non-zero exit here aborts before
        # the tag exists and before anything is published.
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: bash scripts/verify-release-bundle.sh "$VERSION"

      - name: Install release tooling
        run: npm ci --no-audit --no-fund

      - name: Use the parallel staging release config
        run: cp .releaserc.staging.json .releaserc.json

      - name: Assert the version has not moved
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
          PLANNED: ${{ needs.plan.outputs.version }}
        # The binaries above were stamped with `plan`'s version, but the
        # semantic-release run below computes the version independently. They
        # diverge if a v* or v*-staging* tag appeared in between — a concurrent
        # production release.yml run can do exactly that, since it sits in a
        # different concurrency group. Publishing then would ship a release whose
        # artifacts are stamped with a different version than the tag, which the
        # updater compares against — a silently broken update. Cheap to check,
        # and the failure costs only a re-run.
        run: |
          set -o pipefail
          npx semantic-release --dry-run 2>&1 | tee sr-verify.log || true
          actual="$(grep -oE 'The next release version is [0-9][^ ]*' sr-verify.log | tail -1 | awk '{print $NF}')"
          if [ "${actual}" != "${PLANNED}" ]; then
            echo "::error::version moved between plan and publish - built ${PLANNED}, semantic-release now wants ${actual:-<none>}. Re-run the workflow."
            exit 1
          fi
          echo "✓ version still ${PLANNED}"

      - name: semantic-release (publish only)
        id: publish
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
          MERIDIAN_CHANNEL: "staging"
        # Same tag-movement detection as release-staging.yml: sorted by creation
        # date, not version, so semver's "prerelease sorts below release" quirk
        # cannot pick a stale tag. Gates the Windows job below.
        run: |
          before="$(git tag --list 'v*-staging*' --sort=-creatordate | head -1)"
          npx semantic-release
          after="$(git tag --list 'v*-staging*' --sort=-creatordate | head -1)"
          if [ -n "${after}" ] && [ "${before}" != "${after}" ]; then
            echo "released=true"      >> "$GITHUB_OUTPUT"
            echo "version=${after#v}" >> "$GITHUB_OUTPUT"
            echo "tag=${after}"       >> "$GITHUB_OUTPUT"
            echo "→ staging released ${after}"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
            echo "→ no staging release this run"
          fi

      - name: Report what was produced
        if: always()
        run: |
          out=target/universal-apple-darwin/release/bundle
          echo "app:  $(lipo -archs "$out/macos/Meridian.app/Contents/MacOS/meridian-tray" 2>/dev/null || echo '<absent>')"
          ls -la "$out/dmg/" "$out/macos/" || true

      - name: Clean up signing material
        # Runs even on failure — never leave the cert/key on a runner.
        if: always()
        run: |
          security delete-keychain "${RUNNER_TEMP}/meridian-signing.keychain-db" 2>/dev/null || true
          rm -f "${RUNNER_TEMP}/apple-api-key.p8" "${RUNNER_TEMP}/certificate.p12"

  # ── Windows: build + attach to the staging release, exactly like the DMG ────
  #
  # Mirrors release.yml's windows-release job, adapted for the staging channel.
  # Unaffected by the macOS parallelisation — Windows was never part of the
  # sequential macOS build arm, and still builds on its own runner after the
  # macOS release lands.
  #
  windows-release:
    needs: release
    if: needs.release.outputs.released == 'true'
    runs-on: windows-latest
    permissions:
      contents: write     # uploads the installer + merged manifest
    env:
      SQLX_OFFLINE: "true"
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
      MERIDIAN_JIRA_OAUTH_CLIENT_SECRET: ${{ secrets.JIRA_OAUTH_CLIENT_SECRET }}
      MERIDIAN_GITHUB_OAUTH_CLIENT_ID: ${{ secrets.GH_OAUTH_CLIENT_ID }}
      MERIDIAN_POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
      MERIDIAN_CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY_PROD }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      # Same as the macOS staging job — the badge reads "staging".
      MERIDIAN_CHANNEL: "staging"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.tag }}
          persist-credentials: false

      - name: Authenticate git for the private screenpipe-fork dependency
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          git config --global \
            url."https://x-access-token:${GH_TOKEN}@github.com/Meridiona/screenpipe-fork".insteadOf \
            "https://github.com/Meridiona/screenpipe-fork"

      - name: Install Rust 1.93.1
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.93.1"

      - uses: Swatinem/rust-cache@v2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: |
            ui/package-lock.json
            tray/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: ui/.next/cache
          key: nextjs-win-${{ hashFiles('ui/package-lock.json') }}-${{ hashFiles('ui/**/*.ts', 'ui/**/*.tsx') }}
          restore-keys: |
            nextjs-win-${{ hashFiles('ui/package-lock.json') }}-
            nextjs-win-

      - name: Stamp the version
        shell: bash
        env:
          VERSION: ${{ needs.release.outputs.version }}
        # REQUIRED on staging, unlike production. This job checks out the release
        # TAG, and on the staging channel that tag points at a tree where the
        # version was never committed: .releaserc.staging.json has no
        # @semantic-release/git plugin, so the stamped manifests exist only in
        # the macOS runner's working tree and die with it.
        #
        # Without this the installer was built at whatever Cargo.toml/
        # tauri.conf.json last held on pre-main — v1.72.0-staging.5 produced
        # `Meridian_1.71.0_x64-setup.exe` — while the manifest advertised the
        # real version. A Windows app would update, report the old version, see
        # the same update again, and loop.
        #
        # Production does not need this: its config DOES carry the git plugin,
        # so the tag points at the version-bump commit and the tree is stamped.
        run: bash scripts/set-version.sh "$VERSION"

      - name: Install JS dependencies
        shell: bash
        run: |
          (cd ui && npm ci --no-audit --no-fund)
          (cd tray && npm ci --no-audit --no-fund)

      - name: Build the daemon + tray (NSIS, staging)
        shell: bash
        # build:windows:staging passes --config tauri.staging.conf.json, so the
        # installer bakes the updater-staging endpoint. tauri.windows.conf.json
        # still auto-merges (NSIS target + meridian.exe resource).
        run: cd tray && npm run build:windows:staging

      - name: Attach the installer and merge the staging updater manifest
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.release.outputs.version }}
          TAG: ${{ needs.release.outputs.tag }}
          # Windows Python defaults stdout to the cp1252 console codepage, which
          # cannot encode the `✓` merge-windows-updater.py prints on success.
          # It died on that print AFTER writing the merged manifest, so the
          # `gh release upload` below never ran and latest.json never gained its
          # windows-x86_64 key. Forcing UTF-8 fixes the whole class, not just
          # this one character.
          PYTHONIOENCODING: "utf-8"
        run: |
          set -euo pipefail
          NSIS_DIR="target/release/bundle/nsis"
          setup="$(ls "${NSIS_DIR}"/*-setup.exe 2>/dev/null | head -1)"
          [ -n "${setup}" ] || { echo "::error::no NSIS installer in ${NSIS_DIR}"; exit 1; }
          sig="${setup}.sig"
          [ -f "${sig}" ] || { echo "::error::missing updater signature ${sig}"; exit 1; }

          # 1. The versioned installer, on the immutable v<version> prerelease —
          #    this is what the updater manifest's `url` points at, matching how
          #    the macOS tarball lives on the versioned release.
          cp "${setup}" "${NSIS_DIR}/Meridian-setup.exe"
          gh release upload "${TAG}" "${NSIS_DIR}/Meridian-setup.exe" --clobber

          # 2. A stable-named copy on the rolling updater-staging tag, for a
          #    fixed staging-tester download link — the DMG's convenience-copy
          #    equivalent (mirror-staging-release.sh does the same for the DMG).
          gh release upload updater-staging "${NSIS_DIR}/Meridian-setup.exe" --clobber

          # 3. Merge windows-x86_64 into the latest.json on updater-staging (the
          #    manifest installed staging apps poll). The merge refuses to write
          #    unless both darwin-* keys survive intact.
          gh release download updater-staging --pattern latest.json --output latest.json --clobber
          python3 scripts/merge-windows-updater.py \
            latest.json "${VERSION}" \
            "https://github.com/Meridiona/meridian/releases/download/${TAG}/Meridian-setup.exe" \
            "${sig}"
          gh release upload updater-staging latest.json --clobber
          echo "✓ staging Windows installer attached; updater-staging/latest.json updated"
