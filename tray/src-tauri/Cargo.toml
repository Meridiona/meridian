[package]
name = "meridian-tray"
version = "0.1.0"
edition = "2021"

[lib]
name = "meridian_tray_lib"
# DESKTOP-ONLY. `staticlib` (what Xcode links for iOS) and `cdylib` (what
# Android's JNI loader dlopens) are the Tauri v2 MOBILE template defaults and
# are used by nothing on desktop — `main.rs` is four lines that call
# `meridian_tray_lib::run()`, which needs `rlib` alone.
#
# They are not free. Per the Rust reference on linkage, each non-rlib crate type
# gets its OWN codegen AND its own link, and both FFI types pull in the ENTIRE
# upstream closure (`staticlib` "contains all of the local crate's code along
# with all upstream dependencies"). Declaring all three therefore links this
# crate's ~768-crate dependency closure THREE times instead of once — which is
# why one thin glue crate accounted for 4m27s of an 18m48s release build.
#
# There is no gen/apple, no gen/android, and no `mobile_entry_point` in this
# repo. Restore all three if mobile is ever targeted. Upstream tracking issue:
# tauri-apps/tauri#7007.
crate-type = ["rlib"]

[[bin]]
name = "meridian-tray"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.5", features = [] }

[dependencies]
tauri = { version = "2.11", features = ["protocol-asset", "tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-positioner = { version = "2.3", features = ["tray-icon"] }
# Community fork of the official notification plugin (the official one's
# Actions API is mobile-only on desktop). Its macOS layer is a real Swift
# UNUserNotificationCenter implementation: category/action registration, action
# buttons, inline text reply, and an `actionPerformed` event back to us. Pinned
# exact for supply-chain control (consider forking under the Meridiona org).
# `default-features = false` is LOAD-BEARING: the default `notify-rust` feature
# replaces the Swift UNUserNotificationCenter layer with plain notify-rust
# toasts — no categories, no buttons, no action events ("Action types are not
# supported with notify-rust" at category registration).
# CAVEAT: the Swift layer's init hard-fails outside a `.app` bundle, so
# `lib.rs` registers the plugin only when bundled — dev runs have no toasts
# (interactive toasts are packaged-only, same class of limitation as the
# popover-404 dev caveat).
tauri-plugin-notifications = { version = "=0.4.6", default-features = false }
tauri-plugin-opener = "2"
# Email sign-in on the setup wizard's Sign-in step (see ui/app/setup/signin.tsx).
# Community-maintained (Nipsuli/tauri-plugin-clerk) — originally pinned exact
# for supply-chain control, same as tauri-plugin-notifications above. It
# patches `fetch` to route Clerk's session calls through tauri-plugin-http,
# working around Clerk's own documented limitation that cookies don't work on
# Tauri's custom-domain webview. OAuth/social sign-in is NOT supported by this
# plugin — email-code only, which matches the passwordless flow this app uses
# (see clerk.json capability + the manual Clerk dashboard config note in
# commands/account.rs).
#
# VENDORED at 0.1.1 (not the crates.io release) to carry a fix for
# https://github.com/Nipsuli/tauri-plugin-clerk/issues/7: the JS->Rust
# auth-event sync silently failed to persist a signed-in user's session into
# the offline cache for EVERY real signed-in user, so any cold start that
# couldn't complete a live Clerk fetch (e.g. no network yet) showed
# signed-out despite a genuine prior sign-in. See
# `vendor/tauri-plugin-clerk/src/lib.rs`'s module doc for the full writeup
# and `src/json_backfill.rs` for the fix + regression tests. Un-vendor once
# upstream ships a fix (issue #7 has an open, unmerged PR #9) — restore the
# line below to `tauri-plugin-clerk = "=0.1.1"` (or whatever version carries
# the fix) and delete `vendor/tauri-plugin-clerk/`.
tauri-plugin-clerk = { path = "vendor/tauri-plugin-clerk" }
tauri-plugin-http = "=2.5.9"
tauri-plugin-store = "=2.4.3"
# DMG auto-update (Step 1 of the public-distribution plan). Checks the GitHub
# `latest.json` against the running version, downloads the signed `.app.tar.gz`,
# verifies it against the minisign pubkey in tauri.conf.json, swaps it in, and
# relaunches via core `app.restart()` (no separate process plugin needed).
# `rustls-tls` matches the rest of the crate (reqwest above) so we don't pull
# native-tls. This is the DMG path; npm installs still update via `meridian
# update` in a Terminal (commands::run_update) — the two are independent.
tauri-plugin-updater = { version = "2", default-features = false, features = ["rustls-tls"] }
# NOTE: `tauri-plugin-autostart` was REMOVED, not upgraded away. It could only
# write `RunAtLoad` (verified against auto-launch's macOS impl), so it had no way
# to express the morning relaunch the product needs, and it named its plist after
# `productName` instead of `com.meridiona.*`, which is why uninstall never swept
# the login item up. `autostart.rs` owns the LaunchAgent / scheduled task now,
# with no new dependency — it reuses backend_install's launchctl + schtasks
# shell-outs.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Minimum-supported-version comparison for mandatory updates (update.rs);
# already in the tree via tauri, so a direct dep costs nothing.
semver = "1"
# `process` is needed by parents.rs (spawns `meridian ticket-parents`); without
# it a standalone tray build (no otel → no daemon to unify the feature) fails.
tokio = { version = "1", features = ["time", "rt-multi-thread", "process", "macros", "io-util", "net"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
futures-util = "0.3"
# SHA-256 verification of the downloaded runtime tarball against the manifest.
sha2 = "0.10"
# OS-native secret storage (macOS Keychain / Windows Credential Manager) for the
# local meridian.db SQLCipher encryption key — see db_key.rs. Pinned to the "3"
# series deliberately: it ships the simple Entry::new/get_password/set_password
# API used here directly; the "4" series requires manually registering a
# storage backend first, which this app has no need to customize.
keyring = { version = "3", features = ["apple-native", "windows-native"] }
# Generates the random 256-bit db_key.rs encryption key (CSPRNG via OsRng).
# `hex` encodes/decodes it for storage — both already in the workspace lockfile
# via the daemon's root Cargo.toml, so this adds no new crate to the tree.
rand = "0.8"
hex = "0.4"
chrono = { version = "0.4", features = ["clock"] }
# Per-process CPU/RSS sampling for `analytics::perf`. Pinned to the 0.29 line
# ON PURPOSE: the screenpipe fork already pulls sysinfo 0.29.11 in
# transitively, so matching it keeps ONE copy in the tree. Taking a newer
# major here would build a second, duplicate sysinfo and its platform FFI
# alongside the fork's — the same shape as the notifications-plugin link flake.
# Check `cargo tree -p meridian-tray -i sysinfo` before changing this.
sysinfo = { version = "0.29", default-features = false }
# Anonymous per-install id for product analytics (analytics.rs) — already in
# the workspace lockfile transitively, so this adds no new crate to the tree.
uuid = { version = "1", features = ["v4"] }
anyhow = "1"
dotenvy = "0.15"
# Lean shared data layer (DB row types + read queries) — NOT the full daemon.
meridian-core = { path = "../../meridian-core" }
# Shared OAuth/token engine — lets the tray run the Jira/Trello browser login
# IN-PROCESS (no `meridian oauth-login` subprocess). Config-free + DB-free, so it
# adds only reqwest/tokio/sha2 (already in the tree). The Jira client_secret is
# baked into THIS crate at compile time via MERIDIAN_JIRA_OAUTH_CLIENT_SECRET, so
# the tray build must set that env (release.yml does) for packaged Jira OAuth.
meridian-oauth = { path = "../../meridian-oauth" }
# Instrumentation facade for tray commands (no-op without a subscriber).
tracing = "0.1"
# Always available (not feature-gated), used by every build for two things: the
# shipped tray's "Export Diagnostics" Settings action (`commands::diagnostics`)
# calls `meridian::telemetry_spool::build_export_bundle`, and `run()` calls
# `meridian::observability::init("meridian-tray")` UNCONDITIONALLY so the tray's
# own spans/logs land in the shared spool (→ the daemon's shipper → central,
# redacted + error-only) in release too, not just under a dev feature. The OTel
# machinery is already linked via this dep, so the init call adds no new deps.
meridian = { path = "../.." }
# Native-crash capture (Phase 2B): minidumps + fingerprint grouping + release
# health for the tray — the crash class the OTLP spool structurally can't see
# (segfault, panic before the logger inits, OOM). `tauri-plugin-sentry` re-exports
# sentry-rust-minidump, so that is NOT listed separately. Deliberately WITHOUT the
# `tracing` feature: logged errors already egress via the OTLP pipeline (Phase
# 2A), so Sentry stays scoped to crashes/panics and nothing is double-reported.
# rustls transport to match the tray's existing TLS stack (no native-tls/openssl).
# Inert without a baked DSN + user consent (see `crash.rs`) — a source build
# never talks to Sentry.
sentry = { version = "0.42", default-features = false, features = ["backtrace", "contexts", "panic", "reqwest", "rustls"] }
tauri-plugin-sentry = "0.5"
# Forked screenpipe @ last-MIT 892199f74 (Meridiona/screenpipe-fork). In-process
# screen capture + Apple Vision OCR. Optional → only pulled by the `capture`
# feature (heavy: ScreenCaptureKit/cidre/sck-rs). Private repo: local builds use
# the user's git credentials; CI needs a deploy token (future).
screenpipe-screen = { git = "https://github.com/Meridiona/screenpipe-fork", rev = "61332b8a15f09a08876455ad45713eb3b1bfa2df", optional = true }
# Sibling crate in the same fork: the accessibility-tree walker (slice 3b).
# `tree::create_tree_walker` walks the focused window's AX tree → structured
# text — the PRIMARY signal for Electron/Chromium apps (VS Code, Slack), which
# expose nothing to OCR-free a11y until the walker sets AXManualAccessibility
# itself. Optional → only the `capture` feature pulls it.
#
# rev 3c99154 fixed a double-free crash (BUG_IN_CLIENT_OF_LIBMALLOC_POINTER_BEING_FREED_WAS_NOT_ALLOCATED
# in run_app_observer's NotificationGuard teardown) that could fire when a new
# recording session started before the outgoing one finished unregistering
# its NSWorkspace observers. See `start_capture` in `../src/lib.rs` for the
# matching caller-side fix (joining the old recorder thread before restart).
#
# f13c631 (branch fix/autorelease-pool-leaks off 3c99154) wrapped
# run_app_observer's run loop (and the ctx-capture worker / screenpipe-screen's
# frame enumeration) in an autorelease pool — turned out NOT to fix the same
# crash signature: it recurred on a plain pause (single teardown, no restart
# race, reproduced within seconds of a fresh launch), so this isn't an
# autorelease-accumulation bug. `-[NSWorkspaceNotificationCenter
# removeObserver:name:object:]` itself aborts deterministically on macOS 26.3.
#
# Bumped to b2e5b26: run_app_observer now leaks its workspace-observer guards
# (`std::mem::forget`) instead of dropping them, avoiding the crashing
# removeObserver call entirely — see that commit's message and the updated
# WORKSPACE_OBSERVER_LOCK doc comment in macos.rs for the full rationale.
# Root-causing the actual Foundation-side bug needs native tooling (lldb /
# Malloc Stack Logging) this pin bump doesn't attempt.
#
# Bumped to 2b7e929 (screenpipe-screen only needs the bump, but both crates
# are kept pinned to the same rev): adds `screenpipe_screen::monitor_watch`,
# the CGDisplayRegisterReconfigurationCallback watcher extracted from
# upstream screenpipe's `screenpipe-engine::sleep_monitor` (its "Thread 4") —
# see `capture/screenpipe.rs`'s `run_monitor_refresh_task` for the caller.
#
# Bumped to 61332b8 (screenpipe-screen only): the OCR path (Tesseract/
# AppleNative/WindowsNative/Custom/cloud) previously had no PII/password
# redaction at all, unlike screenpipe-a11y's own apply_pii_removal. This
# wires screenpipe_core::remove_pii/remove_pii_from_text_json into
# process_window_ocr's single dispatch point so every OCR engine's output
# is redacted before it reaches the OCR cache or the frame consumer. See
# Meridiona/screenpipe-fork#6.
screenpipe-a11y = { git = "https://github.com/Meridiona/screenpipe-fork", rev = "61332b8a15f09a08876455ad45713eb3b1bfa2df", optional = true }

# Raw Objective-C messaging to set NSWindow collectionBehavior directly: tao's
# `set_visible_on_all_workspaces` only adds CanJoinAllSpaces, never the
# FullScreenAuxiliary flag needed to float the popover over another app's
# fullscreen Space. Already in the tree via tao, so no new transitive cost.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
# Global mouse-event monitor for click-outside dismiss on the non-activating NSPanel.
# Already in the dep tree (transitive via objc2/tao); listed explicitly to use directly.
block2 = "0.6"
# Typed NSWorkspace/NSImage/NSBitmapImageRep bindings for real per-app icon
# extraction (commands/app_icons.rs) — same generation family as objc2 0.6.
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSWorkspace", "NSImage", "NSImageRep", "NSBitmapImageRep", "NSRunningApplication"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSData", "NSDictionary", "NSGeometry", "NSProcessInfo", "NSError"] }
# SMAppService — the sanctioned way to register a login item since macOS 13, and
# the only one that puts a NAMED, user-togglable "Meridian" entry in System
# Settings → General → Login Items & Extensions. Same objc2 generation (0.3.x)
# as the app-kit/foundation bindings above, from the same maintainers, so it adds
# no new FFI style and no new transitive tree — which is why this is preferred
# over the third-party `smappservice-rs` wrapper (0.1.x, last touched May 2025).
#
# Requires macOS 13 at RUNTIME while the app declares LSMinimumSystemVersion
# 10.13, so every call site is gated on `login_item::available()`. See
# `autostart/login_item.rs`.
objc2-service-management = { version = "0.3", default-features = false, features = ["std", "SMAppService", "objc2", "objc2-foundation"] }
# CoreFoundation/Apple-frameworks bindings. Used ONLY for the in-process
# Accessibility-trust prompt (`ax::is_process_trusted_with_prompt`) — the AX
# analogue of `CGRequestScreenCaptureAccess`. Pinned to the same 0.13 line
# screenpipe-a11y uses so Cargo unifies to one cidre build.
#
# Lives in THIS target block, not the shared dependency list, because it is
# Apple-only by construction and cannot build for Windows. The `capture`
# feature still names it via `dep:cidre`; Cargo only activates a
# target-scoped optional dependency when the target matches, so a Windows
# `--features capture` build simply never pulls it. Windows needs no
# equivalent: the fork's own `screenpipe_a11y::platform::windows` reports
# permissions as always granted (UIA/WGC have no TCC analogue).
cidre = { version = "0.13", features = ["ax"], optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
# Same plugin as above, re-declared to turn `notify-rust` ON for Windows only
# (Cargo unions the feature sets of a dependency declared in both places).
#
# This is not an upgrade, it is a requirement: the plugin implements its
# backend as `cfg(all(desktop, feature = "notify-rust"))` OR
# `cfg(all(target_os = "macos", not(feature = "notify-rust")))`. With the
# shared `default-features = false` and no Windows override, a Windows build
# matches neither arm and has no notification backend at all.
#
# notify-rust has no action buttons, no inline reply and no retraction, which
# is exactly why macOS keeps the Swift UNUserNotificationCenter layer instead.
# It is therefore NOT the outbox delivery path on Windows any more: `win_toast.rs`
# drives Windows.UI.Notifications directly for every toast that needs a button
# or a tag. What is still served from here is the plain title+body
# `sys::notify` toast (pause/update/health), which has neither.
tauri-plugin-notifications = { version = "=0.4.6", default-features = false, features = ["notify-rust"] }
# Direct WinRT access, for two things the plugin cannot do on Windows:
#  1. The notification-permission read (`sys::notification_permission_state`). The plugin's
#     notify-rust backend has no permission API of its own — `permission_state()` /
#     `request_permission()` are hardcoded to return `Granted` (see the doc comment on the
#     probe) — so this queries `ToastNotificationManager::CreateToastNotifierWithId` +
#     `ToastNotifier::Setting()`.
#  2. Interactive toasts (`win_toast.rs`): buttons, inline reply, action events and
#     retraction, none of which notify-rust exposes.
# Already a transitive dependency (pulled in by notify-rust's own `tauri-winrt-notification`
# backend), so this adds no new dependency, just our own direct use of it; version kept in the
# same 0.61 line Cargo already resolves so there's no duplicate build.
# The added features are what `win_toast.rs` needs beyond the permission read: the toast XML
# document, the event handler + IPropertyValue (inline-reply text), and the ValueSet it lives in.
windows = { version = "0.61", features = [
    "UI_Notifications",
    "Data_Xml_Dom",
    "Foundation",
    "Foundation_Collections",
] }

[features]
# In-process screen capture is ON by default (Gap-2 Bucket 2 cutover): the
# daemon now reads ONLY the capture tables, so a tray built without `capture`
# is a silent no-op (it produces no frames → no sessions). Every release path
# (`tauri build`, `npm run build`, `npm run tauri build`) builds with default
# features, so defaulting it on is the single source of truth — there is no
# per-call `--features` flag to forget. Build a lean, capture-free tray with
# `--no-default-features`. (ubuntu CI never compiles this crate — `cargo
# clippy`/`test` at the workspace root select the `meridian` package only — so
# the macOS-only cidre/screenpipe-screen stack is not pulled into CI.)
default = ["capture"]
# Pulls the heavy forked screenpipe-screen stack (ScreenCaptureKit/cidre).
capture = [
    "dep:screenpipe-screen",
    "dep:screenpipe-a11y",
    "dep:cidre",
]

# Fixture trees for the install-path resolvers (dev_bin / dev_cwd), so the
# dev-vs-installed choice is tested against a real directory rather than
# whatever happens to exist on the machine running the tests.
[dev-dependencies]
tempfile = "3"
# Test-only: `test-util` gives `#[tokio::test(start_paused = true)]`, which
# advances tokio's clock instantly. commands/daemon.rs's reload rate limit is
# built around a 30 s launchd window; without a paused clock its tests would
# have to sleep through that window for real, so they would either be skipped
# or made meaningless with a shrunken constant that no longer matches the plist.
tokio = { version = "1", features = ["test-util"] }
# Test-only: captures tracing events (level + fields) to assert log-level and
# redaction-allowlist-field regressions in commands/setup.rs's LLM install/
# sign-in logging without spawning a real subscriber pipeline.
tracing-subscriber = { version = "0.3.19", features = ["registry"] }
# Test-only: an in-memory migrated DB for poll::refresh's stale-notice
# reconciliation test — `meridian_core::SqlitePool` is the pool type, but
# querying result rows needs sqlx itself, which the tray binary otherwise
# never touches directly (all DB access goes through meridian/meridian-core).
sqlx = { version = "0.7", default-features = false, features = ["sqlite", "runtime-tokio-rustls", "migrate"] }
