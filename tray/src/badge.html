<!doctype html>
<!-- ambient dev tool that watches what you do and updates your PM tickets automatically, boosting developer productivity -->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Meridian</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; background: transparent; overflow: hidden; }
    #badge {
      width: 28px; height: 28px; box-sizing: border-box; padding: 1px;
      border-radius: 50%; background: rgba(255, 255, 255, 0.92);
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.28);
      cursor: pointer; user-select: none; -webkit-user-select: none;
      transition: transform 0.12s ease;
    }
    #badge:hover { transform: scale(1.1); }
    #badge img { width: 100%; height: 100%; display: block; pointer-events: none; }
  </style>
</head>
<body>
  <div id="badge" title="Write with Meridian"><img src="badge.png" alt="" draggable="false" /></div>
  <script>
    // Same as tapping the writing key. mousedown, not click, so the press lands before the
    // text box could lose anything.
    document.getElementById('badge').addEventListener('mousedown', (e) => {
      e.preventDefault();
      window.__TAURI__.core.invoke('compose_badge_click');
    });
  </script>
</body>
</html>
