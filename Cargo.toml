[workspace]
members = [".", "meridian-core", "meridian-oauth", "tray/src-tauri"]
resolver = "2"

# Release profile — every value here is cargo's DEFAULT, stated explicitly so
# the reasoning survives. This block is a GUARD, not a tuning: the two knobs
# people reach for when they want a "more optimised" release build both make
# this workspace's build 1.5-2x SLOWER for no runtime gain worth having.
#
#   lto = true / "fat"    1.5-2x slower to build (Tauri's own docs say so) for
#                         a ~20-30% smaller binary. We link a ~768-crate closure;
#                         this is the single most expensive thing you could add.
#   codegen-units = 1     MEASURED SLOWER than the default 16 — alacritty#6467
#                         benchmarked cu=1/2/6/12/16/256 and cu=1 came out ~13%
#                         behind. It is not a free win; it is a regression.
#   panic = "abort"       ~5-10% less codegen, but breaks catch_unwind and
#                         changes crash behaviour. We ship a data daemon; no.
#
# opt-level stays at 3: the session distiller's embedder does real matmul work
# (candle + Accelerate), so dropping to 2 is a runtime regression we have not
# measured. Revisit only with a benchmark in hand.
#
# strip stays "none": `debug = false` already keeps these binaries small, and
# the symbol table is what makes a shipped user's exported-diagnostics backtrace
# readable. Build-time cost of keeping it is nil.
[profile.release]
opt-level     = 3
lto           = false
codegen-units = 16
debug         = false
strip         = "none"
panic         = "unwind"
incremental   = false

[package]
name = "meridian"
version = "1.83.2"
edition = "2021"
description = "Meridian — ambient developer-efficiency tool that keeps Jira, GitHub, and Linear in sync"
authors = ["Meridiona"]
repository = "https://github.com/meridiona/meridian"
license = "MIT"
keywords = ["developer-tools", "productivity", "activity-tracking", "jira", "screenpipe"]

[lib]
name = "meridian"
path = "src/lib.rs"

[[bin]]
name = "meridian"
path = "src/main.rs"

[[bin]]
name = "cat_smoke"
path = "src/bin/cat_smoke.rs"

[dependencies]
# Global allocator — returns freed pages to the OS proactively (unlike the platform
# default allocators, which retain freed arenas for reuse). The embedder's chunked
# batches free a full tensor set every ~16-32 spans; without this, RSS plateaus at
# whatever the highest transient chunk cost was instead of settling back down.
# Cross-platform (macOS/Windows/Linux, ARM/x86) — see src/lib.rs's global allocator.
mimalloc = "0.1"

# DB — exact versions matching screenpipe
sqlx = { version = "0.7", features = ["sqlite", "runtime-tokio-rustls", "chrono", "migrate", "json"] }
# "bundled-sqlcipher-vendored-openssl", not plain "bundled": see meridian-core's
# Cargo.toml comment on the same line — this direct dep is what carries the
# feature into the single resolved libsqlite3-sys build (Cargo feature
# unification) that every workspace member links, including the tray.
libsqlite3-sys = { version = "0.26", features = ["bundled-sqlcipher-vendored-openssl"] }
sqlite-vec = "0.1.3"

# Shared lean data layer (DB row types + read queries) — also depended on by the
# Tauri dashboard, so the queries live in ONE place (single source of truth).
meridian-core = { path = "meridian-core" }

# Shared OAuth/token engine (Jira/Trello browser login + token store + refresh).
# Also depended on by the Tauri tray so login runs in-process — single source of
# truth for the flow, specs, and token store. The daemon re-exports it under
# `crate::intelligence::oauth`.
meridian-oauth = { path = "meridian-oauth" }

# Async
tokio = { version = "1.15", features = ["full"] }
futures = "0.3.31"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Time
chrono = { version = "0.4.31", features = ["serde"] }

# Logging + observability
tracing = "0.1.40"
tracing-subscriber = { version = "0.3.19", features = ["env-filter", "chrono", "json", "registry"] }
tracing-opentelemetry = "0.28"
opentelemetry = "0.27"
opentelemetry_sdk = { version = "0.27", features = ["rt-tokio", "logs"] }
# NB: `reqwest-rustls`, NOT `reqwest-client`. The latter routes through
# `opentelemetry-http/reqwest`, which enables reqwest with its DEFAULT features —
# and one of those is native-tls. Cargo feature unification is additive, so that
# single feature would flip reqwest's native-tls ON across the workspace, silently
# defeating the `default-features = false` we set on every direct reqwest dep
# (here, meridian-oauth, tray) and building reqwest's native-tls path (hyper-tls,
# plus openssl on Linux) alongside the rustls one we actually use. `reqwest-rustls`
# routes through `opentelemetry-http/reqwest-rustls` instead, so opentelemetry does
# NOT enable reqwest's native-tls feature. (native-tls may still appear in the lock
# via unrelated deps; the point here is only that our OTLP/reqwest usage stays on
# rustls, not that native-tls is purged from the whole graph.)
opentelemetry-otlp = { version = "0.27", default-features = false, features = ["http-proto", "reqwest-rustls", "trace", "logs"] }
opentelemetry-appender-tracing = { version = "0.27", features = ["experimental_metadata_attributes"] }
opentelemetry-semantic-conventions = "0.27"
# Direct dep (was transitive-only via opentelemetry-otlp): decodes spooled
# .otlp files back to structured log/span records for `meridian logs`
# (src/telemetry_spool/render.rs) — no live OpenObserve needed to read them.
opentelemetry-proto = { version = "0.27", default-features = false, features = ["gen-tonic-messages", "trace", "logs"] }
# Resolves the `host.name` OTel resource attribute (observability/mod.rs). Was
# already a transitive dep (via opentelemetry-otlp's stack); made explicit.
gethostname = "1.1.0"
prost = "0.13"
hex = "0.4"

# Error handling
anyhow = "1.0.86"

# HTTP client for PM provider APIs (Jira, GitHub, Linear)
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

# Misc
once_cell = "1.19"
dotenvy = "0.15"
shellexpand = "3"
# Session-distiller text pipeline (segment/junk/prose gates, entity extraction).
regex = "1"

# On-device embedding model for the session distiller's SemDeDup — pure-Rust (candle),
# no C++/ONNX runtime. Runs on CPU (see src/embedder/device.rs): candle's *default* CPU
# backend has no BLAS acceleration at all (plain safe-Rust matmul), which made an
# unusually heavy hour's batch take 45s+. macOS ships Accelerate.framework (vecLib/BLAS)
# on every Mac, Intel or Apple Silicon, with no extra download or licensing — enabled
# below for a large matmul speedup with zero cross-platform risk. Windows/Linux stay on
# the plain backend for now (candle's `mkl` feature needs a bundled/system MKL install,
# x86-only, and is a separate follow-up). Weights are fetched at setup via the existing
# `reqwest` (no hf-hub), see src/embedder/provision.rs. `dirs` resolves the cross-platform
# model cache dir.
# `fancy-regex` is the pure-Rust regex backend (vs `onig`, which is C) — required by
# tokenizers for its Split/Replace pre-tokenizers.
tokenizers = { version = "0.21", default-features = false, features = ["fancy-regex"] }

dirs = "5"

# Telemetry spool: tar+gz for export/import CLI
tar = "0.4"
flate2 = "1"

# HttpClient trait for SpoolClient
opentelemetry-http = "0.27"
async-trait = "0.1"
bytes = "1"
http = "1.1"

# Telemetry import needs a tempdir at runtime (not just in tests)
tempfile = "3"

# OAuth (PKCE) — browser-based auth for PM providers (Jira, Linear)
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
jsonschema = { version = "0.48.0", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
candle-core = { version = "0.10", features = ["accelerate"] }
candle-nn = { version = "0.10", features = ["accelerate"] }
candle-transformers = { version = "0.10", features = ["accelerate"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
candle-core = "0.10"
candle-nn = "0.10"
candle-transformers = "0.10"

[dev-dependencies]
tokio       = { version = "1.15", features = ["full", "test-util"] }
tempfile    = "3"
serial_test = "3"
