[package]
name = "meridian-core"
version = "0.1.0"
edition = "2021"
description = "Lean shared data layer (DB types + read queries) for the Meridian daemon and dashboard"

[dependencies]
# Deliberately minimal — only what the shared read layer needs. NO daemon deps
# (no screenpipe, MLX, trackers, OTel), so the Tauri app can depend on this
# without pulling the whole daemon tree.
sqlx = { version = "0.7", features = ["sqlite", "runtime-tokio-rustls"] }
# "bundled-sqlcipher-vendored-openssl" instead of plain "bundled": builds SQLCipher
# (not stock SQLite) with a vendored OpenSSL, so meridian.db can be opened with an
# encryption key (see db_crypto.rs). This is a DIRECT dep here and at the workspace
# root specifically so Cargo's feature unification carries this feature into the
# ONE resolved libsqlite3-sys build every workspace member (daemon, tray) links —
# sqlite-vec and sqlite files with no key set still open exactly as before
# (SQLCipher is a strict superset: a plain file opens fine when no key is set).
libsqlite3-sys = { version = "0.26", features = ["bundled-sqlcipher-vendored-openssl"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0.86"
chrono = "0.4.31"
# Home-directory lookup for `util::paths` (the one place `~/` is expanded).
# Needed because `$HOME` is unset on Windows; `dirs` falls back to the
# platform's own profile-directory API there. Already in the daemon's tree, so
# this adds nothing new to the workspace lockfile.
dirs = "5"
# Instrumentation facade only (~no-op without a subscriber) — the heavy OTLP
# exporter is wired by the binary (daemon, or the tray's `otel` dev feature).
tracing = "0.1"
# `process` for `proc_ext::NoWindow`'s impl on `tokio::process::Command` (the std
# impl needs no dep); `time` for `retry::retry_transient`'s async backoff sleep.
# tokio is already in the workspace tree via sqlx's tokio runtime and every binary
# that depends on this crate (daemon, tray) already builds it with `full`, so
# feature-unification means this adds nothing new to compile — it just brings the
# `process` and `time` modules into scope here.
tokio = { version = "1", features = ["process", "time"] }

[dev-dependencies]
# For the #[ignore]d golden-compare smoke test (runs get_today against the real DB).
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
# Integration tests build an in-memory schema + seed rows to exercise the
# readers (sqlx is a regular dep, but integration tests need it in scope too).
sqlx = { version = "0.7", features = ["sqlite", "runtime-tokio-rustls"] }
# db_crypto.rs tests exercise real on-disk migration/export, so they need real
# temp files (not just `sqlite::memory:`).
tempfile = "3"
