# Cloudflare Worker: Hugging Face caching proxy for Meridian model downloads.
#
# Reverse-proxies huggingface.co and caches the model weight blobs at Cloudflare's
# edge so first-run downloads stop stalling/retrying against HF directly. The MLX
# server points `HF_ENDPOINT` at this Worker's route (see
# tray/src-tauri/src/mlx_server.rs::hf_endpoint + the mlx-server plist).
#
# ── One-time infra setup (dashboard, NOT expressible in this file) ─────────────
#  1. Add the `meridiona.com` zone to Cloudflare and create the DNS/route below.
#  2. Enable **Cache Reserve** for the zone (Caching → Cache Reserve). Cloudflare's
#     default edge cache won't retain the ~1.4 GB llm file (non-Enterprise plans cap
#     cacheable objects at 512 MB); Cache Reserve (R2-backed) has no size cap and is
#     what actually makes the big file cache. It is a billed add-on.
#  3. Deploy:  wrangler deploy    (local iteration:  wrangler dev)
#  4. Turn the proxy ON in the app by baking MERIDIAN_HF_ENDPOINT=https://hf.meridiona.com
#     at build time (option_env! in mlx_server::hf_endpoint) — it ships DISABLED.

name = "meridian-hf-proxy"
main = "src/index.js"
compatibility_date = "2026-07-01"

# Bind the Worker to the custom domain that HF_ENDPOINT points at. Uncomment and
# adjust once the zone exists (a custom-domain route also provisions the DNS record):
# routes = [
#   { pattern = "hf.meridiona.com", custom_domain = true },
# ]

# Observability — surface request/cache metrics in the Cloudflare dashboard.
[observability]
enabled = true
